fter about 20 minutes of unrelieved ischemia, this ST-elevation MI requires urgent revascularization (\"time is muscle\") to minimize necrosis. B, C, and D understate the time-critical nature of MI treatment."}, {"q": "A patient with sudden severe chest pain worsened by deep breathing and lying flat, but relieved by sitting forward, is found to have a pericardial friction rub. Which diagnosis is most likely?", "opts": ["Stable angina, producing pain that is relieved specifically by rest", "Acute pericarditis", "Deep venous thrombosis, presenting with unilateral leg swelling", "Raynaud phenomenon, presenting with digital color changes on cold exposure"], "ans": 1, "exp": "Correct — B: Chest pain worsened by respiration/lying down, relieved by sitting forward, with a pericardial friction rub, is classic for acute pericarditis. A, C, and D do not present with this specific pericardial symptom pattern."}, {"q": "A patient with known pericardial effusion suddenly develops hypotension, distended neck veins, and muffled heart sounds. Which life-threatening complication is most likely, and what is the underlying mechanism?", "opts": ["Stable angina, from a fixed coronary stenosis limiting flow during exertion", "Cardiac tamponade, from rapid pericardial fluid accumulation compressing the heart and impairing filling", "Chronic venous insufficiency, from long-standing lower extremity valve failure", "Rheumatic fever, from a delayed immune reaction to streptococcal pharyngitis"], "ans": 1, "exp": "Correct — B: Hypotension, jugular venous distention, and muffled heart sounds (Beck triad) in a patient with pericardial effusion describe cardiac tamponade, caused by rapid fluid accumulation compressing the heart. A, C, and D do not match this acute presentation."}, {"q": "A patient with a history of tuberculosis develops thickened, calcified pericardium on imaging, along with signs of reduced cardiac output and systemic venous congestion. Which condition is most likely?", "opts": ["Mitral valve prolapse, causing a mid-systolic click and late systolic murmur", "Acute pericarditis, from a single self-limited viral inflammatory episode", "Dilated cardiomyopathy, from progressive thinning and enlargement of the ventricle", "Constrictive pericarditis, from fibrous scarring/calcification encasing the heart in a rigid shell"], "ans": 3, "exp": "Correct — D: Thickened, calcified pericardium restricting cardiac filling and output describes constrictive pericarditis, which can follow chronic inflammatory conditions like tuberculosis. B, C, and A describe different conditions without this fibrotic, encasing pericardial pathology."}, {"q": "A patient's echocardiogram shows an enlarged, thin-walled left ventricle with poor contractility and a low ejection fraction, with no evidence of coronary artery disease. Which cardiomyopathy category is most likely?", "opts": ["Hypertrophic cardiomyopathy, with asymmetric septal wall thickening", "Dilated cardiomyopathy", "Restrictive cardiomyopathy, with stiff, non-compliant ventricular walls", "A normal echocardiogram, with preserved wall thickness and ejection fraction"], "ans": 1, "exp": "Correct — B: An enlarged, thin-walled, poorly contractile ventricle with reduced ejection fraction describes dilated cardiomyopathy. A (thickened walls with preserved/hyperdynamic function) and C (stiff, non-compliant walls with impaired filling) present differently, and D is inconsistent with the described abnormal findings."}, {"q": "A young athlete collapses during exercise. Autopsy reveals asymmetric septal hypertrophy of the left ventricle. Which cardiomyopathy is most likely, and how does chamber size typically change?", "opts": ["Hypertrophic cardiomyopathy, with increased wall thickness that can obstruct outflow", "Dilated cardiomyopathy, with an enlarged chamber and thin, poorly contractile walls", "Restrictive cardiomyopathy, with normal wall thickness but severely impaired filling", "A structurally normal heart, with no hypertrophy or chamber abnormality"], "ans": 0, "exp": "Correct — A: Asymmetric septal hypertrophy causing sudden cardiac death in a young athlete is classic for hypertrophic cardiomyopathy, in which increased wall thickness can obstruct ventricular outflow. B and C describe different structural patterns, and D dismisses a clearly abnormal, clinically significant finding."}, {"q": "A patient with echocardiographic findings of a thick, non-compliant left ventricle with normal systolic function but severely impaired diastolic filling is diagnosed with which cardiomyopathy?", "opts": ["Takotsubo syndrome, a stress-induced transient apical ballooning cardiomyopathy", "Dilated cardiomyopathy, with ventricular enlargement and reduced systolic function", "Hypertrophic obstructive cardiomyopathy, with asymmetric septal thickening", "Restrictive cardiomyopathy"], "ans": 3, "exp": "Correct — D: D stiff, non-compliant ventricle with impaired diastolic filling but preserved systolic function describes restrictive cardiomyopathy. B and C involve different structural changes (dilation with thin walls, or asymmetric hypertrophy with possible outflow obstruction), and A is a distinct stress-induced cardiomyopathy not described in this summary."}, {"q": "A patient with mid-systolic click and late systolic murmur on auscultation, but no other symptoms, is diagnosed with a common valvular condition. Which condition is this, and how variable is its presentation?", "opts": ["Aortic stenosis; presents with a harsh systolic ejection murmur and is always severely symptomatic", "Mitral valve prolapse; it may be completely asymptomatic or produce unpredictable symptoms", "Infective endocarditis; presents with fever and vegetations and always requires emergency surgery", "Constrictive pericarditis; presents with venous congestion and is always fatal without treatment"], "ans": 1, "exp": "Correct — B: B mid-systolic click with late systolic murmur is classic for mitral valve prolapse, which can range from completely asymptomatic to producing unpredictable symptoms. A, C, and D mischaracterize the typical presentation/severity of these other conditions."}, {"q": "A patient with a history of untreated streptococcal pharyngitis several weeks ago now presents with migratory joint pain, carditis, and subcutaneous nodules. Which condition is most likely, and what serious long-term complication can develop?", "opts": ["Pericarditis, from a self-limited viral infection; typically leads to tamponade", "Infective endocarditis, from direct bacterial invasion of the valve; leads to cardiomyopathy", "Kawasaki disease, from an acute systemic vasculitis; leads to coronary aneurysm", "Rheumatic fever, from a delayed immune response to strep infection; can progress to rheumatic heart disease"], "ans": 3, "exp": "Correct — D: Migratory arthritis, carditis, and subcutaneous nodules weeks after strep pharyngitis describe rheumatic fever (a delayed immune response), which can progress to rheumatic heart disease if severe/untreated. B, C, and A describe different conditions with different triggers and complications."}, {"q": "An IV drug user presents with fever, a new heart murmur, and small hemorrhages under the fingernails. Blood cultures grow Staphylococcus aureus. Which diagnosis is most likely, and what three elements were required for its pathogenesis?", "opts": ["Dilated cardiomyopathy; requires viral infection, myocardial damage, and dilation", "Rheumatic fever; requires strep infection, delayed immune response, and joint pain", "Infective endocarditis; requires endocardial damage, microorganism adherence to the damaged surface, and vegetation formation", "Raynaud phenomenon; requires cold exposure, vasospasm, and color change"], "ans": 2, "exp": "Correct — C: Fever, new murmur, and embolic phenomena (nail hemorrhages) with positive blood cultures in an IV drug user (a risk factor for endocardial damage/bacteremia) describe infective endocarditis, requiring endocardial damage, microbial adherence, and vegetation formation. B, A, and D describe unrelated conditions with different required pathogenic steps."}, {"q": "A patient with chronic hypertension develops progressive dyspnea, orthopnea, and pulmonary edema. Echocardiogram shows a dilated left ventricle with an ejection fraction of 25%. Which type of heart failure is this, and what hemodynamic change explains the pulmonary edema?", "opts": ["Right heart failure; caused by isolated pulmonary artery stenosis without LV involvement", "Heart failure with preserved ejection fraction; caused by decreased preload from hypovolemia", "Heart failure with reduced ejection fraction (systolic HF); increased LV end-diastolic pressure/volume backs up into the pulmonary circulation, causing pulmonary edema", "High-output failure; caused by severe anemia reducing oxygen-carrying capacity"], "ans": 2, "exp": "Correct — C: C low ejection fraction (25%) with dyspnea/orthopnea/pulmonary edema describes systolic (reduced EF) heart failure, in which increased LV preload/pressure backs up into the pulmonary venous system, causing pulmonary edema. B requires a preserved (not reduced) EF, and A and D describe different heart failure categories with different mechanisms."}, {"q": "A patient with heart failure is started on a beta-blocker, ACE inhibitor, and diuretic. What is the rationale for targeting the sympathetic nervous system and RAAS with this regimen?", "opts": ["These neuroendocrine systems become activated in heart failure and, while initially compensatory, ultimately exacerbate and perpetuate the condition if left unchecked", "These systems are activated only in acute pericarditis, not in chronic heart failure", "Beta-blockers and ACE inhibitors act solely by lowering blood pressure, with no effect on remodeling", "Diuretics work by directly increasing myocardial contractility rather than reducing volume"], "ans": 0, "exp": "Correct — A: The sympathetic nervous system and RAAS are activated in heart failure as a neuroendocrine response that, over time, exacerbates and perpetuates the condition — which is why blocking these pathways (beta-blockers, ACE inhibitors) alongside diuretics for volume management form the pharmacologic foundation of HF therapy. B, C, and D understate or misstate the rationale for this standard regimen."}, {"q": "A patient with COPD and chronic pulmonary hypertension develops jugular venous distention, hepatomegaly, and peripheral edema, with normal left ventricular function. Which type of heart failure is most likely, and what is the underlying cause?", "opts": ["Heart failure with preserved ejection fraction from long-standing hypertension", "Left heart failure with reduced ejection fraction from ischemic cardiomyopathy", "High-output failure from severe anemia and reduced oxygen delivery", "Right heart failure, resulting from pulmonary disease increasing resistance against the right ventricle"], "ans": 3, "exp": "Correct — D: Jugular distention, hepatomegaly, and peripheral edema with preserved LV function in a patient with chronic lung disease describe right heart failure, commonly caused by pulmonary disease (or left heart failure, which is not present here) increasing resistance against right ventricular output. B, C, and A do not fit this specific presentation and cause."}, {"q": "A patient with severe anemia and a very high cardiac output develops symptoms of heart failure despite normal or elevated myocardial contractility. Which type of heart failure is this, and why does it occur despite normal heart function?", "opts": ["Right heart failure from chronic pulmonary disease raising pulmonary vascular resistance", "Low-output systolic failure from primary myocardial contractile impairment", "High-output failure; the heart cannot keep pace with the body's exaggerated metabolic/oxygen-carrying demands despite adequate volume and contractility", "Heart failure from fixed valvular stenosis limiting forward stroke volume"], "ans": 2, "exp": "Correct — C: Heart failure symptoms despite adequate volume and normal/elevated contractility, in the setting of a very high-demand state like severe anemia, describes high-output failure — the heart is functioning well but still cannot keep up with the body's abnormally elevated demand. B, A, and D describe different heart failure categories with different underlying mechanisms not matching this scenario."}]}, {"title": "Alterations of Cardiovascular Function in Children", "code": "Chapter 33", "color": "c10", "subtitle": "Congenital Heart Disease (Acyanotic & Cyanotic Defects) • Acquired Pediatric Cardiovascular Disorders", "general": [{"q": "Congenital heart defects can result from which types of causes?", "opts": ["Environmental and genetic causes", "Only postnatal dietary deficiencies occurring after birth", "Only causes acquired after age 5, with no prenatal contribution", "Exclusively idiopathic causes with no identifiable genetic or environmental factor"], "ans": 0, "exp": "Correct — A: Congenital heart defects have both environmental (maternal infections, radiation, metabolic disorders, alcohol/drug use, perinatal conditions) and genetic causes. B, C, and D do not reflect the described multifactorial congenital origin."}, {"q": "Which genetic syndromes are associated with congenital heart defects?", "opts": ["Only cystic fibrosis, a disorder primarily affecting pulmonary and exocrine function", "Only Marfan syndrome, a connective tissue disorder affecting the aorta", "Down syndrome, trisomy 13, trisomy 18, cri du chat syndrome, 22q11 deletion syndrome, and Turner syndrome", "Only sickle cell disease, a hemoglobinopathy affecting red blood cells"], "ans": 2, "exp": "Correct — C: The summary review lists Down syndrome, trisomy 13, trisomy 18, cri du chat syndrome, 22q11 deletion syndrome, and Turner syndrome as genetic factors associated with CHD. B, A, and D are not the syndromes specifically listed."}, {"q": "Congenital heart defects are classified based on which four functional categories?", "opts": ["Increased pulmonary blood flow, obstruction to flow, decreased pulmonary blood flow, or mixed desaturated/saturated blood", "Mild, moderate, severe, and critical categories based on symptom severity alone", "Left-sided, right-sided, and bilateral categories based on chamber location", "Acute and chronic categories based only on the timing of symptom onset"], "ans": 0, "exp": "Correct — A: CHDs are classified by whether they cause increased pulmonary blood flow, obstruction to flow, decreased pulmonary blood flow, or mixing of desaturated/saturated blood. B, C, and D are not the classification scheme described."}, {"q": "Cyanosis in congenital heart disease can result from which mechanisms?", "opts": ["Restricted pulmonary blood flow, pulmonary overcirculation, or right-to-left shunting of unoxygenated blood", "Only from anemia, a reduction in circulating hemoglobin concentration", "Only from excess pulmonary blood flow, with shunting never contributing", "Only from left-to-right shunting, which does not deprive systemic circulation"], "ans": 0, "exp": "Correct — A: Cyanosis can result from defects restricting pulmonary blood flow, overloading the pulmonary circulation, or causing right-to-left shunting of unoxygenated blood into systemic circulation. B, C, and D do not capture the range of mechanisms described."}, {"q": "In a congenital heart defect with an abnormal communication between circuits, what determines the direction of shunt blood flow?", "opts": ["The child's age alone, independent of pressure gradients between circuits", "Differences in pressure and resistance between the two systems, with flow always moving from high to low pressure", "Random, unpredictable variation unrelated to any hemodynamic principle", "The direction is fixed as right-to-left regardless of relative chamber pressures"], "ans": 1, "exp": "Correct — B: Shunt direction depends on pressure/resistance differences between the pulmonary and systemic circuits, with blood always flowing from an area of high pressure to an area of low pressure. A, C, and D do not reflect this pressure-driven principle."}, {"q": "Which defects are classified as acyanotic congenital defects that increase pulmonary blood flow?", "opts": ["Tetralogy of Fallot and tricuspid atresia, both cyanotic defects", "ASD, VSD, PDA, or AVC (left-to-right shunts)", "Transposition of the great arteries, a cyanotic mixing defect", "Hypoplastic left heart syndrome, a cyanotic mixing defect"], "ans": 1, "exp": "Correct — B: Acyanotic defects with abnormal openings (ASD, VSD, PDA, AVC) permit left-to-right shunting, which does not cause cyanosis since it doesn't interfere with systemic oxygenated blood flow. A, C, and D are cyanotic defects, not acyanotic ones."}, {"q": "Why do acyanotic left-to-right shunting defects not cause cyanosis?", "opts": ["Because the shunt does not interfere with the flow of oxygenated blood through the systemic circulation", "Because these defects do not involve any communication between the chambers", "Because left-to-right shunting lesions always resolve spontaneously before birth", "Because cyanosis depends only on hemoglobin level, not on oxygen saturation"], "ans": 0, "exp": "Correct — A: Left-to-right shunting moves oxygenated blood from the systemic (left) side to the pulmonary (right) side, without depriving the systemic circulation of oxygenated blood, so cyanosis does not occur. B, C, and D misstate the underlying reasoning."}, {"q": "Which two defects are common causes of acyanotic obstruction of ventricular outflow?", "opts": ["TGA and TAPVC, both cyanotic mixing defects rather than obstructive lesions", "ASD and VSD, acyanotic shunting defects rather than obstructive lesions", "Tetralogy of Fallot and tricuspid atresia, cyanotic defects with decreased pulmonary flow", "Pulmonic stenosis (PS) and aortic stenosis (AS)"], "ans": 3, "exp": "Correct — D: Acyanotic ventricular outflow obstruction is commonly caused by pulmonic stenosis (PS) or aortic stenosis (AS), with compensatory ventricular hypertrophy or collateral circulation helping maintain output in less severe cases. B describes shunting lesions, and C and A describe cyanotic defects, not obstructive acyanotic ones."}, {"q": "Which cyanotic congenital defects involve mixing of saturated and desaturated blood within the heart or great arteries?", "opts": ["TGA, TAPVC, TA, and HLHS", "ASD and VSD only, acyanotic left-to-right shunting defects", "PS and AS only, acyanotic obstructive lesions of ventricular outflow", "Coarctation of the aorta only, an acyanotic obstructive lesion"], "ans": 0, "exp": "Correct — A: TGA (transposition of the great arteries), TAPVC (total anomalous pulmonary venous connection), TA (truncus arteriosus), and HLHS (hypoplastic left heart syndrome) are cyanotic defects that mix saturated/desaturated blood within the heart or great arteries. B, C, and D describe acyanotic shunting or obstructive lesions instead."}, {"q": "In cyanotic defects that decrease pulmonary blood flow, such as tetralogy of Fallot, what limits the heart's ability to compensate?", "opts": ["The right ventricle hypertrophies enough to fully normalize pulmonary blood flow", "Myocardial hypertrophy cannot compensate for restricted right ventricular outflow, so flow to the lungs decreases and right-to-left shunting causes cyanosis", "These defects cause no hemodynamic compromise since collateral vessels fully compensate", "Only the atria are structurally affected, with entirely normal ventricular outflow"], "ans": 1, "exp": "Correct — B: In defects like tetralogy of Fallot and tricuspid atresia, myocardial hypertrophy cannot fully compensate for restricted RV outflow, leading to decreased pulmonary flow, insufficient oxygenated blood, and right-to-left shunt-driven cyanosis. A, C, and D contradict this described pathophysiology."}, {"q": "What is the general goal of initial treatment for congenital heart disease?", "opts": ["No treatment is available for congenital heart defects, which are managed expectantly", "Controlling heart failure symptoms or cyanosis, using catheterization procedures or surgical palliation/repair to establish pulmonary blood flow or restore normal circulation", "Treatment is uniformly delayed until adulthood, regardless of defect severity", "Only dietary and caloric modification is used, without catheter-based or surgical intervention"], "ans": 1, "exp": "Correct — B: Initial CHD treatment (varying by defect) aims to control HF symptoms or cyanosis, using catheterization-based interventions or surgical palliation/repair to establish pulmonary blood flow or restore normal circulation. A, C, and D misstate the treatment approach."}, {"q": "What is a clinical manifestation of heart failure that is unique to infants and children, distinguishing it from adult presentations?", "opts": ["Failure to thrive (FTT)", "Chronic stable angina, an adult presentation of exertional myocardial ischemia", "Peyronie disease, an adult condition affecting penile connective tissue", "Andropause, an adult decline in testosterone with aging"], "ans": 0, "exp": "Correct — A: Failure to thrive is described as a clinical manifestation of heart failure unique to children, alongside the more typical HF symptoms. B, C, and D are not relevant to pediatric heart failure and are adult-specific or unrelated conditions."}, {"q": "What is the most common cause of heart failure in infants and young children versus older children, respectively?", "opts": ["Coronary artery disease in both age groups, from early atherosclerotic plaque", "Congenital heart defects increasing pulmonary blood volume in infants; LV dysfunction from causes like viral myocarditis, rheumatic heart disease, or Kawasaki disease in older children", "Hypertension in infants; congenital defects presenting only in older children", "Valvular disease in infants; anemia exclusively in older children"], "ans": 1, "exp": "Correct — B: HF in infants/young children is usually due to congenital heart defects increasing pulmonary blood volume, while HF in older children more often results from LV dysfunction from viral myocarditis, rheumatic heart disease, autoimmune disorders, anemia, Kawasaki disease, or hypothyroidism. A, C, and D do not match this described age-related pattern."}, {"q": "Kawasaki disease is best described as:", "opts": ["A chronic degenerative valve disease that develops slowly over many decades of adult life, unrelated to childhood vasculitis", "A congenital heart defect present at birth, unrelated to acquired vasculitis", "An acute systemic vasculitis that may cause coronary artery aneurysms and thrombosis if untreated", "An inherited cardiomyopathy caused by a sarcomeric gene mutation"], "ans": 2, "exp": "Correct — C: Kawasaki disease is an acute systemic vasculitis (blood vessel inflammation) that, if untreated, may lead to coronary artery aneurysms and thrombosis. B, A, and D mischaracterize this acquired, inflammatory pediatric vascular disease."}, {"q": "When significant hypertension is found in young children, what should be strongly suspected, given how pediatric HTN typically differs from adult HTN?", "opts": ["White coat hypertension only, limited to elevated readings in clinical settings", "Primary (essential) hypertension, the most likely diagnosis just as it is in most hypertensive adults", "Secondary hypertension, most commonly from renal disease or coarctation of the aorta", "No further diagnostic evaluation is needed regardless of the severity found"], "ans": 2, "exp": "Correct — C: Because pediatric hypertension differs in etiology/presentation from adult HTN, significant HTN in young children should prompt evaluation for secondary causes, most commonly renal disease or coarctation of the aorta. B, A, and D do not reflect the described pediatric-specific evaluation priority."}], "clinical": [{"q": "A newborn with Down syndrome is found on echocardiogram to have an atrioventricular canal defect (AVC) with left-to-right shunting. Is this expected to cause cyanosis, and why?", "opts": ["No, because AVC is a purely obstructive lesion with no abnormal shunting", "Yes, because every congenital heart defect inevitably produces cyanosis", "Yes, because AVC defects characteristically cause right-to-left shunting", "No, because left-to-right shunting does not interfere with the flow of oxygenated blood through the systemic circulation"], "ans": 3, "exp": "Correct — D: AVC is an acyanotic defect with left-to-right shunting, which does not deprive the systemic circulation of oxygenated blood, so cyanosis is not expected. B, C, and A misstate the shunt direction and its cyanotic consequences for this defect."}, {"q": "A newborn presents with severe cyanosis shortly after birth. Echocardiogram reveals transposition of the great arteries (TGA), in which the aorta arises from the right ventricle and the pulmonary artery from the left ventricle. Why does this defect cause profound cyanosis?", "opts": ["It creates two separate, parallel circulations with mixing of saturated and desaturated blood being necessary for any systemic oxygenation, so without adequate mixing, systemic circulation receives severely desaturated blood", "Because it restricts pulmonary blood flow only, without any abnormal chamber mixing", "Because it functions as an acyanotic left-to-right shunting lesion", "Because it affects only lymphatic drainage, sparing the great vessels"], "ans": 0, "exp": "Correct — A: TGA is a cyanotic defect involving mixing of saturated/desaturated blood; without a connection allowing mixing (or a shunt), the systemic circulation would receive severely desaturated blood, producing profound cyanosis. B, C, and D mischaracterize TGA's mechanism (it is not classified as an obstructive, acyanotic, or lymphatic condition)."}, {"q": "An infant with a large ventricular septal defect (VSD) develops signs of pulmonary overcirculation, tachypnea, and poor feeding, but no cyanosis. What does this presentation reflect?", "opts": ["Kawasaki disease, an acute vasculitis unrelated to structural cardiac shunting", "A cyanotic defect causing right-to-left shunting of desaturated blood", "Normal newborn cardiopulmonary transition requiring no further evaluation", "An acyanotic defect (VSD) with a large left-to-right shunt causing pulmonary overcirculation and volume/pressure overload, which can progress to left-sided heart failure if the shunt is large"], "ans": 3, "exp": "Correct — D: VSD is an acyanotic left-to-right shunting defect; when large, it causes pulmonary overcirculation, respiratory symptoms (tachypnea), poor feeding, and can progress to left-sided heart failure due to volume/pressure overload in the pulmonary circulation. B, C, and A do not match this classic large-VSD presentation."}, {"q": "A child with tetralogy of Fallot experiences episodes of worsening cyanosis (\"tet spells\") during crying or exertion. What is the underlying mechanism?", "opts": ["Spontaneous resolution of the right ventricular outflow obstruction during exertion", "Increased left-to-right shunting that transiently improves systemic oxygenation", "Increased right-to-left shunting from restricted right ventricular outflow, since myocardial hypertrophy cannot fully compensate, reducing pulmonary blood flow and increasing unoxygenated blood reaching systemic circulation", "A primary seizure disorder unrelated to any cardiac shunting mechanism"], "ans": 2, "exp": "Correct — C: In tetralogy of Fallot, exertion/crying can worsen right ventricular outflow obstruction, increasing right-to-left shunting of desaturated blood into systemic circulation (a \"tet spell\"), since hypertrophy cannot fully compensate for the restricted outflow. B, A, and D misstate this well-recognized clinical phenomenon."}, {"q": "A newborn with a prenatal diagnosis of hypoplastic left heart syndrome (HLHS) is born cyanotic with poor systemic perfusion. Which category of congenital heart defect does HLHS belong to, and what is the general goal of initial management?", "opts": ["A benign structural variant requiring no catheter-based or surgical treatment", "An acyanotic obstructive defect, managed with observation only until adulthood", "A defect that increases pulmonary blood flow only, requiring no early intervention", "A cyanotic defect with mixing of saturated/desaturated blood; initial management focuses on controlling cyanosis/HF symptoms via catheter-based intervention or staged surgical palliation"], "ans": 3, "exp": "Correct — D: HLHS is one of the cyanotic defects involving mixing of saturated/desaturated blood, and (like other CHDs) initial treatment focuses on controlling HF symptoms/cyanosis through catheterization-based procedures or staged surgical palliation/repair. B, C, and A misclassify HLHS or understate the need for intervention, which is typically life-saving."}, {"q": "A 4-month-old with a large PDA (patent ductus arteriosus) is noted to have poor weight gain despite adequate caloric intake. Which heart-failure-related manifestation, unique to the pediatric population, does this reflect?", "opts": ["Peyronie disease, an adult condition involving penile fibrous plaques", "Andropause, an age-related decline in adult male testosterone", "Failure to thrive (FTT)", "Priapism, a prolonged and unrelated adult penile erection"], "ans": 2, "exp": "Correct — C: Poor weight gain/growth despite adequate intake in an infant with a hemodynamically significant defect (like a large PDA causing pulmonary overcirculation and increased metabolic demand) reflects failure to thrive, a manifestation of heart failure unique to children. B, A, and D are unrelated, adult male reproductive conditions."}, {"q": "A 5-year-old develops high fever for 5 days, bilateral conjunctival injection, a polymorphous rash, strawberry tongue, and swollen hands/feet. Which condition is most likely, and what serious cardiac complication is of greatest concern if untreated?", "opts": ["Rheumatic fever; carrying a long-term risk of mitral stenosis only", "Kawasaki disease; risk of coronary artery aneurysm and thrombosis", "Tetralogy of Fallot; carrying a risk of hypercyanotic ('tet') spells", "Hypertrophic cardiomyopathy; carrying a risk of exertional sudden death"], "ans": 1, "exp": "Correct — B: The classic constellation of prolonged fever, conjunctival injection, rash, strawberry tongue, and extremity changes describes Kawasaki disease, an acute vasculitis that risks coronary artery aneurysm/thrombosis if untreated. A, C, and D describe different conditions with different classic presentations and complications."}, {"q": "A 6-year-old is found on a routine well-child visit to have persistently elevated blood pressure. Which condition should be prioritized in the workup, given how pediatric hypertension typically differs from adult hypertension?", "opts": ["Secondary hypertension from an underlying cause such as renal disease or coarctation of the aorta", "Primary (essential) hypertension with no further diagnostic workup needed, as in most hypertensive adults", "Orthostatic hypotension, a postural drop rather than a sustained elevation", "Raynaud phenomenon, a vasospastic digital condition unrelated to blood pressure"], "ans": 0, "exp": "Correct — A: Because significant hypertension in young children is more likely to have an identifiable secondary cause (most commonly renal disease or coarctation of the aorta) than the primary hypertension typical of adults, this should be prioritized in the workup. B, C, and D do not reflect the recommended pediatric-specific approach."}, {"q": "A 10-year-old with a history of untreated streptococcal pharyngitis 3 weeks ago now presents with carditis and a new heart murmur. Long term, what pediatric-acquired cardiovascular condition is this most likely to be associated with?", "opts": ["Tetralogy of Fallot, a congenital defect present since birth", "Kawasaki disease, from vasculitis unrelated to strep infection", "Rheumatic heart disease, following rheumatic fever from a delayed immune response to strep infection", "Hypoplastic left heart syndrome, a congenital defect requiring staged surgical palliation"], "ans": 2, "exp": "Correct — C: Carditis following streptococcal pharyngitis describes rheumatic fever, which can progress to rheumatic heart disease, an acquired (not congenital) cardiovascular condition in children. B is a vasculitis with a different (non-strep) trigger, and A and D are congenital, not acquired postinfectious, conditions."}, {"q": "An infant born to a mother who had poorly controlled diabetes and significant alcohol use during pregnancy is found to have a congenital heart defect. Which category of risk factor does this best illustrate?", "opts": ["Purely genetic risk factors, such as trisomy 21 or 22q11 deletion syndrome", "Environmental (maternal) risk factors, including metabolic disorders and alcohol/drug intake", "No known risk factor category applies, since the cause is entirely idiopathic and unpredictable", "This must represent an acquired defect developing sometime after birth"], "ans": 1, "exp": "Correct — B: Maternal metabolic disorders (diabetes) and alcohol/drug intake during pregnancy are described as environmental risk factors associated with congenital heart defects. A describes a different (genetic) risk category, and C and D dismiss or mischaracterize the clear congenital, environmentally-influenced etiology here."}]}, {"title": "Structure and Function of the Pulmonary System", "code": "Chapter 34", "color": "c8", "subtitle": "Airway/Alveolar Anatomy • Ventilation, Diffusion & Perfusion • Gas Transport • Tests of Pulmonary Function • Aging", "general": [{"q": "What structures compose the acinus, where gas exchange occurs?", "opts": ["The alveolar ducts and alveoli", "The trachea and mainstem bronchi, which serve as purely conducting airways with no alveoli present", "The nasopharynx and oropharynx, upper airway structures that only warm, humidify, and filter air", "The chest wall and parietal pleura, which provide structural support rather than gas exchange"], "ans": 0, "exp": "Correct — A: Gas exchange occurs beyond the respiratory bronchioles, in the alveolar ducts and alveoli, which together compose the acinus. B and C are conducting airway structures (no gas exchange), and D describes structural support, not the gas-exchange unit."}, {"q": "What is the alveolocapillary membrane?", "opts": ["The membrane surrounding each alveolus that contains the pulmonary capillaries, the chief site of gas exchange", "The parietal pleura, the outer serous membrane lining the inner surface of the chest wall", "The ciliated mucosal lining of the trachea, which traps and clears inhaled particles", "A cartilage-reinforced membrane found only in the larger bronchi, structurally unrelated to alveolar gas exchange"], "ans": 0, "exp": "Correct — A: The alveolocapillary membrane surrounds each alveolus and contains the pulmonary capillaries, serving as the chief gas-exchange interface. B, C, and D describe unrelated structures."}, {"q": "Which circulation perfuses the bronchi and other lung structures (as opposed to the gas-exchange airways)?", "opts": ["Pulmonary circulation, the low-pressure system that perfuses alveoli for gas exchange", "Bronchial circulation, a branch of the systemic circulation", "Coronary circulation, which supplies oxygenated blood directly to the myocardium", "Portal circulation, which carries venous blood from the GI tract and spleen to the liver"], "ans": 1, "exp": "Correct — B: The bronchi and other lung structures are perfused by the bronchial circulation, a branch of the systemic circulation, while the gas-exchange airways are perfused by the separate pulmonary circulation. A describes the gas-exchange perfusion, and C and D are unrelated circulations."}, {"q": "What primarily controls pulmonary vasodilation and vasoconstriction?", "opts": ["Local and humoral factors, particularly arterial oxygenation and acid-base status", "The somatic nervous system exclusively, via voluntary skeletal muscle innervation only", "Circulating insulin levels alone, independent of oxygen tension or acid-base status", "Core body temperature alone, with no influence from arterial blood gas values"], "ans": 0, "exp": "Correct — A: Although innervated by the ANS, pulmonary vasodilation/vasoconstriction is mainly controlled by local and humoral factors, especially arterial oxygenation and acid-base status. B, C, and D are not the primary regulators described."}, {"q": "The parietal and visceral pleurae are separated by which space?", "opts": ["The mediastinum, the central thoracic compartment containing the heart and great vessels", "The pleural space", "The pericardial space, the fluid-filled sac surrounding the heart, not the lungs", "The peritoneal space, the abdominal cavity lining unrelated to thoracic structures"], "ans": 1, "exp": "Correct — B: The pleural space is where the parietal pleura (lining the chest wall) and visceral pleura (encasing the lungs) contact and slide over one another. A, C, and D describe unrelated anatomic spaces."}, {"q": "What are the three core functions of the pulmonary system?", "opts": ["Digesting nutrients, absorbing water, and excreting solid waste, functions of the GI tract", "Producing red blood cells, filtering toxins, and regulating core body temperature", "Ventilating the alveoli, diffusing gases into/out of blood, and perfusing the lungs", "Generating electrical impulses and pumping blood throughout the body, cardiac functions"], "ans": 2, "exp": "Correct — C: The pulmonary system ventilates the alveoli, diffuses gases into and out of the blood, and perfuses the lungs so tissues receive oxygen-rich, CO2-poor blood. B, A, and D describe functions of other organ systems."}, {"q": "Which autonomic divisions control airway caliber and the rate/depth of (involuntary) ventilation?", "opts": ["The enteric nervous system alone, which primarily governs gastrointestinal motility", "The somatic motor system alone, which controls voluntary skeletal muscle contraction", "Sympathetic and parasympathetic divisions of the ANS", "Voluntary cortical control alone, bypassing autonomic regulation of bronchial tone"], "ans": 2, "exp": "Correct — C: Ventilation is mostly involuntary, controlled by sympathetic and parasympathetic ANS divisions that adjust bronchial smooth muscle tone and the rate/depth of breathing. B, A, and D do not describe the primary regulatory system for involuntary ventilation."}, {"q": "Which lung receptors sense the need to expel unwanted substances, lung volume, and pulmonary capillary pressure, respectively?", "opts": ["Chemoreceptors, baroreceptors, and osmoreceptors, which sense blood gases, pressure, and osmolality", "Irritant receptors, stretch receptors, and J-receptors", "Proprioceptors, nociceptors, and thermoreceptors, which sense joint position, pain, and temperature", "Only chemoreceptors, which instead monitor blood pH and oxygen tension, not these functions"], "ans": 1, "exp": "Correct — B: Irritant receptors sense the need to expel substances, stretch receptors sense lung volume/expansion, and J-receptors sense pulmonary capillary pressure. A, C, and D name receptor types not specifically responsible for these three distinct pulmonary sensory functions."}, {"q": "Central and peripheral chemoreceptors monitor which two parameters to assess ventilation effectiveness?", "opts": ["Core body temperature and hematocrit, values monitored by other physiologic feedback systems", "Heart rate and blood pressure only, parameters sensed instead by arterial baroreceptors", "The pH status of cerebrospinal fluid and the PaO2 of arterial blood", "Serum glucose and serum sodium, values regulated by pancreatic and renal feedback loops"], "ans": 2, "exp": "Correct — C: Chemoreceptors in the circulatory system and brainstem sense the pH of cerebrospinal fluid and the oxygen content (PaO2) of arterial blood to assess ventilation effectiveness. B, A, and D are not the parameters monitored for this purpose."}, {"q": "What is the major muscle of inspiration, and how does its contraction generate airflow?", "opts": ["The diaphragm; contraction moves it downward, creating a vacuum that draws air into the lungs", "The intercostal muscles alone; diaphragmatic contraction plays no meaningful role in breathing", "The abdominal muscles; their contraction assists forced expiration, not inspiration", "The trapezius muscle; it functions only as an accessory muscle during severe respiratory distress"], "ans": 0, "exp": "Correct — A: The diaphragm is the major inspiratory muscle; its contraction moves it downward in the thoracic cavity, creating negative pressure (a vacuum) that draws air into the lungs. B, C, and D misidentify the primary inspiratory muscle and mechanism."}, {"q": "Which cells produce surfactant, and what is surfactant's key function?", "opts": ["Goblet cells; these secrete mucus rather than the lipoprotein surfactant", "Type I alveolar cells; these thin gas-exchange cells do not produce surfactant", "Type II alveolar cells; surfactant reduces alveolar surface tension, permitting alveolar expansion", "Ciliated cells; these instead propel mucus along the airway via coordinated ciliary beating, not surfactant production"], "ans": 2, "exp": "Correct — C: Type II alveolar cells produce surfactant, a lipoprotein that reduces alveolar surface tension and allows alveoli to expand as air enters. B, A, and D misattribute the cell type and/or misstate surfactant's effect (which decreases, not increases, surface tension)."}, {"q": "What is elastic recoil, and what does the balance of lung/chest wall recoil forces create?", "opts": ["The tendency of lungs/chest wall to return to resting state after inspiration, creating the normally negative pleural pressure", "The tendency of the heart muscle to return to diastole after each ventricular systole, a completely distinct cardiac cycle property", "A property found only in the rigid cartilaginous trachea, unrelated to lung/chest wall mechanics", "A property that directly increases airway resistance by narrowing the bronchiolar lumen"], "ans": 0, "exp": "Correct — A: Elastic recoil is the tendency of lungs and chest wall to return to their resting state after inspiration; their opposing recoil forces create the normally negative pleural space pressure. B, C, and D misstate this concept."}, {"q": "What does lung compliance depend on, and what does chest wall expansion depend on?", "opts": ["Lung compliance depends on adequate surfactant; chest wall expansion depends on elasticity", "Both depend solely on diaphragmatic muscle strength, with no role for surfactant or elasticity", "Lung compliance depends on circulating hemoglobin levels rather than surfactant production", "Chest wall expansion depends only on prior rib fracture history, not on tissue elasticity"], "ans": 0, "exp": "Correct — A: Lung compliance (ease of lung expansion) is ensured by adequate surfactant production, while chest wall expansion depends on chest wall elasticity. B, C, and D do not accurately describe these determinants."}, {"q": "When does the work of breathing increase?", "opts": ["Only during sleep, when brainstem respiratory drive is briefly and normally suppressed", "When lung or chest wall compliance decreases, or airways are obstructed", "Only when hemoglobin levels are elevated, as in polycythemia, regardless of lung mechanics", "Work of breathing remains constant regardless of compliance changes or airway obstruction"], "ans": 1, "exp": "Correct — B: The work of breathing, normally very low, increases when compliance decreases (stiffer lungs/chest wall) or when airways are obstructed, both of which require greater muscular effort. A, C, and D do not match the described determinants."}, {"q": "Why are both ventilation and perfusion greatest in the bases of the lungs?", "opts": ["Basal alveoli are more compliant (lower resting volume), and gravity increases basal perfusion", "The apex contains a greater number of alveoli than the base, favoring apical ventilation", "Gravity has no effect on pulmonary blood flow, which is distributed evenly throughout the lung", "Ventilation is distributed evenly regardless of body position or regional alveolar compliance"], "ans": 0, "exp": "Correct — A: Basal alveoli are more compliant due to their lower resting volume, allowing greater ventilation, and gravity increases basal perfusion — together maximizing both ventilation and perfusion at the lung bases. B, C, and D contradict the described physiologic basis for this distribution."}, {"q": "How is most oxygen transported in the blood?", "opts": ["Bound to circulating albumin, the plasma protein that instead transports bilirubin and drugs", "Entirely dissolved in plasma, bypassing hemoglobin binding within red blood cells altogether", "Bound to hemoglobin within red blood cells, with a smaller amount dissolved in plasma", "Bound to platelets, cell fragments whose primary role is clot formation, not oxygen transport"], "ans": 2, "exp": "Correct — C: Almost all oxygen diffusing into pulmonary capillary blood is transported by hemoglobin in red blood cells, with the remainder dissolved in plasma. B, A, and D misstate the primary oxygen transport mechanism."}, {"q": "Compared with oxygen, how does carbon dioxide's solubility in plasma affect its transport?", "opts": ["CO2 is more soluble in plasma, so it diffuses readily from tissue cells into plasma and then into the alveoli", "CO2 is less soluble in plasma than oxygen, limiting its diffusion into the bloodstream", "CO2 solubility in plasma is entirely irrelevant to its transport, since it is carried exclusively bound to hemoglobin", "CO2 is transported exclusively bound to platelets, cells with no role in gas transport"], "ans": 0, "exp": "Correct — A: CO2 is more soluble in plasma than oxygen, allowing it to diffuse readily from tissue cells into plasma and from plasma into alveoli; it returns to the lungs dissolved in plasma, as bicarbonate, or in carbamino compounds (e.g., bound to hemoglobin). B, C, and D misstate this relationship."}, {"q": "Which pulmonary function test measures the volume and flow rate of air during forced expiration?", "opts": ["Diffusing capacity testing, which measures gas transfer rate across the alveolocapillary membrane", "Arterial blood gas analysis, which measures blood pH, PaO2, and PaCO2, not airflow", "Spirometry", "Thoracic imaging, which visualizes structural lung disease rather than airflow rates"], "ans": 2, "exp": "Correct — C: Spirometry measures the volume and flow rate of air during forced expiration. B measures blood gas/pH values, A measures the gas diffusion rate at the alveolocapillary membrane, and D visualizes structural disease — none of which measure forced expiratory volume/flow directly."}, {"q": "What is diffusing capacity a measure of?", "opts": ["The gas diffusion rate at the alveolocapillary membrane", "The contractile strength of the diaphragm, assessed instead by maximal inspiratory pressure", "The total lung capacity, a static volume measured by plethysmography or gas dilution testing", "The heart's ejection fraction, a measure of left ventricular pumping efficiency"], "ans": 0, "exp": "Correct — A: Diffusing capacity measures the rate of gas diffusion across the alveolocapillary membrane. B, C, and D describe unrelated measurements."}, {"q": "Which age-related pulmonary changes affect the mechanics of ventilation?", "opts": ["Increased chest wall compliance and increased pulmonary elastic recoil, improving overall ventilatory reserve with age", "Decreased chest wall compliance and decreased elastic recoil of the lungs, reducing ventilatory reserve", "No change occurs in chest wall or lung mechanics with age, which remain fully preserved", "Only resting heart rate changes with age, with no effect on chest wall or lung mechanics"], "ans": 1, "exp": "Correct — B: Aging decreases chest wall compliance and lung elastic recoil, reducing ventilatory reserve. A, C, and D contradict the described age-related mechanical changes."}, {"q": "How does aging affect vital capacity, residual volume, and total lung capacity?", "opts": ["Total lung capacity decreases significantly while vital capacity and residual volume remain essentially stable with normal aging", "Vital capacity increases with age while residual volume progressively decreases", "Both vital capacity and residual volume decrease proportionally, lowering total lung capacity", "Vital capacity decreases and residual volume increases, while total lung capacity remains unchanged"], "ans": 3, "exp": "Correct — D: With aging, vital capacity decreases and residual volume increases, but total lung capacity remains unchanged (since the increase in residual volume roughly offsets the decrease in vital capacity). B, C, and A misstate these age-related volume changes."}, {"q": "Does aging affect PaO2 and PaCO2 equally?", "opts": ["Aging has no measurable effect on either PaO2 or PaCO2 throughout adulthood", "Yes — both PaO2 and PaCO2 decrease equally as alveolar surface area declines with age", "No — aging increases both PaO2 and PaCO2 due to enhanced alveolar gas exchange efficiency", "No — aging can decrease PaO2 but does not affect PaCO2"], "ans": 3, "exp": "Correct — D: Aging can cause PaO2 to decrease (due to loss of alveolar surface area and other changes) but does not affect PaCO2 levels. B, C, and A misstate this differential effect."}], "clinical": [{"q": "A patient with emphysema has significant loss of alveolar septa and surface area. Which pulmonary function would be most directly and immediately impaired?", "opts": ["Ventilation of the upper airways only, structures unaffected by alveolar septal destruction", "Diffusion of gases across the alveolocapillary membrane", "Bronchial circulation exclusively, the systemic branch supplying airway walls, not alveoli", "Chest wall protection, a structural function unrelated to alveolar gas exchange"], "ans": 1, "exp": "Correct — B: Since gas exchange (diffusion) occurs at the alveolocapillary membrane within the acinus, loss of alveolar septa/surface area directly impairs diffusing capacity. A, C, and D are not the structures/functions most directly affected by alveolar destruction."}, {"q": "A preterm infant lacks adequate type II alveolar cell development and surfactant production. What immediate physiologic consequence would be expected?", "opts": ["Increased alveolar surface tension, leading to alveolar collapse and difficulty with lung expansion", "Decreased alveolar surface tension with easier lung expansion, which is the exact opposite of the true physiologic effect", "No effect, since surfactant production is not physiologically relevant until adulthood", "Increased bronchial circulation only, with no change in alveolar surface tension"], "ans": 0, "exp": "Correct — A: Without adequate surfactant, alveolar surface tension remains high, promoting alveolar collapse (atelectasis) and increased work of breathing — the basis of neonatal respiratory distress syndrome. B, C, and D contradict surfactant's known physiologic role."}, {"q": "A patient with a rib fracture reports that breathing is significantly more effortful than usual, though gas exchange itself is not yet impaired. Which concept explains this increased effort?", "opts": ["Decreased chemoreceptor sensitivity to CO2, which would blunt rather than increase effort", "Improved elastic recoil of the injured chest wall, which would ease rather than increase effort", "Increased surfactant production fully compensating for the mechanical chest wall injury", "Increased work of breathing due to decreased chest wall compliance"], "ans": 3, "exp": "Correct — D: Reduced chest wall compliance (from painful/mechanically limited rib movement) increases the muscular effort — the work of breathing — required for ventilation, even before gas exchange is affected. B, C, and A do not explain this increased effort."}, {"q": "A patient at high altitude has a lower alveolar oxygen concentration than at sea level. Based on the principle of diffusion, what would be expected regarding oxygen uptake into the blood?", "opts": ["Oxygen would only move by active transport at high altitude, bypassing passive diffusion", "Oxygen diffusion would increase because of the lower atmospheric pressure at altitude", "Diffusion is unaffected by alveolar oxygen concentration or the alveolar-capillary gradient", "Oxygen diffusion into the capillaries would be reduced, since diffusion depends on the concentration gradient between alveoli and capillaries"], "ans": 3, "exp": "Correct — D: Since oxygen diffuses down its concentration gradient from alveoli to capillaries, a lower alveolar oxygen concentration (as at high altitude) reduces the gradient and thus reduces oxygen diffusion into the blood. B, C, and A contradict the basic diffusion principle described."}, {"q": "A patient with severe anemia has a low hemoglobin level but normal lung function. How would this most directly affect oxygen transport?", "opts": ["Oxygen-carrying capacity would be reduced, since almost all oxygen is transported bound to hemoglobin", "Oxygen transport would be unaffected since it is carried mainly dissolved in plasma", "Carbon dioxide transport would be completely halted despite normal hemoglobin structure", "Ventilation would become mechanically impossible despite entirely normal respiratory muscle strength and drive"], "ans": 0, "exp": "Correct — A: Since almost all blood oxygen transport depends on hemoglobin binding, a low hemoglobin level directly reduces the blood's oxygen-carrying capacity, even with normal lung mechanics. B, C, and D misstate the primary oxygen transport mechanism and its dependency on hemoglobin."}, {"q": "A clinician orders spirometry for a patient with suspected airway obstruction. What specific information will this test provide that arterial blood gas analysis would not?", "opts": ["The diffusing capacity of the alveolocapillary membrane, a value ABG cannot measure directly", "The pH of arterial blood, a value obtained instead from arterial blood gas analysis", "The oxygen content of arterial blood, a value obtained instead from arterial blood gas analysis, not from spirometry testing", "The volume and flow rate of air during forced expiration, revealing patterns of airway obstruction"], "ans": 3, "exp": "Correct — D: Spirometry specifically measures forced expiratory volume/flow rates, which reveal obstructive patterns not directly assessed by ABG (which measures pH/gas content) or diffusing capacity testing (which measures gas diffusion rate, not flow/volume). B, C, and A describe what other tests (ABG, diffusing capacity) measure instead."}, {"q": "An 80-year-old with no acute pulmonary disease has a mildly reduced PaO2 on room air but a normal PaCO2. Which explanation is most consistent with normal pulmonary aging?", "opts": ["This pattern of reduced PaO2 with a normal PaCO2 is only ever seen in premature infants, never in older adults", "This always indicates COPD requiring immediate bronchodilator and steroid treatment", "PaCO2 should also decrease proportionally if normal aging alone were the cause", "Aging can decrease PaO2 due to structural changes (like alveolar surface area loss) without affecting PaCO2"], "ans": 3, "exp": "Correct — D: D mildly reduced PaO2 with a normal PaCO2 in an elderly patient is consistent with expected age-related pulmonary changes (aging lowers PaO2 without affecting PaCO2), rather than necessarily indicating acute disease. B, C, and A misapply or contradict this described aging pattern."}, {"q": "A patient's pulmonary function tests show decreased vital capacity and increased residual volume, but a total lung capacity within the normal range. Is this pattern more consistent with normal aging or with a specific acute disease process?", "opts": ["This pattern is only seen acutely in severe cases of acute respiratory distress syndrome", "This pattern is consistent with normal age-related pulmonary changes", "This pattern indicates an acute pneumothorax with sudden pleural air accumulation", "This pattern is diagnostic of an underlying bronchogenic lung cancer causing obstruction"], "ans": 1, "exp": "Correct — B: Decreased vital capacity with increased residual volume and preserved total lung capacity is the classic pattern of normal pulmonary aging, not a specific acute disease process. A, C, and D describe different, generally acute conditions with different characteristic findings."}]}, {"title": "Alterations of Pulmonary Function", "code": "Chapter 35", "color": "c9", "subtitle": "Clinical Manifestations • Chest Wall/Pleural Disorders • Restrictive & Obstructive Disease • Infections • Vascular Disease • Cancer", "general": [{"q": "What is the difference between dyspnea and orthopnea?", "opts": ["Dyspnea refers specifically to a chronic productive cough; orthopnea refers specifically to sputum production", "They are identical terms describing the exact same symptom regardless of body position", "Orthopnea occurs only during exercise; dyspnea occurs only at complete rest", "Dyspnea is breathlessness in general; orthopnea is dyspnea specifically occurring when lying flat"], "ans": 3, "exp": "Correct — D: Dyspnea is the general feeling of breathlessness, while orthopnea is dyspnea that occurs specifically when lying flat, due to abdominal contents pressing on the diaphragm. B, C, and A mischaracterize these related but distinct terms."}, {"q": "What is paroxysmal nocturnal dyspnea?", "opts": ["A normal variant of sleep breathing requiring no evaluation or underlying disease", "Dyspnea that wakes an individual during sleep, gasping for air, associated with pulmonary or cardiac disease", "Dyspnea that occurs only with daytime physical exertion, entirely unrelated to sleep or nocturnal awakening episodes", "A type of chronic productive cough associated with bronchiectasis, not nocturnal dyspnea"], "ans": 1, "exp": "Correct — B: Paroxysmal nocturnal dyspnea is dyspnea associated with pulmonary or cardiac disease that wakes the individual during sleep, gasping for air. A, C, and D do not match this definition."}, {"q": "Hemoptysis is defined as:", "opts": ["Coughing without any sputum production, describing a dry, nonproductive cough instead", "A normal finding expected in healthy individuals with no underlying pulmonary disease", "Expectoration of bloody mucus, usually from infection or inflammation damaging the bronchi or lung parenchyma", "Excess saliva production from salivary gland stimulation, entirely unrelated to the lower respiratory airways"], "ans": 2, "exp": "Correct — C: Hemoptysis is expectoration of bloody mucus, usually resulting from infection or inflammation that damages the bronchi or lung parenchyma. B, A, and D do not describe hemoptysis."}, {"q": "What is the difference between hypoventilation and hyperventilation in terms of their effect on PaCO2?", "opts": ["Neither hypoventilation nor hyperventilation produces any measurable effect on arterial PaCO2 levels whatsoever", "Both hypoventilation and hyperventilation increase PaCO2 to the same measurable degree", "Both hypoventilation and hyperventilation decrease PaCO2 to the same measurable degree", "Hypoventilation increases PaCO2 (hypercapnia); hyperventilation decreases PaCO2 (hypocapnia)"], "ans": 3, "exp": "Correct — D: Hypoventilation (decreased alveolar ventilation) causes hypercapnia (increased PaCO2), while hyperventilation (increased alveolar ventilation) causes hypocapnia (decreased PaCO2). B, C, and A misstate these opposite effects."}, {"q": "What are recognized causes of hyperventilation?", "opts": ["Anxiety, head injury, pain, or severe hypoxemia", "Only chronic bronchitis, an obstructive disease that typically causes hypoventilation instead", "Sleep alone, during which respiratory drive normally decreases rather than increases", "Obesity alone, more commonly associated with hypoventilation from restricted chest wall movement"], "ans": 0, "exp": "Correct — A: Hyperventilation can be produced by anxiety, head injury, pain, or severe hypoxemia. B, C, and D are not the causes specifically described for hyperventilation."}, {"q": "Which mechanisms can cause cyanosis?", "opts": ["Anemia alone, which actually reduces the total hemoglobin available to appear desaturated", "Desaturation of hemoglobin, polycythemia, or peripheral vasoconstriction", "Fever alone, which causes peripheral vasodilation rather than the vasoconstriction of cyanosis", "Dehydration alone, which affects fluid volume status rather than hemoglobin oxygen saturation"], "ans": 1, "exp": "Correct — B: Cyanosis (bluish skin discoloration) can result from hemoglobin desaturation, polycythemia, or peripheral vasoconstriction. A, C, and D are not the mechanisms described for cyanosis."}, {"q": "Clubbing of the fingertips is associated with which type of underlying condition, and how reversible is it?", "opts": ["Only cardiac arrhythmias without associated hypoxemia; fully reversible with treatment", "Acute, brief hypoxemia; clubbing from this cause resolves within hours of correction", "Diseases causing chronic hypoxemia; it is rarely reversible", "Only chronic kidney disease unrelated to oxygenation; fully reversible with dialysis"], "ans": 2, "exp": "Correct — C: Clubbing is associated with diseases causing chronic hypoxemia and is rarely reversible. B, A, and D misstate the underlying condition and/or reversibility."}, {"q": "What is the difference between hypoxemia and hypoxia?", "opts": ["Hypoxia refers only to reduced oxygenation within brain tissue; hypoxemia refers only to oxygenation of the lungs", "They are identical terms with no meaningful clinical or physiologic distinction", "Hypoxemia is reduced PaO2 in the blood; hypoxia is reduced oxygenation of cells, usually caused by hypoxemia", "Hypoxemia is a cellular-level phenomenon; hypoxia is a blood-level phenomenon instead"], "ans": 2, "exp": "Correct — C: Hypoxemia specifically refers to reduced PaO2 in arterial blood, while hypoxia refers to reduced oxygenation at the cellular level, usually resulting from hypoxemia. B, A, and D mischaracterize this important distinction."}, {"q": "A V̇/Q̇ mismatch refers to an imbalance between which two parameters?", "opts": ["Heart rate and respiratory rate, vital signs unrelated to alveolar gas exchange balance", "The amount of air entering the alveoli (ventilation) and the amount of blood perfusing them (perfusion)", "Systemic blood pressure and pulse rate, hemodynamic parameters rather than gas exchange", "Blood glucose and circulating insulin levels, values regulated primarily by pancreatic endocrine function instead"], "ans": 1, "exp": "Correct — B: V̇/Q̇ (ventilation/perfusion) match is the balance between alveolar ventilation and pulmonary perfusion; an imbalance (mismatch) can cause hypoxemia. A, C, and D are unrelated parameter pairs."}, {"q": "Respiratory failure is classified into which two main categories?", "opts": ["Bacterial and fungal, classifications describing infectious etiology, not gas exchange failure", "Acute and viral, terms describing onset and infectious cause, not the gas exchange defect", "Hypoxemic and hypercapnic", "Congenital and acquired, terms describing disease origin, not the type of gas exchange failure"], "ans": 2, "exp": "Correct — C: Respiratory failure — inadequate gas exchange from direct lung/airway/chest wall injury or from another body system's disease — is classified as hypoxemic or hypercapnic. B, A, and D are not the classification scheme used for respiratory failure."}, {"q": "What is the underlying pathophysiology of tension pneumothorax that makes it life-threatening?", "opts": ["Air becomes trapped in the pleural space, displacing the trachea, great vessels, and heart", "Fluid slowly accumulates in the pleural space over weeks, describing a pleural effusion instead", "It is caused solely by pus accumulation in the pleural space, as occurs in empyema", "It only affects the visceral pleura with no resulting hemodynamic consequence"], "ans": 0, "exp": "Correct — A: Tension pneumothorax involves air trapped in the pleural space under increasing pressure, displacing the trachea, great vessels, and heart, which can rapidly compromise cardiac output — a life-threatening emergency. B, C, and D describe different or less urgent processes (pleural effusion, empyema)."}, {"q": "What is empyema, and how does it typically develop?", "opts": ["Pus in the pleural space (infected pleural effusion), usually from lymphatic drainage from a site of bacterial pneumonia", "Air accumulating in the pleural space from traumatic chest injury, defining a traumatic pneumothorax instead of empyema", "A benign fluid collection unrelated to any underlying infectious process", "A congenital chest wall deformity present since birth, unrelated to pleural infection"], "ans": 0, "exp": "Correct — A: Empyema is pus in the pleural space (an infected pleural effusion), typically developing via lymphatic drainage from a site of bacterial pneumonia. B, C, and D describe different, non-infectious processes."}, {"q": "Restrictive lung diseases are characterized by which changes?", "opts": ["Increased lung compliance with easy expansion and minimal respiratory effort required", "Decreased lung compliance, requiring more effort to expand the lungs, with dyspnea, increased respiratory rate, and decreased tidal volume", "Airway obstruction with wheezing as the primary sign, characteristic of obstructive disease", "No measurable effect on respiratory rate or tidal volume despite decreased compliance"], "ans": 1, "exp": "Correct — B: Restrictive lung disease involves decreased compliance, increased work of breathing, dyspnea, increased respiratory rate, and decreased tidal volume. A describes the opposite of restriction, and C describes obstructive (not restrictive) disease."}, {"q": "What is atelectasis, and what are its recognized causes?", "opts": ["Excess connective tissue and collagen deposition within the lung parenchyma, characteristic of pulmonary fibrosis instead", "Dilation of the bronchi from chronic infection, characteristic of bronchiectasis instead", "Collapse of alveoli from compression, gas absorption from obstructed alveoli, or decreased surfactant production", "Inflammation limited to the pleura, known as pleuritis, without alveolar collapse"], "ans": 2, "exp": "Correct — C: Atelectasis is alveolar collapse resulting from compression, absorption of gas from obstructed alveoli, or decreased surfactant production. B describes bronchiectasis, A describes pulmonary fibrosis, and D describes pleuritis — different conditions."}, {"q": "Bronchiectasis is best described as:", "opts": ["A congenital absence of bronchial cartilage present since birth, unrelated to infection", "Collapse of the alveoli from compression or gas absorption, defining atelectasis instead", "A benign lung tumor such as a bronchial hamartoma, unrelated to bronchial dilation", "Abnormal dilation of the bronchi, usually secondary to infection or inflammation"], "ans": 3, "exp": "Correct — D: Bronchiectasis is abnormal bronchial dilation, usually secondary to another pulmonary disorder such as infection or inflammation. B, C, and A describe different, unrelated conditions."}, {"q": "Pneumoconiosis is caused by which exposure, and what pulmonary consequence can result?", "opts": ["Prolonged exposure to excess supplemental oxygen therapy; causes oxygen toxicity and ARDS, not pneumoconiosis", "Viral upper respiratory infection; typically causes acute bronchitis, not fibrosis", "Inhalation of workplace dust particles; can cause pulmonary fibrosis and progressive pulmonary deterioration", "An inherited CFTR gene mutation; causes cystic fibrosis, not occupational lung disease"], "ans": 2, "exp": "Correct — C: Pneumoconiosis results from inhaling workplace dust particles and can cause pulmonary fibrosis and progressive pulmonary deterioration. B, A, and D describe different causes/conditions."}, {"q": "Pulmonary edema can result from which mechanisms?", "opts": ["Bronchial dilation alone, the structural change that instead defines bronchiectasis", "A pneumothorax alone, which involves trapped air accumulating within the pleural space rather than any excess fluid", "Increased capillary hydrostatic pressure, decreased capillary oncotic pressure, or increased capillary permeability", "A chest wall fracture alone, a structural injury unrelated to capillary fluid dynamics"], "ans": 2, "exp": "Correct — C: Pulmonary edema results from increased capillary hydrostatic pressure (e.g., left heart failure), decreased capillary oncotic pressure, or increased capillary permeability (e.g., inflammation), or lymphatic obstruction. B, A, and D are not the mechanisms described."}, {"q": "What is the underlying pathophysiology of ARDS?", "opts": ["Acute lung inflammation and diffuse alveolocapillary injury from direct pulmonary injury or severe systemic inflammation, with endothelial damage increasing capillary permeability and causing hypoxemia", "A chronic, slowly progressive fibrotic disease with no acute inflammatory component", "A congenital structural defect present at birth, unrelated to acute lung injury", "A benign, self-limited condition requiring no supportive care or monitoring"], "ans": 0, "exp": "Correct — A: ARDS involves acute inflammation and diffuse alveolocapillary injury from direct or indirect (systemic) causes, with endothelial damage increasing capillary permeability, causing hypoxemia, and eventual fibrotic remodeling. B, C, and D mischaracterize this acute, often severe/life-threatening syndrome."}, {"q": "What are the unifying symptom and unifying sign of obstructive lung diseases?", "opts": ["Chest pain (symptom) and digital clubbing (sign), findings more typical of chronic hypoxemia", "Fever (symptom) and a sandpaper rash (sign), findings typical of scarlet fever instead", "Dyspnea (symptom) and wheezing (sign)", "Hemoptysis (symptom) and cyanosis (sign), findings more typical of severe hypoxemic disease"], "ans": 2, "exp": "Correct — C: The unifying symptom of obstructive lung disease is dyspnea, and the unifying sign is wheezing, both related to difficulty with expiration and increased work of breathing. B, A, and D are not the specifically identified unifying symptom/sign."}, {"q": "Asthma is characterized by which combination of features?", "opts": ["A disease exclusively affecting the pleura, with no involvement of the bronchial airways", "Permanent, irreversible airway destruction with no inflammatory component whatsoever", "A purely restrictive lung disease with decreased compliance and no airway obstruction", "Chronic inflammation causing bronchial hyperresponsiveness, airway constriction, mucosal edema, increased mucus, and variable (often reversible) airflow obstruction"], "ans": 3, "exp": "Correct — D: Asthma involves chronic inflammation causing bronchial hyperresponsiveness, constriction, mucosal edema, increased mucus production, and variable/often reversible airflow obstruction. B, C, and A mischaracterize asthma's obstructive, often-reversible nature."}, {"q": "COPD is best described as which type of disease process?", "opts": ["A single acute, self-limited viral infection resolving completely within days", "A group of lung disorders (including chronic bronchitis and emphysema) with persistent airflow limitation from chronic airway inflammation, usually progressive", "A purely restrictive lung disease with no airflow limitation on spirometry", "A benign condition requiring no long-term monitoring or pulmonary management"], "ans": 1, "exp": "Correct — B: COPD is a group of lung disorders with persistent airflow limitation from chronic inflammatory response in the airways, usually progressive, including chronic bronchitis and emphysema. A, C, and D mischaracterize COPD's chronic, progressive, obstructive nature."}, {"q": "What pathologic changes underlie chronic bronchitis?", "opts": ["Airway inflammation, bronchial smooth muscle hypertrophy, and production of thick, tenacious mucus, causing airway obstruction", "Complete destruction of alveolar septa with no mucus involvement, characteristic of emphysema", "A purely restrictive process with no airway inflammation or mucus hypersecretion", "A congenital malformation of the bronchi present since birth, unrelated to smoking"], "ans": 0, "exp": "Correct — A: Chronic bronchitis causes airway obstruction from inflammation, bronchial smooth muscle hypertrophy, and thick mucus production. B describes emphysema instead, and C and D do not match chronic bronchitis's pathophysiology."}, {"q": "In emphysema, what structural change leads to air trapping during expiration?", "opts": ["Bronchial smooth muscle hypertrophy with otherwise structurally normal alveoli, characteristic of chronic bronchitis instead", "Increased mucus production with normal alveolar structure, characteristic of chronic bronchitis", "Increased elastic recoil causing rapid, complete exhalation with no air trapping", "Destruction of alveolar septa and loss of passive elastic recoil, causing alveolar enlargement and airway collapse"], "ans": 3, "exp": "Correct — D: In emphysema, destruction of alveolar septa and loss of elastic recoil lead to alveolar enlargement, airway collapse during expiration, and air trapping. B describes chronic bronchitis, and C and A contradict emphysema's actual pathophysiology (which involves loss, not gain, of elastic recoil)."}, {"q": "What is the most common cause of community-acquired pneumonia?", "opts": ["Aspergillus fungus, an opportunistic mold typically causing disease in immunocompromised hosts", "Mycobacterium tuberculosis, the acid-fast bacillus causing chronic granulomatous infection", "Influenza virus, a common cause of viral rather than bacterial community-acquired illness", "Streptococcus pneumoniae (pneumococcal pneumonia)"], "ans": 3, "exp": "Correct — D: Streptococcus pneumoniae (pneumococcal pneumonia) is the most common cause of community-acquired pneumonia. B, C, and A can cause pulmonary infection but are not the most common overall cause of CAP."}, {"q": "How does Mycobacterium tuberculosis evade immune destruction?", "opts": ["It infects only circulating red blood cells, unlike its actual macrophage-based mechanism", "It destroys all macrophages immediately on contact, preventing any granuloma formation", "It has no interaction with the immune system, remaining entirely extracellular in tissue", "It survives within macrophages while the immune response isolates bacilli colonies within tubercles surrounded by scar tissue"], "ans": 3, "exp": "Correct — D: TB bacilli survive within macrophages, evading destruction, while the inflammatory response isolates bacterial colonies by enclosing them in tubercles with surrounding scar tissue. B, C, and A misstate this immune evasion mechanism."}, {"q": "Pulmonary embolism most often originates from which source, and what are its physiologic consequences?", "opts": ["The left heart chambers; causes systemic arterial emboli rather than pulmonary vascular obstruction or hypertension", "Deep venous thrombosis; causes vascular obstruction, V̇/Q̇ mismatch, hypoxemia, and pulmonary hypertension", "The lungs themselves; causing no measurable pulmonary vascular consequences", "The renal veins; causes isolated renal failure without any pulmonary vascular effect"], "ans": 1, "exp": "Correct — B: Pulmonary embolism most often originates from deep venous thrombosis and causes vascular obstruction, V̇/Q̇ mismatch, hypoxemia, and pulmonary hypertension, with or without infarction. A, C, and D misstate the typical source and consequences."}, {"q": "Cor pulmonale is defined as:", "opts": ["A congenital heart defect present since birth, such as a ventricular septal defect", "Left ventricular failure from coronary artery disease, a primary cardiac process", "Right ventricular enlargement or failure secondary to pulmonary artery hypertension", "A primary valve disorder such as mitral stenosis, unrelated to pulmonary hypertension"], "ans": 2, "exp": "Correct — C: Cor pulmonale is right ventricular enlargement or failure secondary to pulmonary artery hypertension. B, A, and D describe different, unrelated cardiac conditions."}, {"q": "What is the most common cause of lung cancer, and what is its significance among cancer deaths?", "opts": ["Occupational dust exposure alone; it is described as the least deadly cancer type", "Genetic mutation alone, unrelated to smoking; it is described as a rare cancer overall", "Chronic viral infection; it is described as rarely causing death compared with other cancers", "Tobacco smoking; lung cancer is the most common cause of cancer death in the United States"], "ans": 3, "exp": "Correct — D: Lung cancer is usually caused by tobacco smoking and is the most common cause of cancer death in the United States. B, C, and A understate the role of smoking and/or the mortality significance of lung cancer."}, {"q": "Lung cancer cell types are broadly divided into which two categories?", "opts": ["Benign and malignant only, with no further histologic subtype classification", "Non-small cell carcinoma (squamous cell, adenocarcinoma, large cell) and neuroendocrine tumors (small cell carcinoma, bronchial carcinoid)", "Viral and bacterial lung cancers, categorized by infectious rather than histologic cause", "Congenital and acquired lung cancers, categorized by age of onset rather than cell type"], "ans": 1, "exp": "Correct — B: Bronchogenic carcinomas are divided into non-small cell carcinoma (squamous cell, adenocarcinoma, large cell) and neuroendocrine tumors (small cell lung carcinoma, bronchial carcinoid), each with characteristic sites, manifestations, and prognosis. A, C, and D do not reflect the actual classification."}], "clinical": [{"q": "A patient with heart failure reports needing to sleep propped up on three pillows because lying flat makes him feel short of breath. Which symptom is this, and what causes it?", "opts": ["Clubbing, a fingertip change caused by long-standing chronic hypoxemia, not positional dyspnea", "Paroxysmal nocturnal dyspnea, caused by nighttime bronchospasm and sudden awakening", "Hemoptysis, the expectoration of blood-streaked sputum from bronchial bleeding", "Orthopnea, caused by abdominal contents pressing on the diaphragm when supine"], "ans": 3, "exp": "Correct — D: Dyspnea specifically triggered by lying flat, relieved by elevation, is orthopnea, caused by abdominal pressure on the diaphragm in the supine position. B describes a different phenomenon (waking suddenly from sleep gasping), and C and A describe unrelated findings."}, {"q": "A patient with heart failure wakes suddenly at night gasping for air, needing to sit up to catch her breath. Which symptom is this?", "opts": ["Kussmaul respirations, the deep rapid breathing pattern seen in metabolic acidosis", "Orthopnea, dyspnea triggered simply by lying flat, without a sudden awakening event", "Paroxysmal nocturnal dyspnea", "Cheyne-Stokes respirations, a cyclic pattern of waxing and waning breathing with apnea"], "ans": 2, "exp": "Correct — C: Sudden nighttime awakening with gasping for air associated with cardiac or pulmonary disease is paroxysmal nocturnal dyspnea. B describes dyspnea triggered simply by lying flat (without the sudden awakening/gasping pattern), and A and D describe distinct abnormal breathing patterns, not this specific nocturnal symptom."}, {"q": "A patient with active tuberculosis coughs up blood-streaked sputum. Which term describes this finding, and what is its general mechanism?", "opts": ["Orthopnea, dyspnea resulting fro
