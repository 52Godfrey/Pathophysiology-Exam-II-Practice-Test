rican males, with androgens and androgen receptor (AR) function playing major roles in its development and progression; chronic inflammation may also be an important risk factor. B, A, and D misstate the affected population and/or the key receptor."}, {"q": "Where do most prostate cancers (adenocarcinomas) develop within the gland?", "opts": ["Exclusively within the central urethral portion of the gland", "At the periphery of the gland", "Within the seminal vesicles rather than the prostate itself", "Confined entirely to the bladder neck region"], "ans": 1, "exp": "Correct — B: Most prostate cancers are adenocarcinomas developing at the periphery of the prostate gland. A, C, and D do not describe the typical location of prostate adenocarcinoma."}, {"q": "What is the most prevalent form of male sexual dysfunction?", "opts": ["Premature emission occurring before penetration in most cases", "Anorgasmia, the inability to achieve orgasm despite stimulation", "Retrograde ejaculation, where semen enters the bladder instead", "Erectile dysfunction"], "ans": 3, "exp": "Correct — D: Erectile dysfunction is described as the most prevalent form of male sexual dysfunction, which can result from physical or psychological factors impairing erection, emission, or ejaculation. B, C, and A are less commonly cited as the most prevalent form."}, {"q": "Which of the following can impair spermatogenesis according to the summary review?", "opts": ["Adequate scrotal cooling maintained through normal thermoregulation", "Regular moderate aerobic exercise performed several times weekly", "Testicular trauma, infection, atrophy, high fever, drug ingestion, environmental toxin exposure, and cryptorchidism", "Normal, unimpeded testosterone secretion from the Leydig cells"], "ans": 2, "exp": "Correct — C: Spermatogenesis can be impaired by disruptions reducing testosterone secretion, testicular trauma/infection/atrophy, systemic illness with high fever, drug ingestion, environmental toxin exposure r the glans, associated with poor hygiene and chronic infection (or sexually transmitted infection in adults), is phimosis. B describes the opposite problem (a retracted foreskin that cannot be returned). C and A describe unrelated penile conditions with different mechanisms."}, {"q": "A man presents to the emergency department after his foreskin was retracted during a procedure and could not be returned to its normal position. The glans appears swollen and dusky. What is the most urgent concern?", "opts": ["A routine, entirely non-urgent finding requiring no further treatment or monitoring at all", "Paraphimosis constricting the penile blood vessels, threatening circulation to the glans", "Testicular torsion resulting from twisting of the spermatic cord", "Prostatitis presenting with referred pain to the glans penis"], "ans": 1, "exp": "Correct — B: B retracted foreskin that cannot be reduced is paraphimosis, which can constrict penile blood vessels and compromise circulation to the glans — an urgent condition. A understates the urgency. C and D describe unrelated structures/conditions."}, {"q": "A 50-year-old man reports a new lateral curvature of the penis during erection along with painful intercourse for both himself and his partner. Exam reveals a palpable plaque along the shaft. Which condition is most likely, and what is its underlying pathology?", "opts": ["Condyloma acuminatum, arising from an underlying HPV infection", "Priapism, resulting from ischemic vascular occlusion of the corpora", "Peyronie disease, from tunical fibrosis of the corpora cavernosa", "Varicocele, resulting from abnormal dilation of spermatic cord veins"], "ans": 2, "exp": "Correct — C: C palpable penile plaque with lateral curvature and painful erection/intercourse describes Peyronie disease, caused by tunical fibrosis of the corpora cavernosa (a wound-healing disorder of the tunica albuginea). B, A, and D describe unrelated conditions with different presentations."}, {"q": "A man wi crotum on exam. His mother notes he was born at a low birthweight. Which condition is most likely, and what is the most significant risk factor present?", "opts": ["Testicular torsion; family history is the main risk factor here", "Cryptorchidism; low birthweight is the main risk factor", "Varicocele; maternal obesity is the main risk factor here", "Hydrocele; advanced maternal age is the main risk factor here"], "ans": 1, "exp": "Correct — B: An empty hemiscrotum in a newborn describes cryptorchidism (undescended testis), the most common male genital birth defect, with low birthweight as the primary risk factor (family history is secondary). A, C, and D describe different conditions/risk factors."}, {"q": "A 16-year-old boy presents to the emergency department with sudden, severe unilateral testicular pain that began 3 hours ago, with a high-riding, horizontally oriented testis on exam. What is the most urgent next step?", "opts": ["Oral antibiotics for presumed epididymitis with no further workup needed", "Reassurance with routine outpatient follow-up in one week", "Emergency surgical evaluation, since this presentation suggests testicular torsion requiring correction within 6 hours to preserve testicular function", "Application of ice to the scrotum with observation only"], "ans": 2, "exp": "Correct — C: Sudden, severe unilateral testicular pain with a high-riding, horizontal testis is classic for testicular torsion, a surgical emergency requiring correction within 6 hours of pain onset to preserve testicular function. B, A, and D all inappropriately delay the urgent surgical evaluation this presentation requires."}, {"q": "A 24-year-old sexually active man presents with unilateral testicular pain and swelling, with a history of an untreated STI. Which diagnosis is most likely, and what is a common risk factor in his age group?", "opts": ["Peyronie disease; abnormal wound healing is the main risk factor here", "Testicular cancer; a history of cryptorchidism is the main risk factor here", "BPH; advancing age alone is the main risk factor in this scenario", "Orchitis; a preexisting history of epididymitis or unprotected sexual contact is a common risk factor"], "ans": 3, "exp": "Correct — D: Acute, usually unilateral testicular inflammation with a history of sexually transmitted infection or epididymitis describes orchitis, with unprotected sexual contact and prior epididymitis as recognized risk factors. B, C, and A describe different conditions with different risk factor profiles and typical age groups."}, {"q": "A 28-year-old man with a history of cryptorchidism as an infant (surgically corrected) presents with a painless testicular mass. Which diagnosis should be strongly suspected given his history, and by roughly how much does this history elevate his risk?", "opts": ["Testicular cancer; cryptorchidism increases risk approximately fivefold", "Hydrocele; a history of cryptorchidism has no bearing on hydrocele risk", "Varicocele; a history of cryptorchidism approximately doubles varicocele risk", "Orchitis; a history of cryptorchidism approximately triples orchitis risk"], "ans": 0, "exp": "Correct — A: A painless testicular mass in a young man with a history of cryptorchidism should raise strong concern for testicular cancer, since cryptorchidism is the most consistent risk factor, increasing risk approximately fivefold. B, C, and D misapply this risk relationship to unrelated conditions."}, {"q": "A 70-year-old man with a chronic indwelling urinary catheter develops acute epididymal pain and swelling. What is the most likely cause given his age and catheter use?", "opts": ["Peyronie disease resulting from chronic tunical fibrosis", "A sexually transmitted pathogen, as commonly seen in younger men", "Testicular torsion resulting from spermatic cord twisting", "Retrograde flow of urine (common in elderly males, especially with catheter use), causing epididymitis"], "ans": 3, "exp": "Correct — D: In elderly males, especially with long-term catheter use, epididymitis is commonly caused by retrograde flow of urine, in contrast to younger men where sexually transmitted pathogens predominate. B misapplies the younger-male mechanism to this elderly patient. C and A describe unrelated conditions."}, {"q": "A 68-year-old man reports urinary frequency, weak stream, and a sensation of incomplete bladder emptying. Digital rectal exam reveals a smoothly enlarged, nontender prostate. Which condition is most consistent, and what is the mechanism of his symptoms?", "opts": ["Acute bacterial prostatitis, caused by an ascending urinary infection", "Benign prostatic hyperplasia (BPH); the enlarging prostate compresses the urethra, causing bladder outlet obstruction", "Prostate cancer, characterized by a hard, irregular palpable nodule", "Testicular torsion, caused by acute vascular compromise"], "ans": 1, "exp": "Correct — B: Urinary frequency, weak stream, and incomplete emptying with a smoothly enlarged, nontender prostate is classic for BPH, in which the enlarging (benign) prostate compresses the urethra and causes bladder outlet obstruction. A and C describe different prostate conditions with different exam findings (tender/boggy for acute prostatitis; hard/nodular/irregular for cancer). D describes an unrelated scrotal emergency."}, {"q": "A 45-year-old man presents with chronic pelvic pain for over 3 months, with negative urine cultures on repeated testing. Which NIH prostatitis category best fits, assuming inflammatory cells are absent?", "opts": ["Chronic bacterial prostatitis (CBP), confirmed by positive cultures", "Acute bacterial prostatitis (ABP), with sudden systemic symptoms", "Chronic pelvic pain syndrome (CPPS)", "Asymptomatic inflammatory prostatitis, found incidentally"], "ans": 2, "exp": "Correct — C: Chronic pelvic pain lasting more than 3 months with negative cultures fits chronic pelvic pain syndrome (CPPS), one of the four NIH prostatitis categories. B and A both involve bacterial infection (which would show on culture), and D is by definition asymptomatic, which does not match this patient's pain."}, {"q": "A 66-year-old man is diagnosed with prostate adenocarcinoma found at the periphery of the gland on biopsy. Which receptor pathway is understood to play a major role in this cancer's development and progression?", "opts": ["Thyroid hormone receptor signaling within prostatic tissue", "Estrogen receptor signaling within prostatic glandular cells", "Insulin receptor signaling exclusively, independent of androgens", "Androgen receptor (AR) signaling"], "ans": 3, "exp": "Correct — D: Androgens and androgen receptor (AR) function play major roles in prostate cancer development and progression, and most prostate cancers (adenocarcinomas) arise at the gland periphery, as in this patient. B, C, and A are not the primary receptor pathway implicated in prostate cancer."}, {"q": "A 60-year-old man reports difficulty achieving and maintaining an erection sufficient for intercourse over the past year, with no other reported sexual complaints. Which term describes this, and how common is it relative to other male sexual dysfunctions?", "opts": ["Retrograde ejaculation; it is the most common finding in young men", "Anorgasmia; a comparatively rare form of male sexual dysfunction", "Erectile dysfunction; it is the most prevalent form of male sexual dysfunction", "Priapism; considered a distinct condition rather than a form of erectile dysfunction"], "ans": 2, "exp": "Correct — C: Difficulty achieving/maintaining an erection is erectile dysfunction, described as the most prevalent form of male sexual dysfunction. B and A describe different, less common sexual dysfunctions, and D mischaracterizes priapism (a prolonged unwanted erection, essentially the opposite problem)."}, {"q": "A 15-year-old boy develops a high fever (over 104°F) during a systemic viral illness. Several weeks later, his semen analysis (obtained years later for an unrelated reason) sh he lungs for oxygenation. B and A swap the sides/functions, and C incorrectly assigns systemic-oxygenation function to the right side."}, {"q": "What are the three layers of the heart wall, from outer to inner?", "opts": ["Epicardium, myocardium, endocardium", "Endocardium, myocardium, epicardium", "Myocardium, epicardium, endocardium", "Pericardium, myocardium, epicardium"], "ans": 0, "exp": "Correct — A: From outer to inner, the heart wall layers are the epicardium (outer), myocardium (muscular), and endocardium (inner lining); the whole heart lies within the pericardium, a separate double-walled sac. B and C misorder the layers, and D incorrectly substitutes the pericardium (external sac) for the epicardium in the wall sequence."}, {"q": "Why is the ventricular myocardium thicker than the atrial myocardium?", "opts": ["Atria must maintain continuous tone to prevent backflow through the pulmonary and systemic veins", "Atrial myocardium contains more mitochondria and requires thicker walls for ATP production", "Ventricles must generate more force to squeeze blood out of the heart into the circulation", "Ventricular and atrial myocardium are histologically identical in thickness and fiber orientation"], "ans": 2, "exp": "Correct — C: The ventricular myocardium is thicker/stronger because ventricles must forcefully eject blood into the pulmonary artery or aorta, whereas the thinner atrial myocardium only needs to move blood into the adjacent ventricles. A, B, and D misstate the anatomy/physiology."}, {"q": "Blood flows from the right atrium through which valve into the right ventricle?", "opts": ["Mitral (left atrioventricular) valve, located between the left atrium and ventricle", "Aortic semilunar valve, located at the outflow tract of the left ventricle", "Tricuspid (right atrioventricular) valve", "Pulmonary semilunar valve, located at the right ventricular outflow tract"], "ans": 2, "exp": "Correct — C: Blood passes from the right atrium through the tricuspid (right atrioventricular) valve into the right ventricle. A is the left AV valve, B and D are semilunar valves on the outflow side of the ventricles, not the right atrium-to-ventricle valve."}, {"q": "Which vessel receives blood after it passes through the pulmonary semilunar valve?", "opts": ["The pulmonary artery", "The aorta, arising from the left ventricular outflow tract", "The pulmonary veins, returning oxygenated blood to the left atrium", "The superior vena cava, emptying deoxygenated blood into the right atrium"], "ans": 0, "exp": "Correct — A: Blood leaves the right ventricle through the pulmonary valve into the pulmonary artery, which delivers it to the lungs. C carries oxygenated blood back to the left atrium (the reverse direction), B carries blood from the left ventricle, and D delivers deoxygenated blood into the right atrium (upstream, not downstream, of the pulmonary valve)."}, {"q": "What is the function of the atrioventricular valves versus the semilunar valves?", "opts": ["AV valves prevent backflow into the great arteries; semilunar valves prevent backflow into the atria, the reverse of their actual roles", "AV valves regulate coronary artery perfusion pressure; semilunar valves regulate lymphatic fluid return to the subclavian veins", "AV valves ensure one-way flow from atria to ventricles; semilunar valves ensure one-way flow from ventricles into the great arteries", "AV valves are present only on the left side of the heart, while semilunar valves function only on the right side"], "ans": 2, "exp": "Correct — C: The atrioventricular valves (tricuspid, mitral) ensure one-way flow from atria to ventricles, while the semilunar valves (pulmonary, aortic) ensure one-way flow from the ventricles into the pulmonary artery and aorta. B, A, and D misstate these distinct roles/locations."}, {"q": "Diastole and systole refer to which phases of the cardiac cycle, respectively?", "opts": ["Diastole = myocardial contraction and ejection; systole = myocardial relaxation and filling, the reverse of the actual sequence", "Diastole = ventricular filling (myocardial relaxation); systole = ventricular ejection (myocardial contraction)", "Both terms refer exclusively to atrial depolarization as seen on the ECG's P wave", "Diastole describes atrial repolarization only; systole describes ventricular depolarization only"], "ans": 1, "exp": "Correct — B: Diastole is the relaxation phase during which the ventricles fill with blood; systole is the contraction phase that ejects blood from the ventricles — together forming one cardiac cycle/heartbeat. A reverses the definitions, and C and D misstate which chambers/phases are involved."}, {"q": "When do the coronary arteries fill with blood, and why?", "opts": ["During diastole, because the aortic valve cusps block the coronary openings during systole", "During systole, when ventricular contraction increases aortic pressure and drives blood into the coronary ostia", "Coronary filling depends solely on systemic vascular resistance, not on intracardiac valve position", "Only during atrial systole, when the P wave triggers coronary ostial opening"], "ans": 0, "exp": "Correct — A: Coronary arteries fill mainly during diastole, since during systole the cusps of the aortic semilunar valve block the coronary artery openings and myocardial contraction compresses the coronary vessels. B reverses the correct phase, and C and D are inconsistent with this described cyclical dependence."}, {"q": "What does the P wave of the ECG represent?", "opts": ["Ventricular depolarization, producing the QRS complex", "Atrial repolarization, typically hidden within the QRS complex", "Ventricular repolarization, producing the T wave", "Atrial depolarization"], "ans": 3, "exp": "Correct — D: The P wave represents atrial depolarization. A (ventricular depolarization) corresponds to the QRS complex, and C and B (repolarization waves) are represented elsewhere on the ECG (T wave for ventricular repolarization), not the P wave."}, {"q": "Which node normally functions as the heart's natural pacemaker, and at what intrinsic rate?", "opts": ["AV node, 40-60 impulses/min", "Purkinje fibers, discharging spontaneously at 15-40 impulses/min in the ventricles", "Bundle of His, 40-60 impulses/min", "Sinoatrial (SA) node, 60-100 impulses/min"], "ans": 3, "exp": "Correct — D: The SA node is the natural pacemaker, generating impulses at 60 to 100 per minute because its cells depolarize faster than other automatic cells. A, C, and B describe backup pacemaker sites with progressively slower intrinsic rates, not the primary pacemaker."}, {"q": "If the SA node is disabled, which structure becomes the next pacemaker?", "opts": ["The right atrium's working myocardial cells, acting as an ectopic pacemaker", "The AV node", "The aortic valve cusps, which contain specialized conducting tissue", "Skeletal muscle fibers surrounding the great vessels"], "ans": 1, "exp": "Correct — B: If the SA node fails, the AV node — the next fastest automatic pacemaker — takes over impulse generation. A, C, and D are not part of the cardiac conduction/pacemaker hierarchy."}, {"q": "Which structural features allow myocardial cells to transmit action potentials rapidly and access ions readily, distinguishing them from skeletal muscle?", "opts": ["Intercalated discs and an abundance of transverse tubules", "A dense fibrous pericardial capsule that insulates cells from ion exchange", "Thickened sarcolemma with reduced sodium-potassium ATPase activity", "Sparse mitochondria and minimal sarcoplasmic reticulum calcium storage"], "ans": 0, "exp": "Correct — A: Intercalated discs allow rapid action potential transmission between myocardial cells, and abundant transverse tubules/mitochondria give readier ion access and ATP synthesis, enabling constant myocardial work. B, C, and D describe the opposite of the actual myocardial structural adaptations."}, {"q": "What ion interacts with the troponin complex to initiate myocardial contraction?", "opts": ["Sodium, which drives the rapid upstroke of the action potential", "Potassium, which mediates repolarization by efflux from the cell", "Chloride, which stabilizes the resting membrane potential", "Calcium"], "ans": 3, "exp": "Correct — D: Calcium ions interact with the troponin complex to enable actin-myosin cross-bridge formation and initiate contraction; relaxation follows as troponin releases calcium. A, B, and C are not the ion responsible for triggering this excitation-contraction coupling step."}, {"q": "Which four factors determine cardiac performance?", "opts": ["Hematocrit, plasma viscosity, platelet count, and serum hemoglobin concentration", "Preload, afterload, myocardial contractility, and heart rate", "Core body temperature, respiratory rate, arterial pH, and serum glucose level", "Patient height, body weight, chronologic age, and biological sex"], "ans": 1, "exp": "Correct — B: Cardiac performance is determined by preload, afterload, myocardial contractility, and heart rate. A, C, and D list factors not identified as the core determinants of cardiac performance in this framework."}, {"q": "The Frank-Starling law of the heart describes which relationship?", "opts": ["Heart rate and stroke volume are always directly proportional regardless of filling", "The greater the myocardial stretch (up to a point), the stronger the contraction", "Increased afterload always proportionally increases stroke volume output", "Myocardial contractility depends solely on autonomic innervation, not fiber length"], "ans": 1, "exp": "Correct — B: The Frank-Starling law states that greater myocardial stretch (preload) produces a stronger contraction, up to a physiologic limit. A, C, and D contradict this established relationship between stretch, preload, and contractile force."}, {"q": "Vessel walls have three layers. Which layer is the innermost, in direct contact with blood?", "opts": ["Tunica externa, the outer connective tissue layer anchoring the vessel", "Tunica media, the middle layer of smooth muscle and elastic fibers", "Tunica intima", "Tunica adventitia alone, without any inner endothelial lining"], "ans": 2, "exp": "Correct — C: The tunica intima is the innermost layer of a vessel wall, in direct contact with the blood. A (tunica externa/adventitia) is the outermost connective tissue layer, and B (tunica media) is the middle, mostly smooth-muscle/elastic layer — neither is the innermost."}, {"q": "Why do arteries closer to the heart contain more elastic fibers than muscular arteries farther away?", "opts": ["To resist collapse during periods of markedly reduced venous return and low intraluminal pressure", "To store greater quantities of oxygen for local tissue metabolism", "To distend during systole and recoil during diastole, smoothing pulsatile flow", "To increase sympathetic nerve density for reflex vasoconstriction"], "ans": 2, "exp": "Correct — C: Elastic arteries near the heart need to distend during systole and recoil during diastole to accommodate the pulsatile output of the heart, while muscular arteries farther away use smooth muscle to control regional blood flow/pressure. B, A, and D do not reflect the described structure-function relationship."}, {"q": "What structures control blood flow into individual capillary beds?", "opts": ["The venae cavae, which collect venous return before it reaches the right atrium", "Precapillary sphincters at the junction of metarterioles and capillaries", "The pericardium, the fibrous sac surrounding and protecting the heart", "The AV node, which delays impulse conduction between atria and ventricles"], "ans": 1, "exp": "Correct — B: Precapillary sphincters (smooth muscle bands) at metarteriole-capillary junctions contract or relax to control blood flow into specific capillary beds. A, C, and D are unrelated structures that do not regulate capillary perfusion."}, {"q": "According to the Poiseuille law, resistance to blood flow is related to tube length, viscosity, and radius in what way?", "opts": ["Directly related to blood pressure and cardiac output only, not vessel geometry", "Inversely related to length and viscosity; directly related to radius", "Directly related to length and viscosity; inversely related to radius", "Directly related to vessel radius and inversely related to hematocrit alone"], "ans": 2, "exp": "Correct — C: Poiseuille's law states resistance is directly related to tube length and blood viscosity, and inversely related to the radius of the vessel (small changes in radius produce large changes in resistance). B, A, and D misstate or omit these relationships."}, {"q": "How does the arrangement of vessels (series versus parallel) affect total resistance?", "opts": ["Arrangement affects flow velocity only, never total vascular resistance", "Vessels arranged in parallel always produce greater resistance than those in series", "Vessels arranged in series produce greater total resistance than vessels arranged in parallel", "Only the combined vessel radius matters for total resistance; the series versus parallel arrangement of vessels is entirely irrelevant"], "ans": 2, "exp": "Correct — C: Vessels in series produce greater total resistance, while vessels arranged in parallel produce lesser total resistance, given the combined lengths and radii of the vessels involved. B, A, and D misstate this relationship."}, {"q": "Which hormonal systems can alter blood volume and thus blood pressure?", "opts": ["Growth hormone and insulin-like growth factor-1 (IGF-1) exclusively", "Insulin, glucagon, and cortisol acting through hepatic gluconeogenesis", "Thyroid hormone and parathyroid hormone acting on renal calcium and phosphate handling pathways", "ADH, the renin-angiotensin-aldosterone system (RAAS), and natriuretic peptides (NPs)"], "ans": 3, "exp": "Correct — D: ADH, RAAS, and natriuretic peptides can all alter blood volume and therefore blood pressure. B, C, and A name hormone systems not identified as primary regulators of blood volume/pressure in this context."}, {"q": "What is the function of myoglobin within heart muscle?", "opts": ["It transmits electrical impulses between adjacent myocardial cells via gap junctions", "It stores oxygen for use during the systolic phase of the cardiac cycle", "It forms the dense collagenous skeleton that anchors the four heart valves", "It regulates lymphatic drainage from the myocardium into the thoracic duct"], "ans": 1, "exp": "Correct — B: Myoglobin in heart muscle stores O2 for use during systole, when coronary blood flow to the compressed myocardium is reduced. A, C, and D describe unrelated cardiac functions/structures."}, {"q": "Where does lymph ultimately drain into the venous circulation?", "opts": ["Into the right or left subclavian vein via the right lymphatic duct or thoracic duct", "Directly into the aorta via a direct lymphaticoaortic connection", "Into the coronary sinus, alongside deoxygenated coronary venous blood", "Into the pulmonary artery, mixing with deoxygenated blood that is bound for gas exchange in the lungs"], "ans": 0, "exp": "Correct — A: Lymph travels through increasingly larger lymphatic vessels and empties via the right lymphatic duct or thoracic duct into the right or left subclavian vein, respectively. B, C, and D are not the described drainage points for the lymphatic system."}, {"q": "What is the primary immune function of lymph nodes along the lymphatic pathway?", "opts": ["They filter and destroy senescent or damaged red blood cells before blood returns to the systemic venous circulation", "They regulate heart rate through direct innervation of the SA node", "They produce erythropoietin in response to systemic hypoxia", "They sample antigens and cells carried by lymph from the periphery before it enters the central circulation"], "ans": 3, "exp": "Correct — D: Lymph nodes are strategically positioned to sample antigens and cells carried by lymph from the body's periphery before it reaches central circulation, serving as key sites of immune surveillance. A, C, and B do not describe the lymph nodes' primary function."}, {"q": "Which imaging/testing modality is used to inject contrast into the coronary arteries to visualize the coronary circulation specifically?", "opts": ["Coronary angiography", "Echocardiography, which uses ultrasound waves to assess chamber and valve structure", "Holter monitoring, which records ambulatory ECG rhythm over 24 to 48 hours", "Doppler ultrasonography of the legs, used to assess peripheral venous flow"], "ans": 0, "exp": "Correct — A: Coronary angiography involves injecting contrast medium into the coronary arteries to visualize the coronary circulation and tissue perfused by it. B uses ultrasound (not contrast injection) to assess structure/function, C monitors rhythm over time, and D assesses peripheral venous/arterial flow, not coronary anatomy specifically."}, {"q": "What age-related physiologic changes are most relevant to declining cardiovascular performance in older adults?", "opts": ["Only changes in taste and smell, with cardiovascular structure remaining entirely unaffected by aging", "Complete absence of any cardiovascular changes with age, since the heart does not undergo structural remodeling over time", "Myocardial/vessel stiffening, altered neurogenic vascular control, increased atrial fibrillation, and reduced exercise capacity with LV hypertrophy/fibrosis", "Only changes in bone density and joint cartilage, with no measurable cardiovascular remodeling"], "ans": 2, "exp": "Correct — C: Age-associated cardiovascular changes include myocardial and vessel stiffening, altered neurogenic vascular tone control, increased atrial fibrillation, reduced exercise capacity, and left ventricular hypertrophy/fibrosis. B, A, and D do not reflect the described cardiovascular aging changes."}], "clinical": [{"q": "A patient's ECG shows a normal P wave but an absent QRS complex following it. Which part of the cardiac cycle is most likely disrupted?", "opts": ["Conduction from the atria to the ventricles (e.g., AV block) preventing ventricular depolarization", "Atrial depolarization failure, since in that case the P wave itself would be absent, not merely the QRS complex", "Isolated ventricular repolarization failure, which would alter the T wave, not the QRS", "Impaired coronary perfusion alone, which would not eliminate the QRS complex on ECG"], "ans": 0, "exp": "Correct — A: Since the P wave (atrial depolarization) is present but not followed by a QRS complex (ventricular depolarization), this suggests failure of impulse conduction from the atria to the ventricles, as seen in high-grade AV block. B is intact (the P wave is present). C and D are not directly reflected by an absent QRS following a normal P wave."}, {"q": "A patient's SA node is damaged by ischemia and stops generating impulses. The heart continues beating, but at a slower rate than normal. Which structure has most likely taken over as pacemaker?", "opts": ["The tunica media of the aorta, which contains smooth muscle but no pacemaker cells", "Purkinje fibers acting alone, generating impulses at 60 to 100 beats per minute", "The aortic valve cusps, which lack any automaticity or conduction tissue", "The AV node, the next fastest automatic pacemaker"], "ans": 3, "exp": "Correct — D: When the SA node fails, the AV node — the next fastest automatic pacemaker in the conduction hierarchy — takes over, typically at a slower intrinsic rate, explaining the bradycardia. B, C, and A are not part of the cardiac pacemaker hierarchy."}, {"q": "A patient in hypovolemic shock has decreased ventricular filling. Based on the Frank-Starling law, what would be the expected effect on stroke volume?", "opts": ["Stroke volume would increase due to reflex tachycardia compensating for hypovolemia", "Stroke volume would remain unchanged since baroreceptor reflexes fully correct for volume loss", "Stroke volume would decrease due to increased afterload from arterial vasoconstriction alone", "Stroke volume would decrease due to reduced myocardial stretch (reduced preload)"], "ans": 3, "exp": "Correct — D: Per the Frank-Starling law, decreased ventricular filling (preload) reduces myocardial stretch and therefore decreases the force of contraction and stroke volume. A describes the opposite relationship. C and B contradict the established preload-contractility relationship."}, {"q": "A researcher measures resistance in a blood vessel and doubles its radius while keeping length and viscosity constant. Based on the Poiseuille law, what happens to resistance?", "opts": ["Resistance increases exactly fourfold, since resistance is directly proportional to the vessel radius itself", "Resistance is halved, changing in direct proportion to the change in radius", "Resistance remains unchanged, since only vessel length affects resistance", "Resistance decreases substantially, since resistance is inversely related to vessel radius"], "ans": 3, "exp": "Correct — D: Since resistance is inversely related to vessel radius per the Poiseuille law (and this relationship is to the fourth power of the radius), doubling the radius substantially decreases resistance. B, C, and A misapply or contradict this inverse relationship."}, {"q": "A patient's echocardiogram reveals impaired coronary artery filling specifically during systole due to severe aortic valve disease. What is the physiologic explanation for why coronary filling normally occurs in diastole rather than systole?", "opts": ["Coronary arteries fill preferentially during systole, when aortic root pressure peaks and drives forward flow", "During systole, the cusps of the aortic semilunar valve block the coronary artery openings, and myocardial contraction compresses the coronary arteries", "Coronary flow is entirely independent of the cardiac cycle and depends only on systemic vascular resistance", "Diastolic filling occurs because venous valves in the coronary sinus open only during ventricular relaxation"], "ans": 1, "exp": "Correct — B: Coronary filling normally occurs during diastole because during systole, the aortic valve cusps block the coronary ostia and myocardial contraction compresses the coronary vessels, reducing flow. A, C, and D misstate this well-established physiologic mechanism."}, {"q": "A patient with long-standing venous insufficiency is found to have impaired oxygen/nutrient delivery to leg tissues and difficulty with waste removal. Which vessel type is primarily responsible for this exchange function?", "opts": ["Capillaries", "Large veins, which primarily serve as low-pressure capacitance/reservoir vessels", "The aorta, the large elastic conduit vessel carrying blood from the left ventricle", "The vena cava, which returns deoxygenated blood to the right atrium"], "ans": 0, "exp": "Correct — A: Capillaries are the exchange vessels where O2, nutrients, and other substances pass into tissues and metabolic wastes are absorbed — impaired capillary exchange (from venous congestion) explains poor tissue oxygenation/waste removal here. B, C, and D are conduction vessels, not primary sites of nutrient/waste exchange."}, {"q": "A patient undergoing cardiac catheterization has oxygen content and pressure measured in each heart chamber. Which test is being performed, and what additional information can coronary angiography (often performed in the same setting) provide?", "opts": ["Coronary angiography measures only systemic venous pressure in the great veins, not arterial anatomy", "Cardiac catheterization only assesses lymphatic drainage into the thoracic duct, not chamber pressures", "Cardiac catheterization measures chamber pressures/oxygen content; coronary angiography (contrast injection into coronary arteries) visualizes the coronary circulation itself", "Both tests measure identical parameters, since angiography simply repeats the catheter pressure readings"], "ans": 2, "exp": "Correct — C: Cardiac catheterization measures oxygen content and pressure within the heart chambers and can inject contrast to visualize chamber/valve size and shape, while coronary angiography specifically visualizes the coronary arteries and the myocardial tissue they perfuse. B, A, and D misstate the distinct purposes of these two related procedures."}, {"q": "A 78-year-old patient with no known cardiac disease is found to have new-onset atrial fibrillation and reduced exercise tolerance. Which age-related cardiovascular change most likely contributes to this presentation?", "opts": ["Myocardial and vessel stiffening with increased occurrence of atrial fibrillation, a recognized age-associated change", "Complete absence of any cardiovascular aging effects, since cardiac conduction tissue and vessel walls do not change structurally over time", "Increased vessel elasticity and compliance that typically develops with advancing age", "Improved neurogenic vascular tone control that strengthens progressively throughout adulthood"], "ans": 0, "exp": "Correct — A: Increased occurrence of atrial fibrillation, along with myocardial/vessel stiffening and reduced exercise capacity, is a recognized age-associated cardiovascular change. B, C, and D contradict the described pattern of age-related cardiovascular changes (which involve stiffening and reduced capacity, not improvement)."}, {"q": "A patient's care team notes that with structured physical activity, risk factor reduction, and disease management, the patient's cardiovascular health has markedly improved despite advanced age. What does this best illustrate?", "opts": ["Age-related cardiovascular decline follows an entirely fixed, genetically predetermined trajectory that cannot be influenced by lifestyle changes", "Older adults can have markedly improved cardiovascular health with active risk reduction, physical activity, and disease management", "Cardiovascular disease has been surpassed by cancer as the leading cause of death in older adults", "Exercise produces no measurable physiologic effect on vascular stiffness or exercise capacity"], "ans": 1, "exp": "Correct — B: The summary review specifically notes that with active risk reduction, physical activity, and disease management, older adults can have markedly improved cardiovascular health — exactly as observed in this patient. A, C, and D contradict this stated principle and the broader epidemiology of cardiovascular disease in aging."}, {"q": "A patient has a myocardial biopsy showing an unusually high density of mitochondria and transverse tubules in cardiac cells compared with skeletal muscle. What functional advantage does this structural difference provide?", "opts": ["It reflects a pathologic adaptation typically seen only in end-stage heart failure", "It reduces the heart's oxygen consumption by eliminating aerobic metabolism entirely", "It removes the requirement for calcium-troponin interaction during excitation-contraction coupling in cardiac muscle cells", "It allows myocardial cells to synthesize more ATP and have readier access to ions, supporting continuous cardiac work"], "ans": 3, "exp": "Correct — D: The abundance of mitochondria (for ATP synthesis) and transverse tubules (for ion access) in myocardial cells supports the continuous, unceasing work required of the heart, unlike skeletal muscle, which rests intermittently. B, C, and A misstate or dismiss the functional significance of these structural adaptations."}, {"q": "A patient in the ICU has a central line inadvertently placed with its tip visualized entering the right atrium from a large vein above the heart. Which vessel(s) most likely delivered the catheter to this location?", "opts": ["The pulmonary veins, which carry oxygenated blood into the left atrium", "The superior or inferior vena cava", "The coronary sinus alone, which drains venous blood from the myocardium", "The aorta, which carries oxygenated blood away from the left ventricle"], "ans": 1, "exp": "Correct — B: Deoxygenated blood (and, in this scenario, a central line) enters the right atrium via the superior and inferior venae cavae. A delivers oxygenated blood to the left atrium, not the right. C is a much smaller structure draining coronary venous blood, and D carries blood away from the left ventricle, not toward the right atrium."}, {"q": "A cardiology fellow explains that lymphatic vessels run alongside arteries and veins and drain interstitial fluid, ultimately returning it to the venous circulation. Why is this lymphatic return function physiologically important?", "opts": ["It serves only a vestigial role left over from embryonic development with no adult function", "It functions only during fetal circulation, regressing completely after birth", "It entirely replaces venous return, making the venous system redundant after infancy", "It returns fluid and proteins that leak from capillaries into the interstitium back to the circulatory system, and helps deliver antigens/microorganisms/cells to lymph nodes for immune surveillance"], "ans": 3, "exp": "Correct — D: Lymphatic vessels collect interstitial fluid (which continuously leaks from capillaries) and return it to the circulatory system, while also delivering antigens, microorganisms, and cells to lymph nodes for immune sampling. A, C, and B understate or misstate this essential physiologic role."}, {"q": "A patient with suspected structural valve disease undergoes an echocardiogram rather than a stress test. Why would echocardiography be preferred to detect this type of abnormality?", "opts": ["Echocardiography can only measure heart rate and rhythm, not chamber or valve structure", "Echocardiography detects structural and functional cardiac abnormalities directly, whereas stress testing primarily elicits ischemia-related manifestations not present at rest", "Stress testing is the only modality capable of directly visualizing valve leaflet motion", "Echocardiography and stress testing rely on the identical underlying imaging technology"], "ans": 1, "exp": "Correct — B: Echocardiography is specifically suited to detect structural and functional cardiac abnormalities (such as valve disease) over time, while stress testing is designed to elicit exercise-induced manifestations of ischemic disease that may not appear at rest. A, C, and D misstate the distinct diagnostic purposes of these tests."}]}, {"title": "Alterations of Cardiovascular Function", "code": "Chapter 32", "color": "c9", "subtitle": "Venous & Arterial Disease • Hypertension • Atherosclerosis/CAD • Angina & MI • Heart Wall Disorders • Heart Failure • Dysrhythmias", "general": [{"q": "Varicose veins most commonly develop in which vessels, and from what underlying causes?", "opts": ["The carotid arteries, from atherosclerotic plaque rupture and subsequent embolization to the brain", "The coronary arteries, from progressive atherosclerotic luminal narrowing", "The pulmonary veins, from congenital anomalous venous connections", "The saphenous veins of the leg, from damaged valves (trauma) or chronic venous distention"], "ans": 3, "exp": "Correct — D: Varicose veins are veins with pooled blood, usually in the leg's saphenous veins, caused by damaged valves (from trauma) or chronic venous distention involving gravity and venous constriction. B, C, and A describe unrelated vessels/mechanisms."}, {"q": "Chronic venous insufficiency can lead to which complication from poor tissue circulation?", "opts": ["Cardiac tamponade from rapid pericardial fluid accumulation compressing the heart", "Aortic aneurysm from progressive weakening of the aortic wall", "Venous stasis ulcers", "Pulmonary hypertension from chronic elevated pulmonary vascular resistance"], "ans": 2, "exp": "Correct — C: Chronic venous insufficiency causes pathologic ischemic changes making tissue vulnerable to trauma/infection, resulting in venous stasis ulcers. B, A, and D are complications of different disease processes, not chronic venous insufficiency."}, {"q": "What is the most serious complication of deep venous thrombosis (DVT)?", "opts": ["Varicose veins from long-standing venous valve incompetence", "Rheumatic fever from a delayed immune reaction to streptococcal infection", "Cardiomyopathy from primary structural disease of the myocardium", "Pulmonary embolism"], "ans": 3, "exp": "Correct — D: The most serious complication of DVT is pulmonary embolism, occurring when a piece of the thrombus dislodges and travels to the pulmonary circulation. A, C, and B are unrelated conditions, not complications of DVT."}, {"q": "Superior vena cava syndrome is generally considered which type of emergency, and why?", "opts": ["A vascular emergency caused primarily by spontaneous venous thrombosis, unrelated to malignancy", "A cosmetic concern from chronic venous insufficiency requiring only compression therapy", "An oncologic emergency, because it is usually caused by bronchogenic cancer", "An infectious emergency resulting from bacterial endocarditis seeding the vena cava"], "ans": 2, "exp": "Correct — C: Because superior vena cava syndrome (progressive SVC occlusion causing venous distention in the upper body/head) is usually caused by bronchogenic cancer, it is generally treated as an oncologic emergency. A, B, and D mischaracterize both the cause and urgency of this condition."}, {"q": "Hypertension results from increases in which two physiologic parameters?", "opts": ["Elevated red blood cell count alone, independent of vascular resistance or output", "Heart rate alone, without any contribution from stroke volume or vessel tone", "Cardiac output (blood volume) and/or total peripheral vascular resistance", "Increased lymphatic flow alone, unrelated to the venous or arterial circulation"], "ans": 2, "exp": "Correct — C: Hypertension is elevated systemic arterial blood pressure resulting from increases in cardiac output (blood volume), total peripheral resistance, or both. B, A, and D are not the primary parameters described as driving hypertension."}, {"q": "Which of the following is NOT listed as a risk factor for primary hypertension?", "opts": ["Positive family history and black race", "High sodium intake and low potassium/calcium/magnesium intake", "Cigarette smoking and heavy alcohol use", "Blood type and eye color"], "ans": 3, "exp": "Correct — D: Blood type and eye color are not listed as risk factors. A, B, and C are all established risk factors for primary hypertension, along with male sex, advancing age, obesity, and diabetes."}, {"q": "Primary versus secondary hypertension are distinguished by which feature?", "opts": ["Primary hypertension always requires immediate hospitalization and IV antihypertensive therapy, unlike secondary hypertension", "Primary hypertension has no known single cause; secondary hypertension is caused by an identifiable underlying disease", "Secondary hypertension accounts for the majority of adult hypertension cases overall", "The distinction depends only on whether the patient is taking antihypertensive medication"], "ans": 1, "exp": "Correct — B: Primary (essential) hypertension has no single known cause and results from complex genetic/environmental/neurohumoral interactions, while secondary hypertension results from an identifiable underlying disease process or medication. A, C, and D misstate this distinction."}, {"q": "What is a hypertensive crisis, and why is it considered a medical emergency?", "opts": ["A mild, transient elevation in blood pressure that resolves spontaneously without treatment", "A sudden drop in blood pressure upon standing, causing dizziness and syncope", "An extremely high blood pressure that can lead to cardiac failure, stroke, or death", "A normal, expected variant of resting blood pressure seen in trained endurance athletes"], "ans": 2, "exp": "Correct — C: Hypertensive crisis is an extremely elevated blood pressure that can cause cardiac failure, stroke, or death, and is treated as a medical emergency. A, B, and D describe unrelated or much less severe conditions."}, {"q": "Orthostatic hypotension occurs due to which physiologic failure upon standing?", "opts": ["Exaggerated baroreceptor-mediated vasoconstriction causing a rebound hypertensive surge immediately upon standing, rather than any drop in pressure", "Sudden cardiac arrest triggered by vagally mediated asystole upon standing", "Replacement of the normal compensatory vasoconstriction response with marked vasodilation and blood pooling in muscle vasculature", "Complete but transient loss of cardiac output from acute ventricular fibrillation"], "ans": 2, "exp": "Correct — C: In orthostatic hypotension, the normal compensatory vasoconstriction upon standing is replaced by vasodilation and blood pooling in the muscle vasculature, causing a drop in blood pressure with symptoms like dizziness and syncope. A, B, and D misstate the underlying mechanism."}, {"q": "An aneurysm is defined as:", "opts": ["An organized blood clot adherent to the vessel wall, prone to embolization", "A localized dilation of a vessel wall, with the aorta particularly susceptible", "An autoimmune inflammatory disease of small peripheral arteries and arterioles", "A structural cardiac defect present from birth, unrelated to vessel wall integrity"], "ans": 1, "exp": "Correct — B: An aneurysm is a localized dilation of a vessel wall, and the aorta is particularly susceptible to this condition. A describes a thrombus, C describes conditions like thromboangiitis obliterans, and D describes an unrelated pediatric cardiac category."}, {"q": "What is the most common source of arterial thrombotic emboli?", "opts": ["The lungs, where emboli typically originate from pulmonary vascular thrombosis and travel distally", "The lower extremity veins, the classic source of venous (not arterial) emboli", "The left heart, associated with MI, valvular disease, heart failure, endocarditis, and dysrhythmias", "The kidneys, following renal vein thrombosis and embolization"], "ans": 2, "exp": "Correct — C: The left heart is the most common source of arterial thrombotic emboli, associated with conditions like myocardial infarction, valvular disease, left heart failure, endocarditis, and dysrhythmias. B, A, and D are not identified as the most common source."}, {"q": "Thromboangiitis obliterans is strongly associated with which risk factor?", "opts": ["Chronic vitamin D deficiency affecting peripheral vascular tone", "Isolated cold exposure without any associated vascular inflammation", "Long-term residence at high altitude with chronic hypoxic exposure", "Smoking"], "ans": 3, "exp": "Correct — D: Thromboangiitis obliterans, an autoimmune disease of peripheral arteries with inflammatory thrombi, is strongly associated with smoking. B, C, and A are not the primary risk factor described (cold/vibration/emotional stress are triggers for Raynaud phenomenon instead)."}, {"q": "Raynaud phenomenon is characterized by vasospastic attacks triggered by which factors?", "opts": ["Chronic excess dietary sodium intake causing volume-mediated hypertension", "Prolonged exposure to high altitude causing hypoxic pulmonary vasoconstriction", "Brief exposure to cold, vibration, or emotional stress", "Long-term tobacco use exclusively, with no role for temperature or stress"], "ans": 2, "exp": "Correct — C: Raynaud phenomenon involves vasospastic attacks in the small arteries/arterioles of the fingers and toes, triggered by brief cold exposure, vibration, or emotional stress. B, A, and D are not the described triggers."}, {"q": "Atherosclerosis begins with which initiating event?", "opts": ["Sudden complete arterial occlusion from an embolus lodging in a healthy vessel", "Endothelial injury, followed by an inflammatory process", "An inherited mutation of vascular smooth muscle cells causing spontaneous proliferation", "Direct viral infection of myocardial tissue causing inflammatory cell death"], "ans": 1, "exp": "Correct — B: Atherosclerosis is an inflammatory disease that begins with endothelial injury, followed by macrophage adherence, inflammatory mediator release, LDL oxidation, foam cell/fatty streak formation, and fibrous plaque development. A, C, and D do not describe the initiating event."}, {"q": "What happens when an atherosclerotic plaque ruptures?", "opts": ["Clot formation, instability, and vasoconstriction leading to lumen obstruction and inadequate oxygen delivery", "The fibrous cap reseals spontaneously within minutes, restoring normal luminal blood flow without any clot formation", "The lipid core is reabsorbed by macrophages with no thrombotic consequence", "Only distal venous congestion results, with the arterial lumen remaining patent"], "ans": 0, "exp": "Correct — A: Plaque rupture leads to clot formation, plaque instability, and vasoconstriction, obstructing the vessel lumen and impairing oxygen delivery to downstream tissue. B, C, and D understate or misstate the consequences of plaque rupture."}, {"q": "Which of the following are conventional (modifiable) risk factors for coronary artery disease?", "opts": ["ABO blood type and adult height, factors not linked to modifiable CAD risk", "Advanced age and male sex alone, both nonmodifiable rather than conventional modifiable coronary risk factors typically targeted by therapy", "Family history of CAD alone, a nonmodifiable rather than a modifiable risk factor", "Dyslipidemia, smoking, hypertension, diabetes/insulin resistance, obesity, sedentary lifestyle, and atherogenic diet"], "ans": 3, "exp": "Correct — D: Modifiable conventional CAD risk factors include dyslipidemia, smoking, hypertension, diabetes/insulin resistance, obesity, sedentary lifestyle, and atherogenic diet. B and C describe nonmodifiable risk factors instead, and A lists factors not identified as CAD risk factors."}, {"q": "Which of the following is classified as a nontraditional (novel) CAD risk factor?", "opts": ["Advanced age, a well-established traditional, nonmodifiable CAD risk factor", "Family history of premature coronary disease, a traditional nonmodifiable risk factor used in screening", "Male sex, a long-recognized traditional, nonmodifiable CAD risk factor", "Markers of inflammation, adipokines, chronic kidney disease, air pollution, and the microbiome"], "ans": 3, "exp": "Correct — D: Nontraditional/novel CAD risk factors include inflammatory/ischemic markers, adipokines, chronic kidney disease, air pollution/ionizing radiation, medications, and the microbiome. B, C, and A are conventional, nonmodifiable risk factors, not novel ones."}, {"q": "Stable angina pectoris is best described as:", "opts": ["Unpredictable chest pain occurring at rest, caused by coronary artery vasospasm", "Completely asymptomatic myocardial ischemia detected only on incidental ECG", "Chest pain that always indicates irreversible myocardial infarction has occurred, regardless of duration or pattern", "Predictable chest pain from myocardial ischemia in response to increased demand (e.g., exercise), without infarction"], "ans": 3, "exp": "Correct — D: Stable angina is predictable chest pain from myocardial ischemia triggered by increased demand (such as exertion), without resulting infarction. A describes Prinzmetal angina, C mischaracterizes angina as always progressing to infarction, and B describes silent ischemia."}, {"q": "Prinzmetal angina results from which mechanism?", "opts": ["Coronary artery vasospasm causing unpredictable ischemia, often at rest", "A fixed atherosclerotic stenosis that narrows the vessel lumen during exertion", "Chronic anemia reducing oxygen-carrying capacity of circulating hemoglobin", "Regurgitant flow through an incompetent aortic or mitral valve"], "ans": 0, "exp": "Correct — A: Prinzmetal angina results from coronary artery vasospasm, producing transient, unpredictable ischemic chest pain often occurring at rest, distinct from the exertional pattern of stable angina. B, C, and D do not describe its mechanism."}, {"q": "Why is silent ischemia clinically significant despite producing no symptoms?", "opts": ["It reflects a benign, self-limited variant of ischemia with no prognostic value", "It is an indicator of future serious cardiovascular events", "It always resolves spontaneously without any risk of progression to infarction", "It occurs exclusively in healthy young athletes with normal coronary arteries"], "ans": 1, "exp": "Correct — B: Silent (asymptomatic) myocardial ischemia is clinically significant because it is an indicator of future serious cardiovascular events, even without symptoms alerting the patient. A, C, and D understate or misstate its significance."}, {"q": "What triggers the acute coronary syndromes (unstable angina and myocardial infarction)?", "opts": ["Sudden coronary obstruction from thrombus formation on a ruptured, unstable atherosclerotic plaque", "Gradual, stable plaque narrowing that progresses slowly over years without any thrombus formation", "Chronic venous insufficiency causing pooled blood and stasis in the leg veins", "A congenital valve defect present since birth, unrelated to coronary plaque"], "ans": 0, "exp": "Correct — A: Acute coronary syndromes result from sudden coronary obstruction due to thrombus formation on a ruptured unstable plaque. B describes stable angina's more gradual process, and C and D are unrelated conditions."}, {"q": "Approximately how long does prolonged, unrelieved myocardial ischemia take to cause irreversible cellular death and tissue necrosis?", "opts": ["About 20 minutes", "Immediately, since even seconds of ischemia cause irreversible cell death", "About 72 hours of unrelieved ischemia before any irreversible damage occurs", "Approximately one week of sustained ischemia before necrosis develops"], "ans": 0, "exp": "Correct — A: After about 20 minutes of prolonged, unrelieved myocardial ischemia, irreversible hypoxic injury causes cellular death and tissue necrosis (myocardial infarction). B, C, and D do not match the described timeframe."}, {"q": "Myocardial infarction is clinically classified as STEMI or non-STEMI based on which findings?", "opts": ["Electrocardiographic findings suggesting the extent of myocardial damage (subendocardial vs. transmural)", "Serum glucose levels, which reflect glycemic control rather than the extent of myocardial damage on electrocardiogram", "Patient's age and sex, demographic factors not used for MI subclassification", "ABO blood type, which has no bearing on infarct location or size"], "ans": 0, "exp": "Correct — A: MI is classified as STEMI or non-STEMI based on ECG findings reflecting the extent of myocardial damage — transmural (STEMI) versus subendocardial (non-STEMI). B, C, and D are not the basis for this classification."}, {"q": "Which cardiac biomarker is most predictive of myocardial infarction?", "opts": ["Troponin", "Serum sodium, a marker of fluid balance rather than myocardial injury", "Hemoglobin A1c, which reflects average glycemic control over three months", "Amylase, a pancreatic enzyme marker unrelated to cardiac muscle injury"], "ans": 0, "exp": "Correct — A: Elevations of troponin are most predictive of myocardial infarction and also indicate its severity. B, C, and D are not cardiac-specific biomarkers used to diagnose MI."}, {"q": "Which medication classes are key components of standard myocardial infarction treatment?", "opts": ["Insulin and oral hypoglycemic agents exclusively, with no antithrombotic therapy", "Antihistamines and decongestants aimed at reducing coronary vasospasm", "Antithrombotics, ACE inhibitors, and beta-blockers, alongside revascularization", "Antifungal agents targeted at suspected endocardial fungal vegetations"], "ans": 2, "exp": "Correct — C: MI treatment includes revascularization (thrombolytics or PCI) plus antithrombotics, ACE inhibitors, and beta-blockers, along with pain relief and fluid management. B, A, and D are not standard MI treatments."}, {"q": "Acute pericarditis classically presents with chest pain that is worsened by which factors?", "opts": ["Respiration and lying down", "Eating and drinking, similar to the pain pattern of peptic ulcer disease", "Sleep only, with no change in pain related to posture or breathing", "Standing upright only, with pain relief occurring when lying supine"], "ans": 0, "exp": "Correct — A: Acute pericarditis classically causes sudden severe chest pain that worsens with respiration or lying down (and often improves when sitting up and leaning forward). B, C, and D do not match this classic symptom pattern (D actually reverses the correct positional relationship)."}, {"q": "What is cardiac tamponade, and how does it relate to pericardial effusion?", "opts": ["Cardiac compression that can occur if pericardial fluid accumulates rapidly", "A benign incidental finding on echocardiogram requiring only outpatient monitoring", "A primary ventricular arrhythmia arising independently of pericardial disease", "A slowly progressive condition that develops gradually over many decades"], "ans": 0, "exp": "Correct — A: Cardiac tamponade is compression of the heart that can occur when pericardial effusion (fluid accumulation in the pericardial cavity) develops rapidly, impairing cardiac filling. B, C, and D misstate the urgency, mechanism, or timeline of tamponade."}, {"q": "Constrictive pericarditis impairs cardiac output through which mechanism?", "opts": ["Fibrous scarring/calcification causes the pericardial layers to adhere, encasing the heart in a rigid shell that compresses it", "Acute accumulation of pericardial fluid alone, without any fibrous scarring or calcification of the pericardial layers over time", "Direct bacterial infection of the myocardium causing myocyte necrosis", "Regurgitant backflow through an incompetent atrioventricular valve"], "ans": 0, "exp": "Correct — A: In constrictive pericarditis, fibrous scarring (with occasional calcification) causes pericardial layers to adhere, forming a rigid shell that compresses the heart and reduces cardiac output. B, C, and D do not describe this specific fibrotic mechanism."}, {"q": "The three categories of cardiomyopathy are:", "opts": ["Primary, secondary, and tertiary", "Acute, chronic, and subacute", "Ischemic, valvular, and congenital", "Dilated, hypertrophic, and restrictive"], "ans": 3, "exp": "Correct — D: Cardiomyopathies are categorized as dilated, hypertrophic, and restrictive, based on how chamber size and wall thickness change and alter contractile activity. B, C, and A are not the standard classification used for cardiomyopathies."}, {"q": "Valve stenosis versus regurgitation are defined, respectively, as:", "opts": ["A constricted/narrowed valve versus failure of the valve to shut completely", "A congenital malformation of the valve leaflets versus an acquired inflammatory valve lesion", "Stenosis is excessive valve closure; regurgitation is valve narrowing", "A conduction abnormality versus a structural myocardial abnormality"], "ans": 0, "exp": "Correct — A: Stenosis is a constricted or narrowed valve, while regurgitation is failure of the valve to shut completely, allowing backward flow; either or both can occur in a diseased valve. B, C, and D misstate or reverse these definitions."}, {"q": "What are the three required steps in the pathogenesis of infective endocarditis?", "opts": ["Isolated viral infection of the pericardial sac, without endocardial involvement", "Transient bacteremia alone, without any prior endocardial surface damage", "Endocardial damage, adherence of blood-borne microorganisms to the damaged surface, and formation of infective vegetations", "Complete congenital absence of one or more heart valves at birth"], "ans": 2, "exp": "Correct — C: Infective endocarditis pathogenesis requires (1) endocardial damage, (2) adherence of blood-borne microorganisms to that damaged surface, and (3) formation of infective endocardial vegetations. B, A, and D omit or misstate these required steps."}, {"q": "Rheumatic fever develops through what type of immune process, and what serious complication can result if untreated?", "opts": ["A direct viral infection of the myocardium; leads to acute viral myocarditis", "A delayed immune response to streptococcal infection; can progress to rheumatic heart disease", "An IgE-mediated allergic drug reaction; leads to isolated acute pericarditis", "A direct bacterial toxin effect on the myocardium; leads solely to dilated cardiomyopathy without any valvular involvement"], "ans": 1, "exp": "Correct — B: Rheumatic fever results from a delayed immune response to streptococcal infection, and severe/untreated cases can progress to rheumatic heart disease, a potentially disabling cardiovascular disorder. A, C, and D misstate the immunologic mechanism and consequence."}, {"q": "Most causes of heart failure result from dysfunction of which chamber?", "opts": ["The left ventricle", "The right atrium, from chronic pressure overload and dilation", "The right ventricle exclusively, from primary pulmonary hypertension", "The pulmonary valve, from congenital pulmonic stenosis"], "ans": 0, "exp": "Correct — A: Most heart failure results from left ventricular dysfunction. B, C, and D are not identified as the primary chamber responsible for most heart failure cases."}, {"q": "Heart failure with reduced ejection fraction (systolic HF) is caused by which combination of factors?", "opts": ["Decreased preload alone, from volume depletion without any contractile impairment", "Increased preload, decreased contractility, or increased afterload", "Increased myocardial contractility with normal afterload and preserved filling", "Isolated aortic valve stenosis alone, without any change in ventricular contractility"], "ans": 1, "exp": "Correct — B: Systolic HF (reduced ejection fraction) results from increased preload, decreased contractility, or increased afterload, leading to increased LV end-diastolic volume/pressure and pulmonary congestion. A, C, and D do not match the  the right ventricle to provide adequate flow into the pulmonary circulation — most commonly results from left heart failure or pulmonary disease. B, A, and D are not the primary causes described."}, {"q": "High-output heart failure occurs despite which unusual combination of findings?", "opts": ["Severely reduced circulating blood volume combined with markedly depressed contractility", "Adequate blood volume and normal or elevated myocardial contractility, yet inadequate delivery of nutrients to the body", "Complete cessation of blood flow, as occurs in cardiac arrest", "Only in the setting of fixed valvular stenosis obstructing forward flow"], "ans": 1, "exp": "Correct — B: High-output failure occurs when the heart cannot adequately supply the body with blood-borne nutrients despite having adequate blood volume and normal/elevated contractility (e.g., from conditions with very high metabolic/flow demand). A, C, and D misstate this distinct HF pattern."}, {"q": "Dysrhythmias (arrhythmias) can be categorized into which three groups?", "opts": ["Atrial arrhythmias, ventricular arrhythmias, and sinus node dysfunction/conduction disorders", "Mild, moderate, and severe categories based purely on hemodynamic compromise rather than rhythm origin", "Congenital, acquired, and idiopathic categories based purely on etiology", "Systolic, diastolic, and mixed categories based on the phase of dysfunction"], "ans": 0, "exp": "Correct — A: Dysrhythmias are categorized into atrial arrhythmias, ventricular arrhythmias, and sinus node dysfunction/conduction disorders. B, C, and D are not the classification scheme described for dysrhythmias."}], "clinical": [{"q": "A 65-year-old woman with a history of leg trauma presents with bulging, tortuous veins in her lower leg. Which condition is most likely, and what is the underlying mechanism?", "opts": ["Deep venous thrombosis, from an acquired or inherited hypercoagulable state", "Varicose veins, from damaged valves due to trauma or chronic venous distention", "Superior vena cava syndrome, from external compression of the SVC by bronchogenic cancer", "Raynaud phenomenon, from vasospastic attacks triggered by cold exposure"], "ans": 1, "exp": "Correct — B: Bulging, pooled veins in the leg after trauma describe varicose veins, caused by damaged valves or chronic venous distention. A, C, and D describe different conditions with different mechanisms and presentations."}, {"q": "A 70-year-old man with chronic venous insufficiency develops a non-healing ulcer on his medial ankle. What is the underlying pathophysiology of this ulcer?", "opts": ["Autoimmune vasculitis causing immune-complex deposition in small dermal vessels", "Acute arterial embolism obstructing distal blood flow to the ankle", "Pathologic ischemic changes in the skin/supporting tissue from long-term inadequate venous return, making tissue vulnerable to trauma/infection", "A primary viral skin infection unrelated to venous circulation"], "ans": 2, "exp": "Correct — C: Chronic venous insufficiency causes long-term ischemic tissue changes that predispose to venous stasis ulcers, exactly as described here. B, A, and D describe different mechanisms not linked to chronic venous insufficiency."}, {"q": "A patient recovering from hip surgery develops sudden dyspnea, chest pain, and hypoxia. Which underlying process is most likely, given his recent immobility (a DVT risk factor)?", "opts": ["Raynaud phenomenon triggered by cold exposure in the recovery room", "Primary hypertension unmasked by postoperative pain and stress", "Stable angina from increased myocardial oxygen demand during recovery", "Pulmonary embolism from a dislodged deep venous thrombosis"], "ans": 3, "exp": "Correct — D: Postoperative immobility is a classic DVT risk factor, and sudden dyspnea/chest pain/hypoxia suggests pulmonary embolism, the most serious DVT complication. B, C, and A do not fit this acute presentation or risk factor profile."}, {"q": "A patient with lung cancer ase process", "Secondary hypertension, caused by an underlying disease (renal artery stenosis)", "Orthostatic hypotension, a drop in pressure triggered by standing", "White coat hypertension, elevated readings limited to the clinical setting"], "ans": 1, "exp": "Correct — B: Hypertension caused by an identifiable underlying disease process, such as renal artery stenosis, is secondary hypertension by definition. A applies when no cause is identified, and C and D describe different, unrelated blood pressure phenomena."}, {"q": "A patient presents to the emergency department with a blood pressure of 220/130 mmHg, severe headache, and blurred vision. Which condition is this, and what are potential consequences if untreated?", "opts": ["Varicose veins from saphenous valve incompetence; requires compression stockings", "Orthostatic hypotension from vasodilation upon standing; benign and self-limited", "Stable angina from exertional ischemia; requires only rest to resolve", "Hypertensive crisis; can lead to cardiac failure, stroke, or death"], "ans": 3, "exp": "Correct — D: Severely elevated blood pressure with target-organ symptoms (headache, vision changes) describes a hypertensive crisis, a medical emergency that can progress to cardiac failure, stroke, or death if untreated. B, C, and A describe unrelated, non-emergent conditions."}, {"q": "An elderly patient reports dizziness and brief loss of vision every time she stands up quickly from sitting. What is the most likely mechanism?", "opts": ["A hypertensive crisis triggered by sudden postural changes in blood pressure", "Orthostatic hypotension, from replacement of normal compensatory vasoconstriction with vasodilation and blood pooling in the muscles upon standing", "A pulmonary embolism producing intermittent positional dyspnea", "Cardiac tamponade producing positional hypotension and jugular distention"], "ans": 1, "exp": "Correct — B: Dizziness and visual changes upon standing describe orthostatic hypotension, caused by a failure of the normal compensatory vasoconstriction response, leading to vasodilation and blood pooling. A, C, and D do not match this positional symptom pattern."}, {"q": "A 68-year-old man with long-standing untreated hypertension is found on imaging to have a localized dilation of the abdominal aorta. Which condition is this, and why is the aorta particularly susceptible?", "opts": ["Abdominal aortic aneurysm; the aorta is a vessel particularly prone to this localized wall dilation", "Deep venous thrombosis; the femoral vein is prone to localized wall dilation", "Coronary artery disease; the coronary arteries are prone to aneurysmal dilation from atherosclerosis", "Dilated cardiomyopathy; the left ventricular wall is prone to progressive dilation"], "ans": 0, "exp": "Correct — A: A localized dilation of the aorta describes an aneurysm, and the aorta is specifically noted as particularly susceptible to this condition, especially with chronic hypertension as a contributing factor. B, C, and D describe different vessels/structures not specifically highlighted as aneurysm-prone in this context."}, {"q": "A 58-year-old smoker with known atherosclerosis develops sudden severe pain, pallor, and pulselessness in the left leg. Which process is most likely responsible?", "opts": ["Rheumatic fever causing migratory polyarthritis and carditis", "Chronic venous insufficiency causing dependent edema and skin changes", "Raynaud phenomenon causing episodic digital color changes with cold exposure", "An arterial thromboembolus occluding blood flow to the leg"], "ans": 3, "exp": "Correct — D: Sudden pain, pallor, and pulselessness in a limb describe acute arterial occlusion from a thrombus or embolus (commonly from the left heart or a ruptured plaque), causing ischemia. B, C, and A do not present with this acute, pulseless picture."}, {"q": "A 45-year-old heavy smoker develops painful, inflamed thrombosed segments in the arteries of his feet, with biopsy showing inflammatory/immune cell infiltration. Which condition is this?", "opts": ["Rheumatic heart disease, a valvular sequela of untreated streptococcal infection", "Raynaud phenomenon, a vasospastic condition triggered by cold or stress", "Atherosclerosis, a chronic inflammatory process driven by lipid deposition", "Thromboangiitis obliterans, strongly associated with smoking"], "ans": 3, "exp": "Correct — D: Inflammatory, immune-cell-filled thrombi in peripheral arteries strongly associated with smoking describe thromboangiitis obliterans (Buerger disease). B, C, and A describe different peripheral vascular conditions with different mechanisms/associations."}, {"q": "A young woman notices her fingers turn white, then blue, then red when exposed to cold air, along with pain and numbness. Which condition is most likely, and what triggers it?", "opts": ["Deep venous thrombosis; triggered by prolonged immobility and venous stasis in the legs", "Thromboangiitis obliterans; triggered exclusively by chronic tobacco use", "Raynaud phenomenon; triggered by cold exposure, vibration, or emotional stress", "Cardiac tamponade; triggered by rapid pericardial fluid accumulation"], "ans": 2, "exp": "Correct — C: Color-changing vasospastic attacks in the fingers triggered by cold, vibration, or stress describe Raynaud phenomenon. B, A, and D describe different conditions with different triggers and presentations."}, {"q": "A 60-year-old man with hyperlipidemia, hypertension, and a 40-pack-year smoking history develops exertional chest pain that resolves with rest. Coronary angiography shows partial stenosis without acute thrombus. Which diagnosis fits, and what is the underlying mechanism?", "opts": ["Silent ischemia, since ECG changes without symptoms indicate infarction risk", "Prinzmetal angina, from coronary vasospasm occurring unpredictably at rest", "Myocardial infarction, from complete thrombotic occlusion causing tissue necrosis", "Stable angina, from myocardial ischemia when oxygen demand (exertion) exceeds supply through a fixed atherosclerotic stenosis"], "ans": 3, "exp": "Correct — D: Predictable, exertional chest pain relieved by rest, with fixed (not acutely thrombosed) stenosis, is classic stable angina from a supply-demand mismatch during exertion. B occurs unpredictably/at rest from vasospasm, C requires thrombotic occlusion with infarction, and A by definition has no symptoms."}, {"q": "A 50-year-old woman has recurrent episodes of chest pain at rest, unrelated to exertion, with transient ST-segment elevation on ECG during episodes that resolves between attacks. Angiography shows no significant fixed stenosis. Which diagnosis is most likely?", "opts": ["Stable angina, from fixed atherosclerotic narrowing triggered by exertion", "Prinzmetal (variant) angina, from coronary artery vasospasm", "ST-elevation myocardial infarction, from persistent thrombotic occlusion", "Chronic venous insufficiency, from long-standing venous valve incompetence"], "ans": 1, "exp": "Correct — B: Unpredictable rest-pain with transient ST changes and no significant fixed stenosis describes Prinzmetal angina, caused by coronary vasospasm rather than fixed atherosclerotic obstruction. A requires exertional triggering and fixed stenosis, C requires persistent (not transient) ECG changes with tissue damage, and D is an unrelated venous condition."}, {"q": "A 55-year-old man has a routine stress test that reveals ECG changes consistent with ischemia, but he reports no chest pain or symptoms during the test. What is the clinical significance of this finding?", "opts": ["This finding is a benign age-related ECG variant unrelated to coronary disease", "This is a normal stress test finding requiring no further cardiac evaluation", "This indicates a false-positive result, ruling out coronary artery disease", "Silent ischemia is present, which is an indicator of future serious cardiovascular events despite the absence of symptoms"], "ans": 3, "exp": "Correct — D: Asymptomatic ischemic ECG changes describe silent ischemia, which — despite the lack of symptoms — is a recognized indicator of future serious cardiovascular events and warrants further evaluation/management. B, C, and A understate or dismiss this significant finding."}, {"q": "A 62-year-old man presents with crescendo chest pain at rest, and troponin is mildly elevated with no ST elevation on ECG. Which acute coronary syndrome is most likely, and what is the underlying event?", "opts": ["Unstable angina, since by definition no myocardial necrosis or troponin release occurs", "Stable angina, from a fixed stenosis triggered predictably by exertion", "Non-ST-elevation myocardial infarction (NSTEMI), from rupture of an unstable plaque with subendocardial ischemic damage", "Prinzmetal angina, from pure coronary vasospasm without any plaque rupture"], "ans": 2, "exp": "Correct — C: Rest pain with elevated troponin (indicating some myocardial necrosis) but no ST elevation describes NSTEMI, resulting from unstable plaque rupture causing subendocardial (not transmural) damage. B does not fit the rest-pain/troponin-elevation pattern, A incorrectly states troponin is never elevated in unstable angina's related spectrum, and D does not typically cause troponin elevation without plaque involvement."}, {"q": "A patient with acute chest pain has ST-segment elevation on ECG and markedly elevated troponin. Approximately how long can unrelieved ischemia persist before irreversible myocardial cell death begins, and what does this mean for treatment urgency?", "opts": ["About 20 minutes; time-sensitive revascularization is critical to limit tissue necrosis", "About 24 hours; revascularization timing has no bearing on infarct size", "About one week; treatment can safely be delayed without added tissue loss", "There is no time-dependent relationship between the duration of ischemia and the extent of necrosis"], "ans": 0, "exp": "Correct — A: Since irreversible hypoxic injury and cell death begin a
