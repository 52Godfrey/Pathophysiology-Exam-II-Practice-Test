<script>
const CHAPTERS = [{"title": "Structure and Function of the Reproductive Systems", "code": "Chapter 24", "color": "c8", "subtitle": "Development • Female & Male Reproductive Anatomy/Physiology • Breast • Tests of Reproductive Function • Aging", "general": [{"q": "Differentiation of male genitalia begins around 7 to 8 weeks of embryonic development under the influence of which factor?", "opts": ["Estrogen secretion by the fetal ovaries acting on the developing genital ridge", "Maternal progesterone crossing the placenta to support endometrial receptivity", "Follicle-stimulating hormone released from the immature fetal anterior pituitary", "SRY gene expression and testosterone-determining factor (TDF)"], "ans": 3, "exp": "Correct — D: Male genital differentiation begins when SRY gene expression and testosterone-determining factor (TDF) direct the gonads of genetically male embryos to secrete testosterone. A is wrong because female development occurs in the absence of SRY, not because of estrogen secretion driving male differentiation. C and B are wrong because fetal pituitary FSH and maternal progesterone are not the trigger for this early sex differentiation — it is gonadal/genetic (SRY/TDF), not pituitary or maternal hormonal."}, {"q": "Which statement correctly contrasts female and male gamete production?", "opts": ["Both sexes generate a fresh, unlimited supply of gametes continuously starting at puberty and lasting throughout the entirety of adulthood", "Ova are generated continuously throughout adult life while sperm are formed exclusively during fetal gonadal development", "Female gametes (ova) are produced solely during fetal life; male gametes (sperm) begin production at puberty and continue daily for life", "Neither ova nor sperm are produced until the onset of menopause or andropause, respectively, in each sex"], "ans": 2, "exp": "Correct — C: Primitive ova are produced solely during fetal life (with one maturing per cycle from puberty to menopause), while sperm production begins at puberty and continues daily, usually for life. A is wrong because ova are not produced continuously after birth. B reverses the correct pattern. D is wrong because ova are in fact produced prenatally."}, {"q": "Which set of hormones/glands make up the axis responsible for pubertal sexual maturation?", "opts": ["Cerebellum, thymus, and gonads acting together to coordinate motor and immune maturation", "Hypothalamus, adrenal cortex, and thyroid gland regulating cortisol and metabolic rate", "Posterior pituitary, kidneys, and adrenal medulla regulating fluid balance and catecholamines", "Hypothalamus – anterior pituitary – gonads (hypothalamic-pituitary-gonadal axis)"], "ans": 3, "exp": "Correct — D: Reproductive structure and function depend on the hypothalamic-pituitary-gonadal axis (hypothalamus, anterior pituitary, and gonads). B, C, and A name glands not central to this specific axis (adrenal cortex/thyroid, posterior pituitary/kidneys/adrenal medulla, and cerebellum/thymus are not part of the HPG axis)."}, {"q": "Approximately one year before puberty, which hormones begin stimulating the gonads to mature?", "opts": ["Prolactin and oxytocin, hormones primarily governing lactation and milk ejection", "GnRH, FSH, and LH", "Insulin and cortisol, hormones primarily involved in glucose regulation and stress response", "Calcitonin and parathyroid hormone, which regulate serum calcium rather than gonadal maturation"], "ans": 1, "exp": "Correct — B: GnRH from the hypothalamus stimulates pituitary FSH and LH release, which stimulate the gonads to secrete sex hormones, initiating the prepubertal cascade. A, C, and D name hormones involved in lactation, metabolism/stress, and calcium regulation respectively — none of which initiate gonadal maturation."}, {"q": "Puberty is considered biologically complete in females and males, respectively, with which two milestones?", "opts": ["The first menstrual period (menarche) and the first nocturnal emission, regardless of ovulation or sperm maturity", "Breast budding (thelarche) and testicular enlargement, which mark the onset rather than completion of puberty", "The first ovulatory menstrual period and the first ejaculation containing mature sperm", "Adrenarche occurring simultaneously in both sexes as the defining endpoint of puberty"], "ans": 2, "exp": "Correct — C: Puberty is complete in females with the first ovulatory menstrual period and in males with the first ejaculation containing mature sperm — the functional markers of reproductive capability. A, B, and D describe earlier pubertal milestones (menarche without confirmed ovulation, early breast/testicular changes, and adrenal androgen onset) rather than the completion point."}, {"q": "Which structures make up the internal female genitalia?", "opts": ["Mons pubis, labia majora, labia minora, and clitoris, which make up the external genitalia", "Vagina, uterus, fallopian tubes, and ovaries", "Bartholin and Skene glands alone, which provide lubrication but are not the primary internal organs", "The perineum and vestibule alone, which are external structures surrounding the vaginal opening"], "ans": 1, "exp": "Correct — B: The internal female genitalia are the vagina, uterus, fallopian tubes, and ovaries. A, C, and D all list external genital structures (mons pubis/labia/clitoris, glands, and perineum/vestibule), not internal organs."}, {"q": "Why are the ovaries considered the most essential of the internal female genitalia?", "opts": ["They are simply the largest organs within the bony pelvic cavity", "They serve mainly as the exit route through which menstrual fluid passes", "They produce the female gametes and female sex hormones", "They function primarily as the structure that receives the penis during intercourse"], "ans": 2, "exp": "Correct — C: The ovaries are most essential because they produce ova and female sex hormones (estrogen, progesterone, androgens). A is not a physiologic rationale (size is not the reason). B describes the vagina's function. D also describes the vagina, not the ovaries."}, {"q": "The three uterine wall layers, from innermost to outermost, are:", "opts": ["Myometrium, endometrium, perimetrium, listing the muscular layer as the innermost lining", "Endometrium, perimetrium, myometrium, placing the outer serosal layer in the middle position", "Perimetrium, endometrium, myometrium, placing the outer serosal covering as the innermost layer", "Endometrium, myometrium, perimetrium"], "ans": 3, "exp": "Correct — D: From innermost to outermost, the uterine wall layers are the endometrium (lining), myometrium (muscle), and perimetrium (outer covering continuous with the pelvic peritoneum). The other options place these layers in the wrong order."}, {"q": "Where does fertilization normally occur?", "opts": ["In the uterine cavity, immediately after the fertilized ovum implants into the endometrium", "In the vagina, where sperm are deposited during ejaculation", "In the cervix, where cervical mucus first filters incoming sperm", "In the distal third of the fallopian tube"], "ans": 3, "exp": "Correct — D: Fertilization normally occurs in the distal third (ampulla) of the fallopian tube, after the tube directs the ovum from the ovary toward the uterus. A, C, and B are downstream/unrelated sites where fertilization does not normally take place."}, {"q": "Which structure produces progesterone after ovulation?", "opts": ["The ovarian follicle, prior to ovulation, while estrogen levels are still rising", "The endometrium, through direct glandular secretion independent of ovarian hormones", "The corpus luteum", "The fallopian tube, via secretory cells lining the ampulla"], "ans": 2, "exp": "Correct — C: Progesterone is produced by the corpus luteum, which develops from the ruptured follicle after ovulation. A is wrong because the follicle (before rupture) produces mainly estrogen. B and D do not produce progesterone; the endometrium responds to it and the tube only transports the ovum."}, {"q": "Which menstrual cycle phase involves LH-stimulated secretion of progesterone and estrogen by the corpus luteum, with glands secreting a thin, glycogen-containing fluid?", "opts": ["Follicular/proliferative phase, when rising estrogen stimulates endometrial thickening", "Ovulatory phase, when the LH surge triggers release of the mature ovum from the follicle", "Ischemic/menstrual phase, when falling hormone levels cause the endometrium to shed", "Luteal/secretory phase"], "ans": 3, "exp": "Correct — D: During the luteal/secretory phase, LH stimulates the corpus luteum to secrete progesterone and estrogen, and endometrial glands secrete glycogen-containing fluid (hence \"secretory\"). A describes the pre-ovulation follicle-maturation phase; C describes the phase of hormone withdrawal and endometrial shedding; \"ovulatory phase\" (B) is the brief LH-surge event, not this multi-day secretory phase."}, {"q": "What triggers menstruation during the ischemic/menstrual phase?", "opts": ["A surge of luteinizing hormone from the anterior pituitary that triggers release of the ovum", "A continued rise in estrogen from a persistently active corpus luteum maintaining the endometrium", "A sharp drop in progesterone and estrogen as the corpus luteum degenerates, causing the endometrium to become ischemic and shed", "Successful fertilization of the ovum by sperm within the ampulla of the fallopian tube"], "ans": 2, "exp": "Correct — C: As the corpus luteum degenerates, progesterone and estrogen drop sharply; the \"starved,\" ischemic endometrium degenerates and sheds as menstrual flow. A describes the ovulation trigger (mid-cycle, not menstruation). B is the opposite of what happens (estrogen falls, not rises). D would prevent menstruation by supporting the corpus luteum via hCG, not cause it."}, {"q": "What is the basic functional unit of the female breast?", "opts": ["The acinus alone, without any associated ductal branching network", "The areola, the pigmented skin surrounding the nipple", "The lobe (a system of ducts branching from the nipple to lobules)", "Cooper ligaments, the fibrous bands that provide structural suspension of the breast"], "ans": 2, "exp": "Correct — C: The lobe — a system of ducts branching from the nipple to milk-producing lobules — is the basic functional unit of the breast; each breast has 15-20 lobes. A (acini are the milk-producing cells within lobules, not the whole functional unit), B (areola is skin pigmentation around the nipple), and D (Cooper ligaments merely provide structural support) are components, not the basic functional unit."}, {"q": "Which hormone is primarily responsible for milk production, and which for milk ejection?", "opts": ["Estrogen for production; progesterone for ejection, mirroring their roles in the menstrual cycle", "Prolactin for production; oxytocin for ejection", "Oxytocin for production; prolactin for ejection, the reverse of their actual physiologic roles", "FSH for production; LH for ejection, hormones that instead regulate ovarian follicle development"], "ans": 1, "exp": "Correct — B: Prolactin (elevated after childbirth) drives milk production, while oxytocin controls milk ejection (let-down). A and C mismatch or reverse these roles. D names gonadotropins that regulate ovulation, not lactation."}, {"q": "Why does the male breast not develop like the female breast at puberty?", "opts": ["Males completely lack any glandular breast tissue from birth onward", "Insufficient estrogen and progesterone, with antagonistic effects of androgens", "Males lack prolactin receptors entirely, preventing any ductal or lobular development", "Testosterone directly and permanently destroys existing breast ductal tissue at puberty"], "ans": 1, "exp": "Correct — B: The male breast does not develop because of insufficiently high estrogen/progesterone levels and the antagonistic effect of androgens. A is factually wrong (males do have rudimentary breast tissue). C and D are not the textbook mechanism described."}, {"q": "What are the two functions of the testes?", "opts": ["Urine storage and transport of urine toward the external urethral meatus", "Storage of mature semen and coordination of the ejaculatory reflex", "Storage of maturing sperm and generation of the erectile response", "Spermatogenesis and production of androgens (chiefly testosterone)"], "ans": 3, "exp": "Correct — D: The testes have two functions — spermatogenesis (sperm production) and production of male sex hormones (androgens, chiefly testosterone). A, C, and B describe functions of the bladder/urethra, epididymis, and penis/ejaculatory pathway respectively, not the testes themselves."}, {"q": "Which structure receives sperm from the testis and stores them while they mature further?", "opts": ["Vas deferens, the muscular duct that propels sperm toward the ejaculatory duct", "Seminal vesicle, which contributes fructose-rich fluid to the ejaculate", "Epididymis", "Prostate gland, which adds an alkaline, protective fluid to semen"], "ans": 2, "exp": "Correct — C: The epididymis, a long coiled tube over the testis, receives sperm from the testis and stores them during further maturation before they are ejaculated into the vas deferens. A only transports (already-stored) sperm onward; B and D contribute seminal fluid but do not store/mature sperm."}, {"q": "Why is the scrotum positioned outside the body cavity?", "opts": ["To protect the testes from blunt trauma and infection, which is its sole physiologic purpose", "To facilitate erection by providing additional erectile tissue volume", "To allow for easier visual and manual inspection during cancer screening exams", "To keep the testes about 1-2°C cooler than core body temperature, optimal for sperm survival"], "ans": 3, "exp": "Correct — D: The scrotum keeps the testes 1-2°C below body temperature (via contracting in cold, relaxing in warmth), which is optimal for sperm survival/spermatogenesis. A, C, and B are not the primary physiologic rationale given in the text."}, {"q": "Which two erectile compartments, along with the urethra-containing corpus spongiosum, make up the penis?", "opts": ["Two corpora spongiosa surrounding a single central corpus cavernosum", "Two corpora cavernosa", "One corpus cavernosum paired with one epididymis along the shaft", "Two vas deferens running parallel along the dorsal surface of the penis"], "ans": 1, "exp": "Correct — B: The penis consists of two corpora cavernosa plus one corpus spongiosum (which contains the urethra) — three longitudinal erectile compartments total. A incorrectly doubles the spongiosum instead of the cavernosa. C and D name structures (epididymis, vas deferens) that are not part of the penile shaft itself."}, {"q": "The erectile reflex is triggered by which type of nerve stimulation?", "opts": ["Sympathetic nerve stimulation causing arteriolar vasoconstriction and detumescence", "Vagal stimulation of the heart producing a reflexive drop in systemic blood pressure and heart rate", "Somatic motor stimulation of skeletal muscle within the pelvic floor alone", "Parasympathetic nerve stimulation causing arteriolar dilation and blood filling of the corpora"], "ans": 3, "exp": "Correct — D: Tactile or psychogenic stimulation of parasympathetic nerves dilates the arterioles of the corpora cavernosa/spongiosum, filling them with blood to produce erection. A describes the opposite (sympathetic tone promotes detumescence, not erection). C and B describe unrelated neural pathways."}, {"q": "What is the difference between emission and ejaculation?", "opts": ["They are identical physiologic events that simply carry two interchangeable clinical names", "Emission refers exclusively to vaginal lubrication occurring during female sexual arousal", "Emission is the pulsatile expulsion phase that always follows ejaculation has occurred", "Emission is movement of semen from the epididymides to the penis at peak arousal; ejaculation is the pulsatile ejection of semen from the penis"], "ans": 3, "exp": "Correct — D: Emission is the movement of semen from the epididymides into the penile urethra at peak sexual arousal; ejaculation is the subsequent pulsatile expulsion of that semen from the penis. A collapses two distinct sequential events into one. C reverses the correct order. B is incorrect; emission is a male reproductive event."}, {"q": "Where does spermatogenesis take place, and what is its key structural feature?", "opts": ["In the prostate gland; it follows a cyclic, roughly monthly hormonal pattern", "In the seminiferous tubules of the testes; it is a continuous process via ongoing mitosis of spermatogonia", "In the epididymis; it occurs independent of hormones and depends solely on ambient external scrotal temperature", "In the vas deferens; it is triggered only transiently at the moment of ejaculation"], "ans": 1, "exp": "Correct — B: Spermatogenesis occurs continuously within the seminiferous tubules of the testes, driven by ongoing mitosis of spermatogonia (which mature through spermatocyte and spermatid stages with Sertoli cell support). A incorrectly places it in the prostate and calls it cyclic (male hormone production is steady, not cyclic, and this refers to the prostate, not sperm production). C and D misplace the process to the epididymis or vas deferens, which store/transport rather than produce sperm."}, {"q": "What is perimenopause, and what hormonal pattern characterizes it?", "opts": ["The 12 consecutive months following the final menstrual period, marked by low, stable estrogen", "A clinical term used to describe androgen decline during male reproductive aging", "A surgical procedure performed to intentionally induce early menopause", "The transitional period before menopause, with erratic and high levels of estrogen contributing to hot flashes, breast tenderness, and irregular cycles"], "ans": 3, "exp": "Correct — D: Perimenopause is the transition before menopause during which the ovaries produce erratic, often high, estrogen levels, contributing to hot flashes, breast tenderness/nodularity, migraines, and increasingly irregular (anovulatory) cycles. A describes a post-menopausal, not peri-menopausal, hormonal state. C is not accurate (perimenopause is a natural transition, not a procedure). B describes andropause, not perimenopause."}, {"q": "Which term describes the age-related decline in androgen levels in aging males?", "opts": ["Andropause", "Perimenopause, the erratic hormonal transition preceding cessation of menses in women", "Menopause, the permanent cessation of ovarian function and menstruation in women", "Amenorrhea, the absence of menstrual periods in a woman of reproductive age"], "ans": 0, "exp": "Correct — A: Andropause is the term for androgen (testosterone) deficiency in the aging male, distinct from the female-specific terms menopause (C), perimenopause (B), and amenorrhea (D, absence of menstruation)."}], "clinical": [{"q": "A 14-year-old genetic male has ambiguous genitalia at birth. Prenatal testing later reveals a mutation impairing SRY gene function. What would the nurse expect regarding gonadal development?", "opts": ["Normal male gonadal development would proceed, since testosterone alone can drive differentiation entirely independent of SRY", "Female-pattern gonadal development would tend to occur, since male differentiation depends on SRY gene expression and TDF", "No gonadal tissue would form at all, leaving the embryo without ovaries or testes", "Both ovarian and testicular tissue would fully develop side by side within the same gonad"], "ans": 1, "exp": "Correct — B: Since SRY expression and TDF are what drive male gonadal differentiation, impaired SRY function would be expected to shift development toward the default female pattern, which occurs in the absence of SRY signaling. A is incorrect because testosterone secretion itself depends on SRY/TDF-driven gonadal differentiation occurring first. C is incorrect since primitive gonadal tissue is still present (just following a different developmental path). D describes true ovotesticular conditions, which is not the expected consequence of isolated SRY dysfunction."}, {"q": "A 30-year-old woman is undergoing fertility evaluation on cycle day 21 (mid-luteal phase). Which hormonal pattern would the nurse expect if ovulation occurred normally?", "opts": ["A sustained luteinizing hormone surge persisting throughout the entire luteal phase", "Elevated follicle-stimulating hormone with an absence of any detectable progesterone", "Undetectable levels of both estrogen and progesterone throughout the luteal phase", "Elevated progesterone from an active corpus luteum"], "ans": 3, "exp": "Correct — D: In the mid-luteal phase after normal ovulation, the corpus luteum secretes progesterone (and estrogen), so mid-luteal progesterone is used clinically to confirm ovulation occurred. B is wrong because FSH is not the luteal-phase marker of ovulation. C is wrong because both hormones should be present, not undetectable. A is wrong because the LH surge is a brief, mid-cycle event that triggers ovulation, not a sustained luteal-phase pattern."}, {"q": "A new mother reports her milk is not being released even though it is being produced. Which hormonal pathway is most likely impaired?", "opts": ["Prolactin secretion from the anterior pituitary, which governs milk synthesis, not release", "Estrogen production from the ovaries, which primarily prepares breast ducts before pregnancy", "Oxytocin-mediated milk ejection reflex", "Follicle-stimulating hormone secretion, which regulates ovarian follicle development"], "ans": 2, "exp": "Correct — C: Since milk is being produced (implying adequate prolactin), the impaired milk ejection (\"let-down\") reflex points to oxytocin, the hormone responsible for milk ejection. A is unlikely to be the primary issue if milk production itself is intact. B and D (estrogen, FSH) are not primarily responsible for the milk ejection reflex."}, {"q": "A 55-year-old man reports gradually decreasing energy, some loss of muscle mass, and mild erectile difficulty, with labs showing a low-normal testosterone level. Which age-related process is most consistent with this presentation?", "opts": ["Andropause", "Menopause, the permanent cessation of ovarian function marked by amenorrhea", "Perimenopause, the erratic hormonal transition that precedes menopause in women", "Primary hypogonadism resulting from acute testicular torsion"], "ans": 0, "exp": "Correct — A: Gradual testosterone decline with muscle mass loss and erectile changes in an aging male is consistent with andropause, the male analog of age-related hormonal decline. B and C are female-specific terms and do not apply. D describes an acute surgical emergency, not a gradual age-related hormonal process."}, {"q": "A couple is undergoing an infertility workup. The male partner's semen analysis is normal. Which additional evaluation would most directly assess whether the female partner is ovulating normally?", "opts": ["Serum progesterone drawn in the mid-luteal phase", "A fasting blood glucose level to screen for undiagnosed diabetes mellitus", "A chest x-ray to evaluate for an unrelated pulmonary process", "Serum sodium and potassium levels to assess electrolyte balance"], "ans": 0, "exp": "Correct — A: A mid-luteal serum progesterone level is a standard way to confirm that ovulation has occurred, since progesterone rises only after a functional corpus luteum forms. B, C, and D are not tests used to evaluate ovulatory status."}, {"q": "A term newborn male has a scrotal temperature measured equal to core body temperature due to a scrotal developmental anomaly. What potential consequence should the nurse anticipate?", "opts": ["Improved fertility, since a warmer scrotal environment enhances sperm motility and count", "No measurable effect, since scrotal temperature is irrelevant to spermatogenesis", "Impaired spermatogenesis, since normal sperm production requires a scrotal temperature about 1-2°C below core body temperature", "Increased testosterone production only, with spermatogenesis remaining entirely unaffected"], "ans": 2, "exp": "Correct — C: Because spermatogenesis requires the scrotum to maintain a temperature roughly 1-2°B below core body temperature, a scrotum unable to achieve this cooling would be expected to impair sperm production (as seen clinically in cryptorchidism). A, B, and D are inconsistent with this established temperature-dependence of spermatogenesis."}, {"q": "A 46-year-old woman reports irregular, sometimes heavier menstrual cycles along with new hot flashes and breast tenderness. Menstrual periods have not yet stopped. Which stage is she most likely in?", "opts": ["Menopause, defined by 12 consecutive months without any menstrual bleeding", "Perimenopause", "Andropause, the gradual age-related decline of androgens seen in aging men", "Adolescence, the developmental stage marked by the onset rather than cessation of cycles"], "ans": 1, "exp": "Correct — B: Irregular cycles, hot flashes, and breast tenderness/nodularity while periods are still occurring (not yet 12 months of amenorrhea) describe perimenopause, driven by erratic, often elevated, estrogen levels. A requires 12 consecutive months of amenorrhea, which has not yet occurred here. C is a male-specific term. D describes an earlier life stage, inconsistent with this presentation."}, {"q": "A clinician is evaluating a couple for infertility and orders semen analysis and hormone assays in the male partner, along with menstrual history and ovulation testing in the female partner. What is the primary purpose of these diagnostic tests?", "opts": ["To evaluate fertility by assessing hormone status, structural integrity, and normal gamete production/release in both partners", "To diagnose sexually transmitted infections exclusively in both partners", "To assess unrelated cardiovascular risk factors such as lipid panels", "To rule out an existing pregnancy prior to further testing"], "ans": 0, "exp": "Correct — A: Reproductive diagnostic testing evaluates fertility through hormone assays, structural assessment, and confirmation of normal ovulation or adequate sperm motility/count in both partners, per the summary review. B, C, and D are not the stated purposes of these fertility-focused tests."}, {"q": "A mother who delivered 3 months ago and is exclusively breastfeeding asks why she has not resumed menstrual periods. What is the most likely physiologic explanation?", "opts": ["Her ovaries have permanently and irreversibly stopped functioning after delivery", "Elevated prolactin from breastfeeding suppresses the hypothalamic-pituitary-gonadal axis, delaying ovulation and menses", "This finding always indicates a pathologic prolactin-secreting pituitary tumor", "Breastfeeding has no physiologic effect on the menstrual cycle or ovulation"], "ans": 1, "exp": "Correct — B: Elevated prolactin during lactation suppresses GnRH/FSH/LH secretion, which delays the return of ovulation and menstruation — a normal, expected physiologic effect of breastfeeding, not a pathologic one. A, C, and D misrepresent this as permanent, always pathologic, or having no hormonal basis, respectively."}, {"q": "A 15-year-old boy has not yet had his growth spurt but is otherwise healthy, with no signs of illness. His father also matured later than peers. According to the summary review, when does the male growth spurt/delayed puberty typically occur, and how should the nurse counsel this family?", "opts": ["Male puberty must always begin with a growth spurt before age 9 to be considered normal", "This presentation is always pathologic and requires immediate hormonal replacement therapy regardless of family history", "Male puberty growth spurt occurring at 15-17 years is a normal variant that seldom requires treatment", "This finding is consistent with precocious puberty and warrants urgent endocrine referral"], "ans": 2, "exp": "Correct — C: The reproductive summary notes that a male growth spurt occurring later, around 15-17 years, is considered delayed puberty that seldom requires treatment, especially with a familial pattern. B overstates the need for intervention. A describes precocious (early), not delayed, puberty. D is the opposite of what is described (early rather than late onset)."}, {"q": "A 32-year-old woman has regular ovulatory cycles confirmed by home ovulation kits and normal hormone levels, but has not conceived after 18 months of unprotected intercourse. Her partner's semen analysis is normal. Which additional structural evaluation would be most important next?", "opts": ["A repeat semen analysis only, since male factors remain the most likely explanation", "Assessment of fallopian tube patency, since tubal blockage is one of the most common causes of infertility", "Thyroid function tests exclusively, since thyroid disease is considered the leading cause of female infertility", "No further diagnostic workup, since confirmed ovulation excludes all other causes"], "ans": 1, "exp": "Correct — B: With ovulation and semen parameters both confirmed normal, evaluating fallopian tube patency is a logical next step, since tubal blockage (along with ovulation disorders) is one of the most common infertility pathologies. A is redundant given a normal result already obtained. C is not indicated without symptoms suggesting thyroid dysfunction. D is incorrect since infertility persists despite normal ovulation, warranting further evaluation."}, {"q": "A mother asks why her daughter's breasts feel different (more nodular and tender) in the days before her period. How should the nurse explain this?", "opts": ["Breast tissue undergoes normal cyclic changes in response to the hormonal fluctuations of the menstrual cycle", "This is abnormal and requires immediate diagnostic imaging to rule out malignancy", "This pattern occurs only in women who are taking combined hormonal contraceptives", "This finding is a classic early sign of breast cancer and should be treated urgently"], "ans": 0, "exp": "Correct — A: Breast tissue normally undergoes cyclic changes (tenderness, nodularity) in response to the hormonal fluctuations of the menstrual cycle, particularly in the luteal phase. B and D incorrectly pathologize a normal physiologic finding. C is incorrect since this cyclic change occurs with natural menstrual cycles, not only with contraceptive use."}, {"q": "A 68-year-old man reports gradually worsening erectile function over several years but has maintained the ability to father children into his 50s. Which statement best reflects male reproductive aging as described in the summary review?", "opts": ["Males typically lose all reproductive capacity abruptly at a defined age, similar to menopause", "Aging produces no measurable physiologic effect on male reproductive function whatsoever", "Erectile dysfunction in aging men is always caused solely by low testosterone levels", "Males generally maintain reproductive capacity into later years, though gradual changes such as testosterone deficiency, hypogonadism, and erectile dysfunction can occur"], "ans": 3, "exp": "Correct — D: The summary review states that males maintain reproductive capacity into later years, with gradual age-related changes such as testosterone deficiency, hypogonadism, prostate disorders, erectile dysfunction, and some loss of muscle mass/strength (andropause) — rather than an abrupt cessation like menopause. A incorrectly applies the female pattern to males. C oversimplifies erectile dysfunction to a single cause. B contradicts the described age-related changes."}]}, {"title": "Alterations of the Female Reproductive System", "code": "Chapter 25", "color": "c9", "subtitle": "Sexual Maturation • Menstrual/Hormonal Disorders • Infections • Structural & Proliferative Disorders • Cancers • Breast Disorders", "general": [{"q": "What is the normal age range for the onset of puberty, and what defines precocious puberty?", "opts": ["Normal onset is 13 to 18 years; precocious puberty is defined as onset after age 18", "Normal onset is 5 to 8 years; precocious puberty is defined as onset after age 13", "Normal onset is 8 to 13 years; precocious puberty is onset before this range", "There is no defined normal range, since pubertal timing varies randomly across populations"], "ans": 2, "exp": "Correct — C: The normal range for pubertal onset is 8 to 13 years (varying by geography/ethnicity); precocious puberty is onset before this range, while delayed puberty is onset after it. B, A, and D misstate or deny the defined normal range."}, {"q": "What is the underlying mechanism of primary dysmenorrhea?", "opts": ["Endometriosis causing chronic pelvic adhesions and structural distortion of the pelvic reproductive organs", "Uterine fibroids mechanically obstructing the outflow of menstrual blood", "Excessive synthesis of PGF2α causing myometrial contraction and vasoconstriction, producing ischemic pain", "Ascending pelvic inflammatory disease causing tubal and peritoneal inflammation"], "ans": 2, "exp": "Correct — C: Primary dysmenorrhea (pain without underlying pelvic disease) results from excessive PGF2α (prostaglandin) synthesis, which causes myometrial contraction and blood vessel constriction, producing ischemic pain. A, B, and D are causes of secondary dysmenorrhea, which by definition results from identifiable pelvic disease."}, {"q": "Which of the following would be classified as a cause of secondary, not primary, dysmenorrhea?", "opts": ["Endometriosis, pelvic adhesions, uterine fibroids, or adenomyosis", "Excess prostaglandin (PGF2α) synthesis alone, without any underlying structural disease", "Normal myometrial contraction occurring in the complete absence of any pathology", "No identifiable disease process, representing purely idiopathic primary pain"], "ans": 0, "exp": "Correct — A: Secondary dysmenorrhea results from identifiable pelvic disease such as endometriosis, adhesions, fibroids, or adenomyosis. B, C, and D describe the mechanism/absence of disease characteristic of primary dysmenorrhea instead."}, {"q": "Primary amenorrhea is defined as the absence of menarche by which age criteria?", "opts": ["Any single absence of a menstrual period for one cycle in an otherwise normal adolescent", "By age 10 regardless of whether secondary sex characteristics have developed", "By age 18 in all cases, regardless of secondary sexual development", "By age 13 without secondary sex characteristics, or by age 15 if secondary sex characteristics have developed"], "ans": 3, "exp": "Correct — D: Primary amenorrhea is defined as absent menarche by age 13 without secondary sex characteristics, or by age 15 if secondary sex characteristics have appeared. B, C, and A do not match this specific dual age criterion."}, {"q": "Secondary amenorrhea is defined as absence of menstruation for what duration in a previously menstruating woman?", "opts": ["A single missed menstrual cycle in a woman with previously regular periods", "Six consecutive months of amenorrhea regardless of her usual cycle length", "A time equivalent to three or more previous cycles", "Any noticeable irregularity in cycle length without a defined missed duration"], "ans": 2, "exp": "Correct — C: Secondary amenorrhea is the absence of menstruation for a time equivalent to three or more of the woman's previous cycles. A, B, and D do not match this specific definition."}, {"q": "Which hormonal/metabolic abnormality plays a key role in the androgen excess of polycystic ovary syndrome (PCOS)?", "opts": ["Insulin resistance and hyperinsulinemia", "Hypoinsulinemia resulting from autoimmune destruction of pancreatic beta cells", "Excess progesterone secretion alone, unrelated to insulin or glucose metabolism", "Primary thyroid failure causing generalized hypometabolism"], "ans": 0, "exp": "Correct — A: Insulin resistance and hyperinsulinemia play a key role in driving androgen excess in PCOS, in addition to inappropriate gonadotropin secretion. B is the opposite of the actual pathophysiology. C and D are not the mechanisms described for PCOS androgen excess."}, {"q": "Which combination of findings characterizes polycystic ovary syndrome?", "opts": ["Excess androgen production, anovulation, ovarian cysts, endometrial proliferation, and often hirsutism", "Low androgen levels together with consistently regular ovulatory cycles", "Complete absence of ovarian follicles alongside normal, predictable menstruation", "Isolated benign thyroid nodules unrelated to ovarian or androgen function"], "ans": 0, "exp": "Correct — A: PCOS involves excessive androgen production (triggered by inappropriate gonadotropin secretion), which prevents ovulation and causes ovarian cyst formation, endometrial proliferation, and often hirsutism. B, C, and D do not reflect the PCOS symptom complex."}, {"q": "Which symptoms are reported as most distressing in premenstrual syndrome (PMS)?", "opts": ["Emotional symptoms — particularly depression, anger, irritability, and fatigue", "Physical symptoms exclusively, such as bloating and breast tenderness, with no reported emotional component", "Fever and chills consistent with an underlying systemic infection", "Joint swelling and warmth localized only to the peripheral joints"], "ans": 0, "exp": "Correct — A: Emotional symptoms — especially depression, anger, irritability, and fatigue — are reported as the most distressing PMS symptoms, with physical symptoms tending to be less problematic by comparison. B, C, and D do not match this description."}, {"q": "Premenstrual dysphoric disorder (PMDD) is best understood as:", "opts": ["A completely separate condition with no hormonal or symptomatic relationship to PMS", "A form of secondary amenorrhea caused by an underlying structural uterine lesion", "A severe form of PMS", "A structural uterine abnormality identified on pelvic ultrasound"], "ans": 2, "exp": "Correct — C: PMDD is described as a severe form of PMS. A, B, and D mischaracterize its relationship to PMS or misclassify it as an unrelated condition."}, {"q": "Untreated pelvic inflammatory disease (PID) is a substantial health risk to women primarily because it can lead to:", "opts": ["Infertility", "Improved future fertility due to residual pelvic scarring aiding implantation", "Increased bone density mediated by chronic low-grade pelvic inflammation", "Complete spontaneous resolution without any long-term reproductive consequence"], "ans": 0, "exp": "Correct — A: Untreated PID is a substantial health risk because it can lead to infertility, among other complications, from scarring/damage to reproductive structures. B, C, and D do not reflect the known risks of untreated PID."}, {"q": "Vaginitis is typically caused by which organisms?", "opts": ["Only non-infectious mechanical irritation from tampon or diaphragm use", "Sexually transmitted pathogens or Candida albicans (candidiasis)", "Exclusively fungal infections confined to the surrounding perineal skin", "Viral upper respiratory pathogens spreading via the bloodstream"], "ans": 1, "exp": "Correct — B: Vaginitis (vaginal irritation/inflammation) is usually caused by sexually transmitted pathogens or by Candida albicans (candidiasis). A, C, and D do not reflect the typical infectious causes described."}, {"q": "Bacterial vaginosis (BV) is characterized by which vaginal flora shift?", "opts": ["An increase in Lactobacillus dominance producing a more acidic vaginal pH", "A shift from dominant Lactobacillus to a polymicrobial flora", "Complete sterility of the vaginal canal with no detectable organisms", "Overgrowth of a single, universally identified pathogen in every case"], "ans": 1, "exp": "Correct — B: BV is characterized by a shift from Lactobacillus-dominant flora to a polymicrobial flora, and no single organism identifies all cases. A is the opposite of the actual shift. C and D do not match the described pathophysiology."}, {"q": "What are potential health consequences associated with bacterial vaginosis?", "opts": ["No known systemic or reproductive health associations of any kind", "Improved pregnancy outcomes due to altered protective vaginal flora", "A decreased risk of preterm labor compared with normal vaginal flora", "Preterm birth, PID, and increased susceptibility to HIV infection"], "ans": 3, "exp": "Correct — D: BV is correlated with preterm birth, PID, and increased susceptibility to HIV infection, among other health issues. B, C, and A understate or contradict these known associations."}, {"q": "What is the most common cause of cervicitis?", "opts": ["A sexually transmitted pathogen", "Mechanical trauma from tampon insertion, occurring independent of infection", "Autoimmune inflammation directed against cervical epithelial cells", "A dietary vitamin deficiency affecting cervical mucosal integrity"], "ans": 0, "exp": "Correct — A: Cervicitis (infection of the cervix, acute or chronic) is most commonly caused by a sexually transmitted pathogen. B, C, and D are not the most common cause described."}, {"q": "Pelvic organ prolapse (uterine prolapse, cystocele, rectocele, urethrocele) is primarily caused by:", "opts": ["Relaxation of pelvic muscles and fascial supports, often from advancing age, childbirth, or trauma", "Excess estrogen production stimulating abnormal pelvic ligament growth", "An acute bacterial infection ascending from the lower genital tract", "Congenital absence of the uterus present since birth"], "ans": 0, "exp": "Correct — A: Pelvic organ prolapse results from relaxation of muscles and fascial supports, usually from advancing age, childbirth, or other trauma, with familial/genetic predisposition increasing risk. B, C, and D are not the described mechanism."}, {"q": "Benign ovarian cysts most commonly develop from which structures?", "opts": ["Malignant transformation of ectopic endometrial implants within the ovary", "Mature follicles that fail to release their ova (follicular cysts) or a persistently non-degenerating corpus luteum (corpus luteum cysts)", "Proliferation of the fallopian tube epithelium extending into the ovarian cortex", "Chronic inflammatory changes originating in the uterine cervix"], "ans": 1, "exp": "Correct — B: Benign ovarian cysts typically arise from follicles that do not release ova (follicular cysts) or from a corpus luteum that abnormally persists rather than degenerating (corpus luteum cysts); most regress spontaneously. A, C, and D do not describe the origin of these benign cysts."}, {"q": "Leiomyomas (uterine fibroids) arise from which uterine tissue layer?", "opts": ["The endometrium, the hormonally responsive glandular inner lining", "The myometrium (smooth muscle layer)", "The perimetrium, the thin outer serosal covering of the uterus", "The cervix exclusively, sparing the muscular body of the uterus"], "ans": 1, "exp": "Correct — B: Leiomyomas (myomas/fibroids) are benign tumors arising from the myometrium, the smooth muscle layer of the uterus, with prevalence increasing between ages 30-50. A, C, and D do not describe the tissue of origin."}, {"q": "Adenomyosis is defined as:", "opts": ["The presence of endometrial glands and stroma within the uterine myometrium", "Endometrial tissue growing entirely outside the uterus on pelvic structures", "A benign smooth muscle tumor arising from the cervical stroma", "Complete congenital absence of the endometrial lining"], "ans": 0, "exp": "Correct — A: Adenomyosis is the presence of endometrial glands and stroma within the myometrium (the muscular uterine wall), distinct from endometriosis, in which endometrial tissue is found outside the uterus altogether (option B)."}, {"q": "Endometriosis is defined as:", "opts": ["Endometrial tissue confined entirely within the boundaries of the uterine cavity", "Functional endometrial tissue located outside the uterus, causing inflammation and a common cause of infertility", "A malignant tumor arising from smooth muscle cells of the myometrium", "A congenital absence of endometrial glands and stroma from birth"], "ans": 1, "exp": "Correct — B: Endometriosis is the presence of functional (hormonally responsive) endometrial tissue outside the uterus, causing an inflammatory reaction at implantation sites and serving as a recognized cause of infertility. A describes normal endometrial anatomy, not endometriosis. C and D do not match the definition."}, {"q": "Which viral infection is the trigger for cervical cancer?", "opts": ["Human papillomavirus (HPV)", "Herpes simplex virus, which instead causes recurrent genital ulcerative lesions", "Epstein-Barr virus, the causative agent of infectious mononucleosis", "Cytomegalovirus, typically associated with congenital infection"], "ans": 0, "exp": "Correct — A: Cervical cancer arises from the cervical epithelium and is triggered by HPV infection at the squamocolumnar junction, progressing through CIN to carcinoma in situ to invasive cancer. B, C, and D are not the causative agent for cervical cancer."}, {"q": "The HPV vaccine can reduce the risk of which cancers, and for which age group is it approved?", "opts": ["Cervical, oropharyngeal, and anal cancers; approved for girls and boys aged 11 through 26", "Breast cancer only; approved exclusively for adult women over age 40", "Ovarian cancer only; approved exclusively for postmenopausal women", "Lung cancer; approved exclusively for adult individuals with a significant smoking history"], "ans": 0, "exp": "Correct — A: The HPV vaccine substantially reduces risk of cervical, oropharyngeal, and anal cancers, and is approved for both girls and boys aged 11 through 26. B, C, and D misstate the cancers targeted and the approved population."}, {"q": "Which is the most common cancer of the pelvic region, and what is a primary risk factor?", "opts": ["Ovarian cancer; caused primarily by chronic HPV infection of the ovarian surface", "Endometrial cancer; primary risk factors include exposure to unopposed estrogen", "Cervical cancer; caused primarily by chronically low estrogen exposure", "Vaginal cancer; caused primarily by persistently low body weight"], "ans": 1, "exp": "Correct — B: Endometrial cancer is the most common cancer of the pelvic region, with unopposed estrogen exposure (estrogen-only HRT, tamoxifen, early menarche, late menopause, nulliparity, anovulation) as a primary risk factor, along with hyperinsulinemia, obesity, and chronic inflammation. A mismatches ovarian cancer's cause. C and D misstate the causative exposures."}, {"q": "Why does ovarian cancer cause more deaths than any other genital cancer despite its relative rarity?", "opts": ["It is always an inherited condition with no available treatment options", "It exclusively affects postmenopausal women past the age of 65", "It characteristically grows more slowly than most other gynecologic cancers and rarely metastasizes", "It typically presents at an advanced stage, since early screening methods are limited"], "ans": 3, "exp": "Correct — D: Ovarian cancer causes disproportionately more deaths because it usually presents in advanced disease, given the historical lack of effective routine screening (though new methods are being explored). A overstates heritability (BRCA1/2/HNPCC are risk factors, not the sole cause). C is inaccurate. B is incorrect, as risk factors include reproductive/hormonal exposures across the lifespan, not exclusively postmenopausal status."}, {"q": "Which genetic mutations are linked with increased ovarian cancer risk?", "opts": ["CFTR mutations, which instead underlie cystic fibrosis pathology", "BRCA1, BRCA2, and HNPCC", "Factor V Leiden, a mutation associated with venous thromboembolism risk", "SRY gene mutations, which instead affect fetal gonadal differentiation"], "ans": 1, "exp": "Correct — B: BRCA1, BRCA2, and HNPCC gene abnormalities are linked with increased ovarian cancer risk. A, C, and D are associated with cystic fibrosis, clotting disorders, and sex differentiation respectively — not ovarian cancer."}, {"q": "What is the most common cause of galactorrhea (inappropriate lactation)?", "opts": ["Nonpuerperal hyperprolactinemia (elevated serum prolactin outside of pregnancy/nursing)", "Hypoprolactinemia resulting from anterior pituitary hypofunction", "Excess estrogen production alone, without any change in prolactin", "Generalized pituitary hypofunction affecting multiple hormone axes"], "ans": 0, "exp": "Correct — A: Galactorrhea's most common cause is nonpuerperal hyperprolactinemia — an elevated serum prolactin level in a woman who is not postpartum or nursing. B, C, and D do not match the described mechanism (which involves excess, not deficient, prolactin/pituitary activity)."}, {"q": "Which category of benign breast lesion carries features such as atypical ductal hyperplasia (ADH) and atypical lobular hyperplasia (ALH)?", "opts": ["Nonproliferative breast lesions such as simple cysts and mild fibrosis", "Proliferative breast lesions without atypia, such as usual ductal hyperplasia", "Proliferative breast lesions with atypia", "Malignant lesions exclusively, such as invasive ductal carcinoma"], "ans": 2, "exp": "Correct — C: ADH and ALH are examples of proliferative breast lesions with atypia, which carry a higher future breast cancer risk than nonproliferative lesions (A) or proliferative lesions without atypia (B, e.g., usual ductal hyperplasia, intraductal papillomas). D is incorrect since ADH/ALH are benign, not malignant, lesions."}, {"q": "Which of the following is the most common cause of cancer death in women, after lung cancer?", "opts": ["Vaginal cancer, a comparatively rare malignancy of the lower genital tract", "Cervical cancer, whose incidence has declined with widespread screening", "Breast cancer", "Vulvar cancer, an uncommon malignancy typically affecting older women"], "ans": 2, "exp": "Correct — C: Breast cancer is the most common cancer in women and the second most common cause of cancer death, after lung cancer. B, A, and D are all less common cancers of the female reproductive tract and are not the second-leading cause of cancer death."}, {"q": "What is typically the first clinical manifestation of breast cancer?", "opts": ["A small, painless lump in the breast", "Deep bone pain resulting from early metastatic spread", "Nipple discharge, which occurs as the earliest sign in every case", "Reddened, warm skin overlying the breast, present in all early cases"], "ans": 0, "exp": "Correct — A: The first clinical manifestation of breast cancer is usually a small, painless lump; other manifestations (palpable axillary nodes, skin dimpling/retraction, nipple discharge, ulceration, reddened skin, bone pain from metastases) tend to occur later. B, C, and D describe later or less universal findings, not the earliest typical sign."}, {"q": "Which factors have emerged as important risk factors for breast cancer, beyond classic reproductive/familial/hormonal factors?", "opts": ["Delayed involution of the mammary gland and breast density", "Low estradiol exposure throughout the reproductive years, which is not an established risk factor", "Early onset of menopause before the age of 45", "Multiparity beginning at a young maternal age"], "ans": 0, "exp": "Correct — A: Delayed involution of the mammary gland and increased breast density have emerged as important breast cancer risk factors, in addition to classic factors like nulliparity, excess estradiol/IGF-1, family history, and ionizing radiation. B, C, and D describe patterns generally associated with lower, not higher, breast cancer risk."}], "clinical": [{"q": "A 16-year-old girl presents with cramping lower abdominal pain each month with menstruation, and pelvic exam and imaging are normal. Which diagnosis and mechanism are most likely?", "opts": ["Secondary dysmenorrhea from endometriosis, which would typically show abnormal pelvic ultrasound findings", "Adenomyosis, with endometrial glands infiltrating the myometrium", "Pelvic inflammatory disease ascending from the lower genital tract", "Primary dysmenorrhea from excess PGF2α causing myometrial contraction/ischemia"], "ans": 3, "exp": "Correct — D: Cramping menstrual pain with a normal pelvic exam/imaging (no identifiable disease) is classic for primary dysmenorrhea, caused by excess prostaglandin (PGF2α) synthesis causing myometrial contraction and ischemic pain. A, C, and B all require an identifiable underlying pelvic pathology, which is absent here."}, {"q": "A 28-year-old woman with known endometriosis reports worsening menstrual cramping over the past year. Which type of dysmenorrhea does this represent?", "opts": ["Secondary dysmenorrhea, since it results from an identifiable pelvic disease process", "Primary dysmenorrhea, driven purely by excess prostaglandin synthesis without any pelvic pathology", "Amenorrhea, defined by the complete absence of menstrual bleeding", "Premenstrual dysphoric disorder, a severe mood-based condition"], "ans": 0, "exp": "Correct — A: Because her dysmenorrhea is associated with a known pelvic disease (endometriosis), this is secondary dysmenorrhea by definition. B applies only when no such disease is present. C and D describe different conditions (absence of menses; a severe mood-symptom cluster) not primarily characterized by cramping pain."}, {"q": "A 14-year-old girl has not yet had her first period and has not developed any breast budding or pubic hair. Which term applies, and by what age would this become concerning if unchanged?", "opts": ["Primary amenorrhea; concerning by age 13 without secondary sex characteristics (or 15 if characteristics have appeared)", "Secondary amenorrhea; concerning immediately regardless of prior menstrual history", "Precocious puberty, given early development of secondary sex characteristics", "This is entirely normal regardless of age or physical development"], "ans": 0, "exp": "Correct —  insulin resistance—related androgen excess. B, C, and D do not typically present with this specific hormonal/metabolic/ultrasound picture."}, {"q": "A 32-year-old woman reports that every month, in the week before her period, she becomes irritable, angry, fatigued, and tearful, disrupting her work and relationships, with resolution shortly after menses begins. Which condition best fits, and which symptom category is typically most distressing?", "opts": ["Endometriosis; chronic pelvic pain is typically the most distressing symptom", "Premenstrual syndrome (PMS); emotional symptoms are typically most distressing", "PID; fever and systemic infection symptoms are typically most distressing", "Secondary amenorrhea; absence of menses itself is the most distressing symptom"], "ans": 1, "exp": "Correct — B: Cyclic, distressing emotional/behavioral changes before menses with resolution after onset of the period describe PMS, and emotional symptoms (irritability, anger, fatigue, depression) are described as typically the most distressing component. A, C, and D describe different conditions with different characteristic symptoms not matching this cyclic mood pattern."}, {"q": "A 30-year-old woman has the same symptoms as typical PMS but they are severe enough to cause significant functional impairment, meeting formal diagnostic criteria for a mood disorder. Which diagnosis is most appropriate?", "opts": ["PMDD (premenstrual dysphoric disorder), a severe form of PMS", "Mild PMS, causing only minor, non-impairing symptoms", "Secondary dysmenorrhea caused by an identifiable pelvic lesion", "Vulvovestibulitis, a localized inflammatory vulvar condition"], "ans": 0, "exp": "Correct — A: Severe, functionally impairing premenstrual mood symptoms meeting formal criteria describe PMDD, which is a severe form of PMS. B understates the severity described. C and D describe unrelated conditions (pain with menstruation; vulvar skin inflammation)."}, {"q": "A sexually active 22-year-old woman presents with lower abdominal pain, fever, and cervical motion tenderness. She is diagnosed with an acute infection of the upper reproductive tract. Which condition is this, and what is a major long-term risk if untreated?", "opts": ["Vulvovestibulitis; this condition carries no long-term reproductive risk", "Pelvic inflammatory disease (PID); untreated PID can lead to infertility", "A Bartholin cyst; untreated cysts primarily increase ovarian cancer risk", "Cervical cancer; the primary long-term risk is infertility from HPV"], "ans": 1, "exp": "Correct — B: Fever, lower abdominal pain, and cervical motion tenderness in a sexually active young woman are classic for PID, an acute infection often from sexually transmitted organisms, and untreated PID is a substantial risk factor for infertility. A, C, and D mischaracterize the condition or its major complication."}, {"q": "A 27-year-old woman presents with vaginal itching and a thick, white discharge. Culture confirms Candida albicans. Which condition does this represent?", "opts": ["Bacterial vaginosis, marked by a shift away from Lactobacillus dominance", "Candidiasis (a cause of vaginitis)", "Cervicitis caused by an underlying HPV infection", "Pelvic organ prolapse from relaxed pelvic floor support"], "ans": 1, "exp": "Correct — B: Candida albicans infection producing vaginal itching and thick white discharge is candidiasis, a common cause of vaginitis. A is caused by a shift in bacterial flora (not Candida) and classically presents with a thin, fishy-odored discharge instead. C and D describe unrelated conditions."}, {"q": "A pregnant woman is found on screening to have bacterial vaginosis. Which pregnancy-related complication is she at increased risk for?", "opts": ["Postterm pregnancy extending beyond 42 weeks of gestation", "Preterm birth", "Multiple gestation resulting from altered ovarian follicular recruitment", "Placenta previa with abnormal placental implantation over the cervix"], "ans": 1, "exp": "Correct — B: BV is correlated with an increased risk of preterm birth, along with PID and increased HIV susceptibility. A, C, and D are not complications associated with BV."}, {"q": "A 45-year-old woman who has had three vaginal deliveries reports a sensation of pelvic pressure and a bulge at the vaginal opening, worse with standing. Exam reveals descent of the anterior vaginal wall with the bladder. Which condition is this, and what is the most likely contributing factor?", "opts": ["Cystocele, related to relaxation of pelvic muscles/fascia from childbirth", "A Bartholin cyst, related to obstruction and inflammation of the Bartholin gland duct", "Cervicitis, related to an underlying sexually transmitted infection", "An ovarian cyst, related to persistence of the follicular structure"], "ans": 0, "exp": "Correct — A: Descent of the bladder through the anterior vaginal wall is a cystocele, a form of pelvic organ prolapse related to relaxation of pelvic muscle/fascial supports, commonly from childbirth or advancing age. B, C, and D describe unrelated conditions with different mechanisms and presentations."}, {"q": "A 38-year-old woman presents with heavy, irregular uterine bleeding. Pelvic ultrasound reveals a well-circumscribed mass arising from the myometrium. Which diagnosis is most likely?", "opts": ["Endometriosis, with ectopic endometrial implants outside the uterine cavity", "Ovarian cancer arising from the ovarian surface epithelium", "Leiomyoma (uterine fibroid)", "Cervical cancer arising from the squamocolumnar transformation zone"], "ans": 2, "exp": "Correct — C: C well-circumscribed myometrial mass causing heavy/irregular bleeding in a woman in her 30s-40s is classic for a leiomyoma (fibroid), a benign smooth-muscle tumor of the myometrium. B, A, and D describe different tissue origins/presentations."}, {"q": "A 34-year-old woman has chronic pelvic pain, painful intercourse, and infertility. Laparoscopy reveals implants of endometrial-type tissue on the ovaries and peritoneum. Which diagnosis is confirmed, and why does it cause infertility?", "opts": ["PCOS; caused by chronic androgen excess and anovulatory cycles", "Adenomyosis; caused by endometrial glands and stroma confined within the myometrium only, with no fertility impact", "Endometriosis; the ectopic, hormonally responsive tissue causes an inflammatory reaction that impairs fertility", "Cervical cancer; caused by persistent high-risk HPV infection"], "ans": 2, "exp": "Correct — C: Laparoscopic findings of endometrial-type implants outside the uterus (ovaries, peritoneum) confirm endometriosis, and the resulting inflammatory reaction at implantation sites is a recognized cause of infertility. B describes a different condition (intramyometrial, not ectopic-pelvic, endometrial tissue) and understates fertility impact; A and D describe unrelated mechanisms."}, {"q": "A 35-year-old woman is diagnosed with cervical intraepithelial neoplasia (CIN) after an abnormal Pap smear. Which infection is the underlying trigger for this progression toward cervical cancer?", "opts": ["Candida albicans, a fungal organism causing vulvovaginal candidiasis", "Herpes simplex virus, which instead causes recurrent genital ulcers", "Chlamydia trachomatis alone, without any viral cofactor involvement", "Human papillomavirus (HPV)"], "ans": 3, "exp": "Correct — D: HPV infection triggers the progressive neoplastic changes (CIN → carcinoma in situ → invasive carcinoma) at the cervical squamocolumnar junction. B, C, and A are not the causative trigger for cervical cancer's neoplastic progression, although chlamydia and other infections can coexist."}, {"q": "A mother asks whether her 12-year-old son should also receive the HPV vaccine, since she thought it was only for girls. What is the nurse's best response?", "opts": ["The vaccine is only recommended for girls due to its mechanism of action", "The vaccine is approved for both girls and boys aged 11 through 26 and reduces risk of cervical, oropharyngeal, and anal cancers", "The vaccine provides no measurable benefit for males of any age", "The vaccine should only be administered after age 26 for maximal effect"], "ans": 1, "exp": "Correct — B: The HPV vaccine is approved for both girls and boys aged 11 through 26 and reduces the risk of cervical, oropharyngeal, and anal cancers (the latter two relevant to any sex). A, C, and D understate or misstate the approved population and benefit."}, {"q": "A 62-year-old woman on long-term unopposed estrogen therapy (without progesterone) presents with postmenopausal bleeding. Which cancer should be highest on the differential given her risk factors, and why?", "opts": ["Cervical cancer, because of long-standing high-risk HPV exposure and infection alone", "Vaginal cancer, because of chronically low estrogen exposure", "Endometrial cancer, because unopposed estrogen exposure is a primary risk factor", "Vulvar cancer, because of chronic vulvar skin irritation"], "ans": 2, "exp": "Correct — C: Postmenopausal bleeding with a history of unopposed estrogen therapy strongly raises concern for endometrial cancer, since unopposed estrogen exposure is a primary described risk factor. B, A, and D list cancers with different characteristic risk factor profiles not matching this scenario."}, {"q": "A 58-year-old woman with a strong family history of ovarian and breast cancer tests positive for a BRCA1 mutation. Why is her ovarian cancer risk of particular clinical concern despite the cancer's rarity?", "opts": ["Ovarian cancer is actually more common than breast cancer in the general population", "Ovarian cancer is always cured easily regardless of the stage at diagnosis", "BRCA1 mutations have no bearing on ovarian cancer risk whatsoever", "Ovarian cancer often presents late/advanced, contributing to a high mortality rate, and screening options remain limited"], "ans": 3, "exp": "Correct — D: BRCA1/2 (and HNPCC) mutations raise ovarian cancer risk, and because ovarian cancer often presents at an advanced stage with limited routine screening, it causes disproportionately high mortality among genital cancers. B, C, and A contradict established facts about ovarian cancer's prognosis, genetics, and relative incidence."}, {"q": "A 40-year-old woman who is not pregnant or breastfeeding presents with persistent milky nipple discharge. Serum prolactin is markedly elevated. Which diagnosis is most likely, and what should be pursued next?", "opts": ["Mastitis, which requires only a short course of oral antibiotics", "Normal lactation physiology, requiring no further diagnostic workup", "Breast cancer, since nipple discharge is always bloody rather than milky", "Galactorrhea from nonpuerperal hyperprolactinemia; further workup (e.g., for a prolactin-secreting pituitary tumor) is warranted"], "ans": 3, "exp": "Correct — D: Milky discharge outside of pregnancy/nursing with elevated prolactin is galactorrhea from nonpuerperal hyperprolactinemia, and elevated prolactin warrants further evaluation for causes such as a prolactin-secreting pituitary adenoma. B is incorrect since she is not postpartum/nursing. C mischaracterizes typical breast cancer discharge and misses this classic hormonal presentation. A describes an unrelated acute infectious breast condition."}, {"q": "A 50-year-old woman finds a small, painless lump in her breast on self-exam. What is the most appropriate next step, given that this is the most common initial presentation of breast cancer?", "opts": ["Reassure her that painless lumps are never a cause for clinical concern", "Recommend only home warm compresses and reassess in six months", "Advise her to wait one full year before returning for reevaluation", "Refer for prompt clinical breast exam and imaging evaluation, since a painless lump is the classic first sign of breast cancer"], "ans": 3, "exp": "Correct — D: Since a small, painless lump is described as the classic first clinical manifestation of breast cancer, any new palpable lump warrants prompt clinical evaluation and imaging rather than reassurance or a delayed approach. A, C, and B inappropriately dismiss or delay evaluation of a potentially significant finding."}, {"q": "A 45-year-old woman with dense breast tissue on mammography and a history of delayed first pregnancy (age 38) asks about her breast cancer risk. How should the nurse respond?", "opts": ["Breast density has no established relationship to breast cancer risk", "Neither dense tissue nor delayed childbearing has any bearing on cancer risk", "Only a smoking history meaningfully affects breast cancer risk", "Both breast density and delayed mammary gland involution (associated with later childbearing) have emerged as important breast cancer risk factors"], "ans": 3, "exp": "Correct — D: Breast density and delayed involution of the mammary gland (associated with later parity) have emerged as important risk factors for breast cancer, in addition to classic hormonal/familial/environmental factors. B, C, and A understate or dismiss these established risk associations."}, {"q": "A 29-year-old woman presents with a vulvar lesion, chronic itching, and a hard, ulcerated area. Biopsy reveals vulvar cancer. Which infection is a recognized risk factor for this diagnosis?", "opts": ["Human papillomavirus (HPV) infection", "Influenza virus, a respiratory pathogen unrelated to vulvar malignancy", "Group A streptococcus, a bacterium causing skin and throat infections", "Hepatitis A virus, transmitted primarily through fecal-oral contact"], "ans": 0, "exp": "Correct — A: HPV infection (or squamous dysplasia of the vagina/cervix) is a recognized risk factor for vulvar cancer, which presents with chronic irritation, pruritus, bloody discharge, and a hard-ulcerated or cauliflower-like lesion. B, C, and D are not established risk factors for vulvar cancer."}, {"q": "A 30-year-old woman with a history of chlamydia infection is found to have a tender, swollen mass at the posterior vulva that has blocked normal gland drainage. Which condition is most likely?", "opts": ["A leiomyoma, a benign smooth muscle tumor of the uterine wall", "An endometrioma, an ovarian cyst filled with old menstrual blood", "Bartholinitis (Bartholin cyst), from infection/blockage of the Bartholin gland ducts", "A cervical polyp, a benign vascular growth arising from the endocervical canal mucosa and lining"], "ans": 2, "exp": "Correct — C: C tender, swollen mass at the posterior vulva from blocked glandular secretion outflow describes Bartholinitis (Bartholin cyst/abscess), often related to infection of the duct. B, A, and D describe masses in different anatomic locations with different mechanisms."}]}, {"title": "Alterations of the Male Reproductive System", "code": "Chapter 26", "color": "c10", "subtitle": "Sexual Maturation • Urethral, Penile & Scrotal Disorders • Prostate Disorders • Sexual Dysfunction • Male Breast Disorders", "general": [{"q": "At what age does the male growth spurt typically occur if delayed, and does this usually require treatment?", "opts": ["15 to 17 years; seldom requires treatment", "9 to 14 years; this timing always requires immediate hormonal treatment", "5 to 8 years; this timing always requires immediate hormonal treatment", "18 to 21 years; this timing is never evaluated by a clinician"], "ans": 0, "exp": "Correct — A: Delayed puberty in boys, with the growth spurt occurring at 15 to 17 years, seldom requires treatment. B describes the normal (not delayed) onset window. C and D do not match the described delayed-puberty timeline."}, {"q": "Precocious puberty in boys is defined as onset of secondary sex characteristics before what age?", "opts": ["Age 9", "Age 13, the upper boundary of the normal pubertal window in boys", "Age 15, well beyond the typical range for pubertal onset", "Age 18, corresponding to legal adulthood rather than puberty"], "ans": 0, "exp": "Correct — A: Precocious puberty in boys is early development of secondary sex characteristics before age 9. B, C, and D do not match this specific age threshold."}, {"q": "What is contrasexual development?", "opts": ["Normal, expected timing of pubertal onset that matches the child's own biological sex rather than the opposite sex", "A synonym describing the gradual androgen decline seen in aging men", "Delayed puberty only, with no change in secondary sex characteristics", "Development of features of the opposite gender in male or female children"], "ans": 3, "exp": "Correct — D: Contrasexual development refers to male or female children developing features of the opposite gender. A, C, and B do not match this specific definition."}, {"q": "What are the two main disorders of the urethra described in the summary review?", "opts": ["Cystitis and pyelonephritis, both infections of the bladder and kidney", "Urethritis and urethral strictures", "Varicocele and hydrocele, both scrotal vascular/fluid abnormalities", "Orchitis and epididymitis, both inflammatory testicular conditions"], "ans": 1, "exp": "Correct — B: The urethral disorders described are urethritis (infection) and urethral strictures (narrowing/obstruction from scarring). A describes bladder/kidney infections, and C and D describe scrotal/testicular conditions, not urethral disorders."}, {"q": "Most cases of urethritis result from which cause?", "opts": ["Autoimmune disease exclusively, without any infectious component", "Dietary factors, such as excessive intake of acidic foods", "Sexually transmitted pathogens", "Congenital absence of the urethra present since birth"], "ans": 2, "exp": "Correct — C: Most urethritis cases result from sexually transmitted pathogens, though urologic instrumentation, foreign bodies, trauma, or anatomic abnormality can also cause urethral inflammation. B, A, and D are not the most common cause described."}, {"q": "Which symptoms are characteristic of urethritis?", "opts": ["Deep, aching bone pain unrelated to urination", "Painless hematuria as the sole presenting urinary symptom in this condition", "A complete absence of any urinary symptoms", "Dysuria, frequency, urgency, urethral tingling/itching, and discharge"], "ans": 3, "exp": "Correct — D: Urethritis causes dysuria, frequency, urgency, urethral tingling or itching, and clear or purulent discharge. B, C, and A do not describe the characteristic symptom complex of urethritis."}, {"q": "What is the underlying pathophysiology of a urethral stricture?", "opts": ["Excess estrogen exposure altering urethral epithelial structure", "A congenital absence of the urethra present since birth", "Injury to the urethral epithelium causing leakage of urine into the corpus spongiosum or direct trauma to the corpus spongiosum", "Autoimmune destruction of the bladder wall lining"], "ans": 2, "exp": "Correct — C: Urethral stricture pathophysiology involves injury to the urethral epithelium (from idiopathic, iatrogenic, inflammatory, or traumatic causes) causing urine leak into the corpus spongiosum or direct trauma to it, leading to scarring/narrowing. B, A, and D do not describe this mechanism."}, {"q": "Which manifestations are associated with urethral stricture?", "opts": ["Painless swelling localized entirely to the testicle", "Sudden anuria accompanied by severe flank pain only", "Urinary frequency and hesitancy, mild dysuria, double/spraying stream, and post-void dribbling (bladder outlet obstruction pattern)", "Complete absence of any urinary symptoms whatsoever"], "ans": 2, "exp": "Correct — C: Urethral stricture manifests with bladder outlet obstruction symptoms — urinary frequency/hesitancy, mild dysuria, a double or spraying stream, and dribbling after voiding. B, A, and D do not match the described manifestations."}, {"q": "What is the difference between phimosis and paraphimosis?", "opts": ["Phimosis occurs only in adults, while paraphimosis occurs only in infants", "They are the same condition described using two different clinical terms", "Phimosis is inability to re mation confined solely to the foreskin", "Priapism, a prolonged and painful unwanted erection", "Balanoposthitis"], "ans": 3, "exp": "Correct — D: Balanoposthitis involves both the glans and foreskin and occurs only in uncircumcised males. A (balanitis) affects only the glans, and B (posthitis) affects only the foreskin/prepuce; C is an unrelated erectile disorder."}, {"q": "Condyloma acuminatum is caused by which pathogen, and what type of lesion does it represent?", "opts": ["Candida; a fungal ulcerative lesion of the glans", "HSV; a malignant tumor arising from viral-induced cellular changes", "HIV; a bacterial infection of the genital skin", "HPV; a benign tumor"], "ans": 3, "exp": "Correct — D: Condyloma acuminatum (genital warts) is a benign tumor caused by HPV. B, C, and A misidentify the causative organism and/or the benign nature of the lesion."}, {"q": "Cancer of the penis typically affects men in which age range, and what is a known precursor lesion?", "opts": ["40 to 70 years; penile intraepithelial neoplasia (PeIN)", "10 to 20 years; with no known precursor lesion identified", "80 to 100 years exclusively; cervical intraepithelial neoplasia", "Any age equally; with no identified risk factors"], "ans": 0, "exp": "Correct — A: Penile cancer, though rare, typically affects men 40 to 70 years old, with penile intraepithelial neoplasia (PeIN) as its recognized precursor lesion, and risk factors including HPV, smoking, and chronic inflammation. B, C, and D misstate the age range and precursor."}, {"q": "A varicocele is best described as:", "opts": ["An abnormal dilation of the veins within the spermatic cord, classically described as a 'bag of worms'", "A fluid collection trapped between the layers of the tunica vaginalis", "A sperm-filled cyst located between the testis and epididymis", "A congenital absence of a testicle from the scrotal sac"], "ans": 0, "exp": "Correct — A: A varicocele is an abnormal dilation of the spermatic cord veins, classically described as feeling like a 'bag of worms,' and is a common finding in infertile men. B describes a hydrocele, C describes a spermatocele, and D describes cryptorchidism."}, {"q": "A hydrocele is defined as:", "opts": ["An abnormal collection of fluid between the layers of the tunica vaginalis of the testis", "Dilated, tortuous spermatic cord veins resembling a bag of worms", "A sperm-filled cyst located between the testis and epididymis", "Twisting of the spermatic cord cutting off testicular blood supply"], "ans": 0, "exp": "Correct — A: B hydrocele is an abnormal fluid collection between the layers of the tunica vaginalis testis. B describes a varicocele, C describes a spermatocele, and D describes testicular torsion."}, {"q": "What is cryptorchidism, and what is its most significant risk factor?", "opts": ["A benign tumor of the scrotal skin caused by chronic HPV infection", "An infection of the epididymis caused by a sexually transmitted pathogen", "Absence of at least one testicle from the scrotum; low birthweight is the main risk factor, followed by family history", "Excess fluid accumulating around the testis following blunt trauma"], "ans": 2, "exp": "Correct — C: Cryptorchidism, the absence of at least one testicle from the scrotum (the most common male genital birth defect), has low birthweight as its main risk factor, followed by family history; about 80% of cryptorchid testes descend by the third month. B, A, and D describe unrelated conditions."}, {"q": "Testicular torsion is a surgical emergency because blood supply must be restored within what timeframe to preserve testicular function?", "opts": ["1 week from onset of pain, allowing ample time for elective repair", "48 hours from onset of pain, similar to a typical surgical emergency", "6 hours from onset of pain", "There is no meaningful time constraint on surgical correction"], "ans": 2, "exp": "Correct — C: Testicular torsion must be surgically corrected within 6 hours of pain onset to preserve normal
