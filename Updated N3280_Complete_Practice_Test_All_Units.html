jury (AKI) is characterized by which combination of findings?", "opts": ["No change in any laboratory values despite the acute clinical picture", "A gradual decline occurring slowly over many years, with persistently and reassuringly normal creatinine values", "Increased urine output accompanied by a completely normal, unchanged GFR", "A sudden decline in kidney function with decreased GFR/urine output and elevated plasma creatinine/BUN"], "ans": 3, "exp": "Correct — D: AKI is a sudden decline in kidney function with decreased GFR and urine output, along with elevated plasma creatinine and BUN. B, C, and A misstate the acute, abnormal nature of AKI's presentation."}, {"q": "Prerenal AKI is caused by which mechanism?", "opts": ["Decreased renal perfusion causing ischemia, decreased GFR, and tubular necrosis", "Direct obstruction of urine outflow from the kidney", "A primary glomerular autoimmune process independent of renal perfusion", "A congenital renal malformation present since fetal development"], "ans": 0, "exp": "Correct — A: Prerenal AKI results from decreased renal perfusion, causing ischemia, decreased GFR, and (if prolonged) tubular necrosis. B describes postrenal AKI, and C and D describe different, non-prerenal processes."}, {"q": "Postrenal AKI results from which mechanism?", "opts": ["A systemic disease causing acute tubular necrosis", "Decreased renal blood flow alone, without any downstream obstruction", "Diseases that obstruct the flow of urine from the kidneys", "A hereditary cystic kidney disease"], "ans": 2, "exp": "Correct — C: Postrenal AKI is associated with diseases obstructing urine flow from the kidneys (downstream obstruction causing back-pressure). B describes prerenal AKI, and A and D describe different processes (intrarenal AKI and a congenital condition, respectively)."}, {"q": "Oliguria is defined as urine output less than what volume over 24 hours, and what mechanisms can cause it?", "opts": ["Any urine output at all falling below the level expected for normal daily caloric intake, an arbitrary comparison", "Less than 4000 mL/24h, caused only by excessive oral fluid intake", "Less than 40 mL/24h, caused only by an obstructing bladder tumor", "Less than 400 mL/24h; caused by altered renal blood flow, tubular obstruction, or tubular fluid backleak"], "ans": 3, "exp": "Correct — D: Oliguria is urine output less than 400 mL/24h, which can result from altered renal blood flow, tubular obstruction, tubular fluid backleak, or a combination of these. B, C, and A do not match the described definition/mechanisms."}, {"q": "Chronic kidney disease (CKD) is defined as progressive loss of renal function for what minimum duration?", "opts": ["3 months or more", "24 hours", "1 week", "10 years"], "ans": 0, "exp": "Correct — A: CKD is defined as progressive loss of renal function for 3 months or more, with health implications including altered electrolyte/acid-base balance and reduced erythropoietin production. B, C, and D do not match this definition."}, {"q": "At what level of renal function decline do symptomatic changes of CKD usually become evident?", "opts": ["100% of normal renal function", "Less than 25% of normal renal function", "90% of normal renal function", "Symptoms appear immediately with any renal function loss"], "ans": 1, "exp": "Correct — B: Symptomatic changes of CKD usually do not become evident until renal function declines to less than 25% of normal, reflecting substantial renal reserve. A, C, and D do not match this described threshold."}, {"q": "Which factors contribute to the progression of chronic kidney disease?", "opts": ["CKD does not progress once diagnosed, remaining permanently stable", "Only dietary protein intake alone, with no other genetic, hemodynamic, or inflammatory contributing factors whatsoever influencing disease course", "Only inherited genetic factors, with no modifiable hemodynamic contributors at all", "Glomerular hypertension, hyperfiltration, chronic inflammation, oxidative stress, and fibrosis, driven partly by proteinuria and angiotensin II"], "ans": 3, "exp": "Correct — D: CKD progression is driven by glomerular hypertension, hyperfiltration, chronic inflammation, oxidative stress, and fibrosis, with proteinuria and angiotensin II promoting these pathologic changes. B, C, and A misstate or dismiss these established progression factors."}, {"q": "Uremic syndrome is best described as:", "opts": ["A benign, entirely asymptomatic laboratory finding with no clinical significance whatsoever", "A proinflammatory state from accumulation of urea/nitrogenous compounds and toxins, with fluid/electrolyte/acid-base alterations from chronic kidney failure", "A condition limited exclusively to the urinary bladder, sparing all other organs", "An acute, fully reversible condition entirely unrelated to chronic kidney failure"], "ans": 1, "exp": "Correct — B: Uremic syndrome is a proinflammatory state resulting from accumulated urea, nitrogenous compounds, and toxins along with fluid/electrolyte/acid-base disturbances from chronic kidney failure, affecting all organ systems. A, C, and D understate or misstate its systemic, chronic nature."}], "clinical": [{"q": "A patient with a large kidney stone lodged at the ureteropelvic junction develops dilation of the renal pelvis and calyces on imaging. Which term describes this finding, and what other complications could develop if untreated?", "opts": ["Nephrotic syndrome; caused by glomerular protein loss, unrelated to obstruction", "Cystitis; a self-limited bladder infection that resolves without complications", "Hydronephrosis; can progress to tubulointerstitial fibrosis and compromised renal function if untreated", "Renal cell carcinoma; a malignant tumor process entirely unrelated to ureteral obstruction or stone disease"], "ans": 2, "exp": "Correct — C: Dilation of the renal pelvis/calyces from obstruction is hydronephrosis, which can progress to tubulointerstitial fibrosis and compromised renal function if the obstruction persists. B, A, and D describe unrelated conditions not caused by ureteral obstruction."}, {"q": "A patient undergoes surgical relief of a long-standing ureteral obstruction. In the following days, the nurse notes a dramatic increase in urine output. What is this phenomenon, and what should the nurse monitor for?", "opts": ["Postobstructive diuresis; monitor for fluid and electrolyte imbalance", "Oliguria; monitor for progressive fluid overload and hyperkalemia", "Nephrotic syndrome; monitor for worsening hyperlipidemia and edema", "Cystitis; monitor for dysuria and urinary frequency"], "ans": 0, "exp": "Correct — A: A marked increase in urine output after relieving obstruction is postobstructive diuresis, which can cause fluid and electrolyte imbalances requiring close monitoring. B, C, and D do not match this described post-relief phenomenon."}, {"q": "A 45-year-old man presents with sudden severe flank pain radiating to the groin and hematuria. Imaging reveals a calcium oxalate stone in the ureter. What underlying process led to stone formation?", "opts": ["An autoimmune reaction against the bladder mucosa causing chronic inflammatory cystitis unrelated to urinary chemistry", "A congenital absence of the ureter present since fetal development", "Supersaturation of urine with precipitation of stone-forming substances, influenced by urine pH changes", "A viral infection of the renal pelvis causing epithelial sloughing"], "ans": 2, "exp": "Correct — C: Kidney stones (most commonly calcium oxalate) form due to urine supersaturation with precipitation of stone-forming substances and pH changes. B, A, and D do not describe stone formation's underlying mechanism."}, {"q": "A 68-year-old man with benign prostatic hyperplasia develops urinary hesitancy, weak stream, and a sensation of incomplete emptying. What type of obstruction does this represent, and what chronic bladder wall change can result if untreated?", "opts": ["Upper urinary tract obstruction; causes only isolated hydronephrosis", "Lower urinary tract obstruction; chronic partial obstruction can cause collagen deposition in the bladder wall, decreasing compliance and impairing detrusor contraction", "No obstruction; this is a normal finding expected in older men", "Neurogenic bladder resulting from a sacral spinal cord lesion"], "ans": 1, "exp": "Correct — B: Prostatic enlargement causing hesitancy/weak stream/incomplete emptying is a classic anatomic cause of lower urinary tract obstruction; chronic partial obstruction leads to bladder wall collagen deposition, reducing compliance and detrusor effectiveness over time. A, C, and D do not match this presentation or its described chronic consequence."}, {"q": "A patient with multiple sclerosis and a spinal cord lesion above the pontine micturition center develops urinary urgency and uncontrolled bladder contractions. Which bladder dysfunction pattern is most likely?", "opts": ["Normal bladder function, entirely unrelated to the spinal lesion", "Underactive, atonic bladder function typical of sacral nerve injury", "Overactive (hyperreflexive) bladder function with dyssynergia", "Only bowel dysfunction, with no accompanying bladder involvement"], "ans": 2, "exp": "Correct — C: Lesions above the pontine micturition center classically cause overactive (hyperreflexive) bladder function with dyssynergia (loss of coordinated bladder-sphincter contraction). B, A, and D do not match the described lesion location and its typical bladder effect."}, {"q": "A patient with a sacral spinal cord injury develops urinary retention with an overdistended, easily palpable bladder and minimal detrusor contraction. Which bladder dysfunction pattern is most likely?", "opts": ["Normal bladder function, inconsistent with a sacral cord injury", "Overactive, hyperreflexive bladder function from an upper motor neuron lesion", "Underactive, hypotonic/atonic bladder function", "Detrusor sphincter dyssynergia with hyperreflexia"], "ans": 2, "exp": "Correct — C: Sacral spinal cord or peripheral nerve lesions typically cause underactive, hypotonic, or atonic bladder function with poor/absent detrusor contraction and urinary retention. B, A, and D describe patterns associated with upper motor neuron lesions instead, or a normal state inconsistent with this presentation."}, {"q": "A patient with a spinal cord injury has difficulty voiding because the urethral sphincter fails to relax during bladder contraction, causing a functional blockage despite normal anatomy. Which condition is this?", "opts": ["Detrusor sphincter dyssynergia", "A ureteral stone lodged at the ureterovesical junction", "Renal cell carcinoma metastatic to the pelvic sidewall", "Acute pyelonephritis with ascending bacterial infection"], "ans": 0, "exp": "Correct — A: Failure of the urethrovesical sphincter to release urine during detrusor contraction, causing functional obstruction despite normal anatomy, describes detrusor sphincter dyssynergia. B, C, and D describe unrelated structural or infectious conditions."}, {"q": "A 58-year-old smoker presents with painless gross hematuria. Cystoscopy reveals a papillary tumor of the bladder mucosa composed of transitional cells. Which characteristic of this tumor type should the nurse anticipate regarding follow-up care?", "opts": ["A high rate of recurrence, requiring ongoing surveillance", "Certain cure with no recurrence risk", "Spontaneous resolution without any treatment, chemotherapy, or surgical intervention needed", "No need for any follow-up monitoring"], "ans": 0, "exp": "Correct — A: Bladder tumors, commonly transitional cell tumors with a papillary appearance, have a high rate of recurrence, requiring long-term surveillance after treatment. B, C, and D understate this well-recognized recurrence risk."}, {"q": "A 62-year-old man is found to have a renal mass on imaging that has already metastasized to the lung and bone. Which type of kidney tumor is most likely, given it is the most common and has this metastatic pattern?", "opts": ["Renal cell carcinoma (RCC)", "Renal adenoma, typically a small benign incidental finding", "Wilms tumor, an embryonal tumor of early childhood", "Bladder transitional cell carcinoma confined locally"], "ans": 0, "exp": "Correct — A: RCC is the most common kidney tumor and can metastasize to the lung, lymph nodes, liver, bone, thyroid, and CNS, matching this presentation. B is typically benign and non-metastatic, C is a pediatric tumor, and D describes a different organ's tumor."}, {"q": "A sexually active young woman presents with dysuria, urgency, and frequency, with a normal urinary tract on prior imaging. Which classification of UTI does this represent?", "opts": ["Complicated UTI, since an abnormality must be present", "Uncomplicated UTI, since the urinary system is structurally/functionally normal", "Interstitial cystitis, since infection is present", "Chronic pyelonephritis, since symptoms are acute"], "ans": 1, "exp": "Correct — B: B UTI occurring in a person with a normal, unobstructed urinary tract is classified as uncomplicated. A requires an underlying abnormality (not present here), and C and D describe different conditions (infection-free chronic pain syndrome; upper-tract chronic scarring)."}, {"q": "A 32-year-old woman has had bladder pain, urgency, and frequency for 4 months, with repeatedly negative urine cultures and no other identifiable cause found. Which diagnosis fits, and what is the proposed underlying mechanism?", "opts": ["Renal cell carcinoma; caused by direct tumor invasion of the collecting system", "Acute cystitis; caused by ascending E. coli infection confirmed on culture", "Acute pyelonephritis; caused by ascending bacterial infection with fever, flank pain, and CVA tenderness, unlike this culture-negative presentation", "Interstitial cystitis/painful bladder syndrome; likely an inflammatory/autoimmune derangement of the glycosaminoglycan bladder lining"], "ans": 3, "exp": "Correct — D: LUT symptoms for more than 6 weeks without infection or other identifiable cause describe interstitial cystitis/painful bladder syndrome, thought to involve autoimmune/inflammatory disruption of the protective glycosaminoglycan layer. B requires a positive culture (absent here), and C and A describe different conditions with different diagnostic findings."}, {"q": "A 30-year-old woman with a history of vesicoureteral reflux presents with fever, flank pain, and costovertebral angle tenderness. Which condition is most likely, and what is a common risk factor she has?", "opts": ["Detrusor sphincter dyssynergia; a neuromuscular problem unrelated to reflux", "Interstitial cystitis; a chronic pain syndrome unrelated to reflux", "Renal cell carcinoma; a tumor process unrelated to urinary reflux", "Acute pyelonephritis; urinary reflux is a common underlying risk factor"], "ans": 3, "exp": "Correct — D: Fever, flank pain, and CVA tenderness describe acute pyelonephritis (upper urinary tract infection), and urinary reflux (along with obstruction) is a recognized common risk factor. B, C, and A do not fit this infectious, reflux-associated presentation."}, {"q": "A patient with recurrent, poorly treated UTIs over several years develops progressive renal scarring and declining renal function. Which condition does this describe, and what is the ultimate risk if untreated?", "opts": ["Acute cystitis; resolves completely with no lasting effect", "Chronic pyelonephritis; can progress to kidney failure if untreated", "Nephrotic syndrome; unrelated to infection", "Renal cell carcinoma; unrelated to infection"], "ans": 1, "exp": "Correct — B: Progressive renal scarring from recurrent/ascending infection and obstructive uropathy over time describes chronic pyelonephritis, which can lead to kidney failure if untreated. A, C, and D do not match this chronic, infection-related scarring process."}, {"q": "A patient with long-standing type 2 diabetes and chronic hyperglycemia develops progressive proteinuria and declining GFR. Which cause of glomerular injury is most likely responsible, given it is the most common cause of progression to CKD?", "opts": ["Lupus nephritis", "Diabetic nephropathy", "Acute poststreptococcal glomerulonephritis", "Renal cell carcinoma"], "ans": 1, "exp": "Correct — B: Diabetic nephropathy, related to chronic hyperglycemia and micro/macrovascular complications, is the most common cause of glomerular injury progressing to CKD, matching this patient's presentation. A, C, and D are different conditions not primarily driven by chronic hyperglycemia."}, {"q": "A young woman with systemic lupus erythematosus develops proteinuria and hematuria. Renal biopsy shows immune complex deposition in the glomeruli. Which autoantibodies are most likely responsible for this glomerular injury?", "opts": ["Antibodies against the glomerular basement membrane, characteristic of Goodpasture syndrome", "Autoantibodies against double-stranded DNA and nucleosomes", "Antibodies against streptococcal cell wall antigens from a recent throat infection", "Antibodies against pancreatic insulin receptors seen in autoimmune diabetes"], "ans": 1, "exp": "Correct — B: Lupus nephritis is caused by autoantibodies against double-stranded DNA and nucleosomes, which deposit as immune complexes in the glomerulus (or form against planted antigens there). A, C, and D describe different autoantibody targets not characteristic of lupus nephritis."}, {"q": "A patient presents with 4.5 g of proteinuria per day, hypoalbuminemia, edema, and hyperlipidemia. Which syndrome is this, and what is the underlying glomerular change?", "opts": ["Nephrotic syndrome; glomerular injury increases capillary permeability and reduces the membrane's negative charge, allowing protein loss", "Nephritic syndrome; characterized primarily by hematuria and RBC casts with only minimal, mild proteinuria, unlike this heavy-proteinuria picture", "Acute pyelonephritis; caused reased GFR"], "ans": 3, "exp": "Correct — D: Acute hypotension from surgical blood loss causing sudden renal function decline describes prerenal AKI, from decreased renal perfusion/ischemia. B, C, and A do not match this acute, perfusion-related mechanism."}, {"q": "A patient with an enlarged prostate develops bilateral hydronephrosis and a sudden rise in creatinine. Which category of AKI is most likely?", "opts": ["Prerenal AKI, from decreased perfusion", "Postrenal AKI, from obstruction of urine outflow", "Intrarenal AKI, from glomerulonephritis", "This does not represent AKI at all"], "ans": 1, "exp": "Correct — B: Bilateral hydronephrosis with rising creatinine in the setting of prostatic obstruction describes postrenal AKI, caused by obstructed urine outflow creating back-pressure that impairs renal function. A, C, and D do not match this obstructive mechanism."}, {"q": "A patient's 24-hour urine collection totals 300 mL. What term describes this finding, and what mechanisms could explain it?", "opts": ["Normal urine output requiring no further clinical evaluation", "Polyuria; resulting from excessive oral or intravenous fluid intake or diuretic use in this scenario", "Oliguria; caused by altered renal blood flow, tubular obstruction, or tubular fluid backleak", "Anuria; resulting from complete absence of any kidney function"], "ans": 2, "exp": "Correct — C: C 24-hour urine output of 300 mL (below the 400 mL threshold) is oliguria, which can result from altered renal blood flow, tubular obstruction, or tubular fluid backleak. B, A, and D do not match this specific volume and its established causes."}, {"q": "A patient has had progressively declining renal function for the past 8 months, with persistent proteinuria and elevated angiotensin II activity. Which process is this driving, and what CKD-related pathologic changes result?", "opts": ["A normal, expected laboratory finding requiring no clinical intervention", "An acute, fully reversible kidney injury with
