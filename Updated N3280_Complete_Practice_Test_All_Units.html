ndicitis; risk of progression to gangrene, perforation, and peritonitis"], "ans": 3, "exp": "Correct — D: Migratory periumbilical-to-RLQ pain with fever and rebound tenderness is classic for appendicitis, which risks progressing to gangrene, perforation, and peritonitis without timely surgery. B, C, and A describe different, non-surgical-emergency conditions."}, {"q": "An elderly patient with atrial fibrillation develops sudden severe abdominal pain out of proportion to exam findings, followed by bloody diarrhea and hypotension. Which condition is most likely, given the cardiac risk factor for embolization?", "opts": ["Acute mesenteric ischemia (intestinal vascular insufficiency), from embolic occlusion of mesenteric vessels", "Irritable bowel syndrome, presenting with chronic pain unrelated to embolic risk factors and a remote history of prior abdominal surgery", "Chronic pancreatitis, presenting with recurrent epigastric pain and steatorrhea", "GERD, presenting with heartburn rather than acute ischemic abdominal pain"], "ans": 0, "exp": "Correct — A: Severe abdominal pain out of proportion to exam, with bloody diarrhea and hypotension in a patient with atrial fibrillation (an embolic risk factor), describes acute mesenteric ischemia from embolic mesenteric vessel occlusion. B, C, and D do not present with this acute ischemic, embolism-related picture."}, {"q": "A patient with cirrhosis develops massive vomiting of blood. Endoscopy reveals bleeding esophageal varices. What underlying condition caused these varices to form?", "opts": ["A congenital vascular malformation present from birth, unrelated to liver disease", "A primary esophageal tumor invading and eroding the submucosal venous plexus", "GERD alone, causing erosive damage to the esophageal mucosa without venous dilation", "Portal hypertension, causing distended, tortuous collateral veins in the esophagus"], "ans": 3, "exp": "Correct — D: Esophageal varices form from portal hypertension (elevated portal venous pressure from cirrhosis), creating distended, tortuous collateral veins prone to rupture and bleeding. B, C, and A do not describe the actual cause of variceal formation in cirrhosis."}, {"q": "A patient with advanced cirrhosis becomes confused and lethargic, with an elevated serum ammonia level. Which complication is this, and what is its underlying cause?", "opts": ["Hepatic encephalopathy, from blood-borne toxins (especially ammonia) not metabolized by the failing liver", "Ascites, from portal hypertension and fluid accumulation within the peritoneal cavity accompanied by elevated jugular venous pressure", "Jaundice, from bilirubin accumulation causing yellowing of the skin and sclerae", "Hepatorenal syndrome, from renal blood flow changes causing rising creatinine"], "ans": 0, "exp": "Correct — A: Confusion/lethargy with elevated ammonia in a cirrhotic patient describes hepatic encephalopathy, from the failing liver's inability to metabolize blood-borne toxins like ammonia. B, C, and D describe different cirrhosis complications with different clinical presentations (fluid accumulation, skin/eye yellowing, and renal failure, respectively)."}, {"q": "A patient with cirrhosis and portal hypertension develops abdominal distention from fluid accumulation in the peritoneal cavity. Which complication is this, and what factors contribute to it?", "opts": ["Ascites; contributed to by portal hypertension, decreased plasma protein concentration, and sodium retention", "Hepatic encephalopathy; contributed to by ammonia accumulation affecting cerebral function accompanied by asterixis noted on neurologic examination", "Jaundice; contributed to by bilirubin accumulation from impaired hepatic conjugation", "Splenomegaly; contributed to by splenic vein pressure alone, unrelated to protein levels"], "ans": 0, "exp": "Correct — A: Peritoneal fluid accumulation in a cirrhotic patient with portal hypertension is ascites, driven by portal hypertension, decreased plasma protein (oncotic pressure), and sodium retention. B, C, and D describe different complications with different mechanisms/presentations."}, {"q": "A patient with decompensated cirrhosis develops massive GI hemorrhage, followed within days by a rapid rise in creatinine and markedly decreased urine output, without evidence of intrinsic kidney damage. Which condition is this, and which type?", "opts": ["Acute tubular necrosis from a nephrotoxic drug, unrelated to the recent GI hemorrhage", "Hepatorenal syndrome, Type 2 (HRS-NAKI), which develops slowly over weeks with ascites", "Hepatorenal syndrome, Type 1 (HRS-AKI), given the rapid onset following GI hemorrhage", "Chronic kidney disease from long-standing hypertension, developing gradually over years"], "ans": 2, "exp": "Correct — C: Rapid renal function decline (within less than 2 weeks) following massive GI hemorrhage in a cirrhotic patient describes Type 1 HRS-AKI. B describes the slower-developing form (associated with ascites/decreased circulating volume, not this rapid post-hemorrhage pattern), and A and D describe different, non-hepatically-driven renal processes."}, {"q": "A patient with jaundice is found to have elevated conjugated bilirubin and elevated urine urobilinogen, with imaging showing a gallstone obstructing the common bile duct. Which type of jaundice is this?", "opts": ["Physiologic jaundice, a benign newborn finding unrelated to bile duct obstruction", "Hemolytic jaundice, from excess red blood cell destruction overwhelming liver conjugation as classically seen in chronic hemolytic sickle cell disease", "Obstructive jaundice (extrahepatic), from bile duct obstruction causing bilirubin to accumulate proximal to the blockage", "Jaundice unrelated to bilirubin metabolism, arising instead from elevated liver enzymes"], "ans": 2, "exp": "Correct — C: Jaundice from a gallstone obstructing the common bile duct is extrahepatic obstructive jaundice, with bilirubin accumulating proximal to the obstruction. B is caused by a different mechanism (excess RBC destruction, not obstruction), and A and D do not match this adult, obstruction-related presentation."}, {"q": "A patient with sickle cell disease and chronic hemolysis develops jaundice with elevated unconjugated bilirubin, but no evidence of bile duct obstruction. Which type of jaundice is this?", "opts": ["Physiologic jaundice of the newborn, unrelated to chronic hemolysis in an adult patient from immature hepatic bilirubin conjugation enzymes", "Obstructive jaundice, from bile duct blockage that would appear on imaging studies", "Cirrhotic jaundice, from fibrotic liver changes rather than red blood cell breakdown", "Hemolytic jaundice, from RBC destruction exceeding the liver's bilirubin-metabolizing capacity"], "ans": 3, "exp": "Correct — D: Jaundice from chronic hemolysis (as in sickle cell disease) without bile duct obstruction describes hemolytic jaundice, from RBC destruction overwhelming the liver's bilirubin-processing capacity. B, C, and A do not match this hemolysis-driven, non-obstructive mechanism."}, {"q": "A patient with a massive acetaminophen overdose develops rapidly progressive liver failure with hepatic encephalopathy. What is the underlying mechanism of this acute liver failure?", "opts": ["Toxic hepatocyte death from acetaminophen overdose", "Chronic alcohol-related cirrhosis developing over years", "A congenital metabolic disorder", "A slowly progressive autoimmune process"], "ans": 0, "exp": "Correct — A: Acetaminophen overdose causes acute liver failure through direct toxic hepatocyte death, distinct from chronic processes like alcoholic cirrhosis. B, C, and D describe slower, non-acute-overdose-related processes."}, {"q": "A patient with long-standing hepatitis C is found on biopsy to have disorganized lobular architecture, fibrosis, and nodular regeneration. Which condition has developed, and what are its two major downstream complications related to bile and vascular obstruction?", "opts": ["Acute hepatitis; fully reversible within weeks with no lasting architectural changes", "Cirrhosis; bile obstruction causes jaundice, and vascular obstruction causes portal hypertension/varices", "Gallstones; unrelated to hepatitis, forming instead from cholesterol supersaturation", "Pancreatic insufficiency; unrelated to liver histology, causing fat malabsorption instead from autoimmune destruction of pancreatic acinar cells"], "ans": 1, "exp": "Correct — B: Disorganized lobular structure, fibrosis, and nodular regeneration describe cirrhosis (a known long-term consequence of chronic HCV), which causes jaundice via bile obstruction and portal hypertension/varices via vascular obstruction. A, C, and D do not match this described chronic, structural liver change."}, {"q": "A patient with heavy, long-term alcohol use is found to have hepatocytes unable to oxidize fatty acids, synthesize proteins, or clear ammonia, with progressive fibrosis. Which condition and toxic mechanism explain this?", "opts": ["Wilson disease; from copper accumulation impairing hepatocyte mitochondrial function", "Viral hepatitis; from direct viral cytotoxicity rather than a metabolic byproduct", "Primary biliary cholangitis; from autoimmune bile duct destruction with mitochondrial antibodies", "Alcoholic liver disease; from acetaldehyde formation impairing hepatocyte function"], "ans": 3, "exp": "Correct — D: Impaired hepatocyte fatty acid oxidation, protein synthesis, and ammonia clearance with progressive fibrosis in a heavy drinker describes alcoholic liver disease, driven by acetaldehyde (an alcohol metabolism byproduct) impairing hepatocyte function. B, C, and A describe different conditions with different (non-alcohol-related) mechanisms."}, {"q": "A patient with obesity, hypertriglyceridemia, and type 2 diabetes is found to have hepatocyte inflammation on biopsy, beyond simple fat infiltration. Which condition has this patient progressed to, and what is the risk of continued progression?", "opts": ["NASH (nonalcoholic steatohepatitis); risk of progression to liver failure", "Simple NAFLD, with inflammation excluded by definition and only fat infiltration present", "Viral hepatitis, unrelated to metabolic syndrome, caused instead by direct viral injury", "Primary biliary cholangitis, an autoimmune condition targeting intrahepatic bile ducts"], "ans": 0, "exp": "Correct — A: Hepatocyte inflammation (beyond simple fat infiltration) in a patient with metabolic syndrome features describes NASH, which carries a risk of progression to liver failure. B describes an earlier, non-inflammatory stage (fat infiltration alone), and C and D describe unrelated, non-metabolic conditions."}, {"q": "A 55-year-old woman with fatigue and pruritus is found to have elevated alkaline phosphatase and positive mitochondrial autoantibodies, with intrahepatic bile duct destruction on biopsy. Which condition is this?", "opts": ["Secondary biliary cirrhosis", "Primary biliary cholangitis", "Viral hepatitis A", "Acute pancreatitis"], "ans": 1, "exp": "Correct — B: Mitochondrial autoantibodies with intrahepatic bile duct destruction describe primary biliary cholangitis, an autoimmune disease. A involves extrahepatic obstruction (e.g., from gallstones/tumors) rather than a primary intrahepatic autoimmune process, and C and D describe unrelated conditions."}, {"q": "A patient with longstanding gallstones causing chronic common bile duct obstruction develops jaundice, pruritus, and eventually cirrhosis. Which condition is this, and what happens if the obstruction is relieved?", "opts": ["Secondary biliary cirrhosis; relieving the obstruction alleviates jaundice/pruritus, though continued obstruction leads to cirrhosis/liver failure", "Primary biliary cholangitis; an autoimmune process unrelated to gallstone obstruction", "Acute viral hepatitis; unrelated to bile duct obstruction, resolving within weeks", "Hemolytic jaundice; unrelated to bile duct obstruction, from excess red cell breakdown"], "ans": 0, "exp": "Correct — A: Chronic bile duct obstruction from gallstones causing jaundice, pruritus, and eventual cirrhosis describes secondary biliary cirrhosis; relieving the obstruction can alleviate symptoms, but continued obstruction leads to progressive cirrhosis/liver failure. B is a distinct primary autoimmune process (not gallstone-driven), and C and D describe unrelated mechanisms."}, {"q": "A 65-year-old man with dysphagia and chest pain is found on endoscopy to have an esophageal mass. Biopsy reveals adenocarcinoma arising in a background of Barrett esophagus. What does this progression illustrate?", "opts": ["A cancer unrelated to chronic reflux, arising instead from chronic H. pylori infection causing chronic gastritis rather than any glandular metaplasia", "A sudden, unpredictable cancer with no identifiable dysplastic precursor lesion", "The precancerous pathway of Barrett esophagus progressing through intestinal metaplasia to dysplasia to adenocarcinoma", "A squamous cell cancer unrelated to metaplasia, arising from chronic alcohol use"], "ans": 2, "exp": "Correct — C: Adenocarcinoma arising from Barrett esophagus illustrates the established precancerous pathway (intestinal metaplasia → dysplasia → adenocarcinoma), often related to chronic GERD. B, A, and D contradict this well-established, reflux-related precancerous sequence."}, {"q": "A 70-year-old man with chronic H. pylori infection and a diet high in salt and nitrates develops weight loss, upper abdominal pain, and anemia. Endoscopy reveals a mass in the prepyloric antrum. Which cancer is most likely, and why did symptoms appear so late?", "opts": ["Gastric adenocarcinoma; symptoms typically develop only after the tumor has penetrated the stomach wall", "Esophageal cancer; symptoms always appear early, before any local tissue invasion", "Colorectal cancer; unrelated to H. pylori, arising instead from adenomatous polyps", "Pancreatic cancer; unrelated to dietary nitrates, driven mainly by chronic pancreatitis and typically presenting instead with painless jaundice"], "ans": 0, "exp": "Correct — A: H. pylori infection, high salt/nitrate intake, and a prepyloric antral mass with weight loss/pain/anemia describe gastric adenocarcinoma, whose clinical manifestations classically develop only after the tumor has penetrated the stomach wall. B, C, and D describe different cancers with different risk factors and presentations."}, {"q": "A patient with a known history of familial adenomatous polyposis (FAP) undergoes colonoscopy revealing numerous colonic polyps and an early adenocarcinoma. What does this case illustrate about colorectal cancer risk?", "opts": ["Polyps have no relationship to cancer development, remaining permanently benign", "FAP has no relationship to colorectal cancer risk, causing only benign polyp growth", "Colorectal cancer is always sporadic, since inherited syndromes like FAP do not exist", "FAP is an inherited form of colorectal cancer, and preexisting numerous polyps are highly associated with adenocarcinoma development"], "ans": 3, "exp": "Correct — D: This case illustrates that FAP is a recognized inherited form of colorectal cancer, and the presence of numerous polyps is strongly associated with adenocarcinoma development. B, C, and A contradict the well-established genetic and polyp-related risk factors for CRC."}]}, {"title": "Alterations of Digestive Function in Children", "code": "Chapter 42", "color": "c10", "subtitle": "Congenital & Acquired Motility Disorders • Malabsorption/Malnutrition • Pediatric Diarrhea • Pediatric Liver Disease", "general": [{"q": "Cleft lip and cleft palate are associated with which risk factors?", "opts": ["Only paternal smoking during the periconceptional period", "Only maternal age over 40 at the time of conception", "Multiple gene-environmental interactions and deficiency of B vitamins", "No known risk factors have been identified, since the cause is entirely random"], "ans": 2, "exp": "Correct — C: Cleft lip/palate are associated with multiple gene-environmental interactions and B vitamin deficiency. B, A, and D do not match the described risk factors."}, {"q": "What is esophageal atresia (EA), and what complication can occur if the infant feeds?", "opts": ["A benign variant requiring no monitoring, since the esophagus connects normally to the stomach provided the infant is always fed in an upright position", "A condition where the esophagus is abnormally narrow; feeding causes only mild discomfort", "A condition where the esophagus ends in a blind pouch; feeding can cause drooling, regurgitation, or aspiration into the lungs", "A condition limited to the stomach, causing outlet obstruction rather than feeding difficulty"], "ans": 2, "exp": "Correct — C: EA is a blind-ending esophageal pouch (with or without a tracheoesophageal fistula); as the pouch fills with secretions/milk, drooling, regurgitation, or aspiration can occur. B, A, and D misstate this serious congenital anomaly."}, {"q": "Infantile hypertrophic pyloric stenosis (IHPS) is caused by which mechanism?", "opts": ["Excess bile production refluxing backward through an intact pyloric sphincter", "A congenital absence of the pylorus, leaving the stomach to drain unobstructed that becomes apparent during the first weeks of life", "Hypertrophy of the circular muscles of the pyloric sphincter, obstructing the pyloric outlet", "A viral infection of the duodenum causing transient inflammatory narrowing"], "ans": 2, "exp": "Correct — C: IHPS is obstruction of the pyloric outlet from hypertrophy of the pyloric sphincter's circular muscles. B, A, and D do not describe this specific hypertrophic mechanism."}, {"q": "What happens in intestinal malrotation that can lead to volvulus?", "opts": ["A tumor obstructs the bowel lumen, unrelated to fetal mesenteric attachment", "The intestine develops with extra fixation points that make twisting impossible", "The colon fails to develop at all, leaving the ileum to open directly to the anus", "The small intestine lacks a normal posterior attachment during fetal development, allowing the bowel to twist on itself"], "ans": 3, "exp": "Correct — D: In malrotation, the small intestine lacks a normal posterior attachment, allowing volvulus (bowel twisting), which can partially or completely occlude the GI tract and its blood vessels. B, C, and A misstate this congenital mechanism."}, {"q": "Where does Meckel diverticulum usually occur, and what does it involve?", "opts": ["The colon; it involves only the mucosal layer without deeper wall structures", "The ileum; it is a congenital malformation involving all layers of the small intestinal wall", "The esophagus; it involves only the muscularis layer near the gastroesophageal junction where it connects to the trachea via a fistula", "The stomach; it involves only the serosal surface without ectopic tissue"], "ans": 1, "exp": "Correct — B: Meckel diverticulum is a congenital full-thickness malformation of the small intestinal wall, usually occurring in the ileum. A, C, and D misstate its location and/or the extent of wall involvement."}, {"q": "Hirschsprung disease is caused by which underlying defect?", "opts": ["A malformation of the parasympathetic nervous system in a colonic segment needed for peristalsis, resulting in obstruction", "An overgrowth of parasympathetic ganglion cells causing uncoordinated hypermotility", "A viral infection of the colon causing transient inflammatory megacolon", "A dietary deficiency of fiber causing chronic functional constipation"], "ans": 0, "exp": "Correct — A: Hirschsprung disease (congenital aganglionic megacolon) results from a parasympathetic nervous system malformation in a colonic segment, impairing peristalsis and causing obstruction. B, C, and D misstate this congenital neurologic mechanism."}, {"q": "What characterizes idiopathic intestinal pseudo-obstruction?", "opts": ["A condition that always resolves within 24 hours once a mechanical lesion is removed", "A true mechanical obstruction from a tumor visible on abdominal imaging studies", "Repetitive or continuous symptoms of obstruction without an actual obstructing lesion, possibly from enteric nerve/muscle atrophy", "A condition exclusively caused by dietary fiber excess irritating the bowel wall"], "ans": 2, "exp": "Correct — C: Idiopathic intestinal pseudo-obstruction produces obstruction-like symptoms without an actual obstructing lesion, potentially from enteric nerve/muscle atrophy. B, A, and D misstate this functional (non-mechanical) condition."}, {"q": "What is distal intestinal obstruction syndrome (DIOS), and what conditions commonly cause it?", "opts": ["A condition seen only in adults over 80 with age-related colonic atony", "A condition caused only by excess fluid intake diluting intestinal secretions", "A benign condition unrelated to intestinal contents, caused by colonic muscle weakness", "Abnormally thick intestinal contents obstructing the lumen; commonly caused by cystic fibrosis, pancreatic enzyme deficiency, and dehydration"], "ans": 3, "exp": "Correct — D: DIOS (formerly meconium ileus equivalent) results from abnormally thick intestinal contents obstructing the lumen, commonly from cystic fibrosis, pancreatic enzyme deficiency, or dehydration. B, C, and A misstate this condition's cause."}, {"q": "What causes meconium ileus (MI) in newborns?", "opts": ["Excess fetal digestive enzyme production thinning intestinal secretions prematurely", "A thick, sticky plug of intestinal secretions and amniotic waste products, usually from lack of fetal digestive enzymes, obstructing the intestine", "A dietary issue in the newborn after birth, unrelated to fetal enzyme production", "A maternal infection transmitted to the fetus, unrelated to digestive enzyme levels"], "ans": 1, "exp": "Correct — B: Meconium ileus results from a thick, sticky intestinal plug (from lack of fetal digestive enzymes, often related to cystic fibrosis) obstructing the newborn intestine. A, C, and D misstate this newborn condition's cause."}, {"q": "Why are infants particularly susceptible to GERD?", "opts": ["Infants exclusively eat solid foods that pass slowly through an immature esophagus well before the lower esophageal sphincter fully matures", "Infants have a hypertonic, overly mature LES that rarely allows any reflux", "The gastroesophageal sphincter is immature, their diet is liquid, and they are seldom upright", "Infants are always upright after feeding, minimizing any reflux tendency"], "ans": 2, "exp": "Correct — C: Infant susceptibility to GERD relates to sphincter immaturity, a liquid diet, and frequent non-upright positioning. B, A, and D contradict these described contributing factors."}, {"q": "What is intussusception, and where does it most commonly occur?", "opts": ["A twisting of the entire colon around its mesenteric axis", "Telescoping of a proximal intestinal segment into a distal segment, most commonly at the ileocecal junction", "A congenital absence of a bowel segment present from early fetal development affecting the jejunum and ileum in roughly equal proportion", "A tumor causing external compression of the bowel from outside the lumen"], "ans": 1, "exp": "Correct — B: Intussusception is telescoping of a proximal bowel segment into a distal segment, most commonly at the ileocecal junction, causing obstruction. A, C, and D misstate this specific telescoping mechanism and typical location."}, {"q": "At what age is appendicitis common in children, and how might presentation differ from adults?", "opts": ["Common only in infants under 1 year, who present identically to school-age children with an identical rate of perforation and complication", "Common in children 10-11 years old; presentation may differ from adults, especially in younger children", "Never occurs in children, being exclusively a disease of adults over 40", "Common only after age 18, rarely occurring in the pediatric population at all"], "ans": 1, "exp": "Correct — B: Appendicitis is common in children 10-11 years old, though presentation may differ from the classic adult pattern, especially in younger children. A, C, and D misstate the age pattern described."}, {"q": "How does cystic fibrosis affect the GI tract and pancreas?", "opts": ["It only affects the respiratory system, sparing pancreatic and intestinal function", "It has no effect on the GI tract or pancreas, causing only chronic lung infections", "It involves mucosal chloride/sodium ion channel dysfunction, causing pancreatic enzyme deficiency and maldigestion", "It causes excess pancreatic enzyme production, leading to intestinal enzyme overload overwhelming the small intestine's normal digestive capacity"], "ans": 2, "exp": "Correct — C: CF involves chloride/sodium ion channel dysfunction affecting many organs, including the GI tract and pancreas, causing pancreatic enzyme deficiency and maldigestion. B, A, and D understate or misstate CF's GI/pancreatic involvement."}, {"q": "Celiac disease (CD) is caused by which mechanism, and what is the consequence?", "opts": ["Hypersensitivity to gluten with autoimmune injury and loss of villous epithelium, causing malabsorption and growth failure", "A bacterial infection of the small intestine causing acute inflammatory diarrhea", "A congenital malformation of the colon present from early fetal development", "A vitamin B12 deficiency alone, unrelated to gluten exposure or autoimmunity"], "ans": 0, "exp": "Correct — A: Celiac disease is caused by gluten hypersensitivity with autoimmune injury and villous epithelium loss, resulting in malabsorption and growth failure. B, C, and D misstate celiac disease's actual immune-mediated mechanism."}, {"q": "What is the difference between kwashiorkor and marasmus?", "opts": ["Both terms describe identical nutritional deficiencies limited to dietary fat intake", "Kwashiorkor is a carbohydrate deficiency; marasmus is an isolated protein deficiency", "Kwashiorkor is severe protein deficiency; marasmus is deficiency of all dietary nutrients, including carbohydrates", "Neither term relates to pediatric malnutrition, both describing adult malabsorption instead and instead describing a form of chronic renal protein loss"], "ans": 2, "exp": "Correct — C: Kwashiorkor is severe protein deficiency, while marasmus is deficiency of all dietary nutrients (including carbohydrates) — two distinct forms of severe pediatric malnutrition. B, A, and D reverse or misstate these definitions."}, {"q": "What is faltering growth (failure to thrive, FTT), and what factors contribute to it?", "opts": ["A multifactorial condition with biologic, psychosocial, and environmental contributions, resulting in inadequate growth/development", "A condition caused exclusively by a single identifiable genetic mutation", "A condition unrelated to any illness, arising purely from parental neglect", "A normal variant requiring no evaluation, since growth naturally varies widely"], "ans": 0, "exp": "Correct — A: FTT is a multifactorial condition (biologic, psychosocial, environmental factors, with or without underlying illness) resulting in inadequate growth and development. B, C, and D misstate its multifactorial nature and clinical significance."}, {"q": "Necrotizing enterocolitis (NEC) is thought to result from which combination of factors, and in which population is it most common?", "opts": ["A congenital heart defect alone; most common in full-term infants with normal birth weight, unlike the immature premature gut", "Excess dietary fiber; most common in term infants receiving early solid food introduction", "A viral infection alone; most common in adolescents with prior abdominal surgery", "Immaturity, infection, stress, and anoxia of the bowel wall; most common in premature infants"], "ans": 3, "exp": "Correct — D: NEC is an ischemic/inflammatory neonatal disorder thought to result from bowel wall immaturity, infection, stress, and anoxia, particularly affecting premature infants. B, C, and A misstate the contributing factors and/or affected population."}, {"q": "What is the most common cause of diarrhea in infants and children?", "opts": ["Viral or bacterial enterocolitis", "Chronic pancreatitis", "Gallstones", "Peptic ulcer disease"], "ans": 0, "exp": "Correct — A: Pediatric diarrhea (three or more watery/loose stools in 24 hours) is commonly caused by viral or bacterial enterocolitis. B, C, and D are not the common causes of pediatric diarrhea described."}, {"q": "What is primary lactose intolerance, and what type of diarrhea does it cause?", "opts": ["Inability to digest milk sugar from lactase deficiency, causing osmotic diarrhea", "An allergy to milk protein causing immune-mediated secretory diarrhea", "A structural malformation of the intestine present since early fetal development", "A condition unrelated to any enzyme deficiency, caused instead by gluten sensitivity"], "ans": 0, "exp": "Correct — A: Primary lactose intolerance is lactase enzyme deficiency preventing lactose digestion, causing osmotic diarrhea from unabsorbed lactose drawing fluid into the bowel. B, C, and D misstate this enzyme-deficiency mechanism."}, {"q": "What is the difference between physiologic and pathologic jaundice of the newborn?", "opts": ["Physiologic jaundice is always more severe than pathologic jaundice, requiring phototherapy", "Physiologic jaundice is mild hyperbilirubinemia that subsides in 1-2 weeks; pathologic jaundice is severe hyperbilirubinemia that can cause kernicterus (brain damage)", "Both types cause identical, severe brain damage requiring exchange transfusion", "Neither type is related to bilirubin levels, arising instead from hepatic enzyme deficiency"], "ans": 1, "exp": "Correct — B: Physiologic jaundice is mild, self-resolving hyperbilirubinemia, while pathologic jaundice is severe hyperbilirubinemia that risks kernicterus (bilirubin-induced brain damage). A, C, and D reverse or misstate this important clinical distinction."}, {"q": "Biliary atresia (BA) is best described as:", "opts": ["An acquired adult condition unrelated to congenital anatomy, from gallstone obstruction", "A benign, self-resolving newborn condition requiring no treatment or surgical intervention that resolves completely within the newborn's first month", "A congenital malformation of the bile ducts obstructing bile flow, causing jaundice, cirrhosis, and liver failure", "A condition limited to the pancreas, causing enzyme deficiency rather than jaundice"], "ans": 2, "exp": "Correct — C: Biliary atresia is a congenital bile duct malformation obstructing bile flow, leading to jaundice, cirrhosis, and liver failure if untreated. B, A, and D understate or misstate this serious congenital hepatobiliary condition."}, {"q": "Which hepatitis virus is the most common cause of childhood hepatitis, and how are chronic hepatitis B/C usually acquired in children?", "opts": ["Hepatitis B is most common in childhood; HAV is acquired via maternal transmission", "Hepatitis A is most common in childhood; chronic HBV/HCV usually occur via maternal transmission", "Hepatitis C is most common in childhood; HAV is acquired via maternal transmission", "No hepatitis virus commonly affects children, since maternal antibodies confer full protection for roughly the first six months of life"], "ans": 1, "exp": "Correct — B: Hepatitis A is the most common form of childhood (acute) hepatitis, while chronic HBV/HCV in children usually result from maternal transmission. A, C, and D misstate these patterns."}, {"q": "What is the most common cause of portal hypertension in children, and what is its most common sign?", "opts": ["Portal vein thrombosis (from extrahepatic obstruction); splenomegaly is the most common sign", "Cirrhosis, which is common in children; jaundice is the most common presenting sign from long-standing chronic viral hepatitis infection", "A dietary deficiency; abdominal distention is the most common p ing instead from infection"], "ans": 0, "exp": "Correct — A: This case illustrates that portal vein thrombosis (extrahepatic obstruction) is the most common cause of pediatric portal hypertension, with splenomegaly as the most common associated sign — distinct from the adult pattern where cirrhosis predominates. B, C, and D contradict this described pediatric-specific pattern."}, {"q": "A child with hepatosplenomegaly, cataracts, and failure to thrive is found to have galactose accumulation in the blood after milk ingestion. Which inherited metabolic disorder is most likely responsible for this liver damage?", "opts": ["Cystic fibrosis", "Wilson disease", "Fructosemia", "Galactosemia"], "ans": 3, "exp": "Correct — D: Galactose accumulation after milk ingestion causing hepatosplenomegaly, cataracts, and failure to thrive describes galactosemia, one of the inherited metabolic disorders causing pediatric liver damage. B and C describe different metabolic disorders (copper accumulation; fructose-triggered) with different triggers, and A describes an unrelated genetic disease."}]}];
const state={scores:[],answered:[]};
CHAPTERS.forEach(()=>{state.scores.push({c:0,t:0});state.answered.push([]);});

function buildChapter(ci){
  const ch=CHAPTERS[ci];
  const el=document.getElementById('ch'+ci);
  const totalQ=ch.general.length+ch.clinical.length;
  let html=`<div class="ch-header" data-ch="${ci}"><span class="ch-tag">${ch.code}</span><h2>${ch.title}</h2><p>${ch.subtitle}</p></div>`;
  html+=`<div class="score-bar" id="sb${ci}"><div class="score-stat"><div class="val" id="sc${ci}">0/${totalQ}</div><div class="lbl">score</div></div><div class="score-divider"></div><div class="score-stat"><div class="val" id="pct${ci}">—</div><div class="lbl">correct</div></div><div class="score-divider"></div><div class="score-stat"><div class="val" id="ans${ci}">0</div><div class="lbl">answered</div></div><div class="progress-wrap"><div class="progress-label">Progress</div><div class="progress-track"><div class="progress-fill" id="prog${ci}"></div></div></div><button class="reset-btn" onclick="resetChapter(${ci})">↺ Reset</button></div>`;
  html+=`<div class="section-divider"><div class="line"></div><div class="label">General knowledge — ${ch.general.length} questions</div><div class="line"></div></div>`;
  ch.general.forEach((q,qi)=>{html+=buildQ(ci,qi,q,'G');});
  html+=`<div class="section-divider"><div class="line"></div><div class="label">Clinical scenarios — ${ch.clinical.length} questions</div><div class="line"></div></div>`;
  ch.clinical.forEach((q,qi)=>{html+=buildQ(ci,qi+ch.general.length,q,'C');});
  el.innerHTML=html;
}

function buildQ(ci,gIdx,q,type){
  const badge=type==='C'?'<span class="q-badge badge-clinical">Clinical scenario</span>':'<span class="q-badge badge-general">General knowledge</span>';
  const letters=['A','B','C','D'];
  const opts=q.opts.map((o,oi)=>`<button class="opt-btn" id="opt_${ci}_${gIdx}_${oi}" onclick="answer(${ci},${gIdx},${oi},${q.ans},${q.opts.length})"><span class="opt-letter">${letters[oi]}.</span><span>${o}</span></button>`).join('');
  return `<div class="q-card" id="qc_${ci}_${gIdx}"><div class="q-meta">${badge}<span class="q-num">Q${gIdx+1}</span></div><div class="q-text">${q.q}</div><div class="options">${opts}</div><div class="explanation" id="exp_${ci}_${gIdx}">${q.exp.replace(/^Correct\s*—\s*([A-D]):\s*/, '<strong>Correct answer: $1.</strong> ')}</div></div>`;
}

function answer(ci,gIdx,chosen,correct,numOpts){
  if(state.answered[ci].includes(gIdx))return;
  state.answered[ci].push(gIdx);
  for(let i=0;i<numOpts;i++){const b=document.getElementById(`opt_${ci}_${gIdx}_${i}`);if(b)b.disabled=true;}
  const cb=document.getElementById(`opt_${ci}_${gIdx}_${chosen}`);
  const rb=document.getElementById(`opt_${ci}_${gIdx}_${correct}`);
  if(chosen===correct){cb.classList.add('correct');state.scores[ci].c++;}
  else{cb.classList.add('wrong');rb.classList.add('reveal');}
  state.scores[ci].t++;
  const e=document.getElementById(`exp_${ci}_${gIdx}`);
  if(e)e.style.display='block';
  updateScore(ci);
}

function updateScore(ci){
  const ch=CHAPTERS[ci];
  const total=ch.general.length+ch.clinical.length;
  const s=state.scores[ci];
  document.getElementById(`sc${ci}`).textContent=`${s.c}/${total}`;
  document.getElementById(`ans${ci}`).textContent=s.t;
  const pct=s.t>0?Math.round((s.c/s.t)*100):null;
  document.getElementById(`pct${ci}`).textContent=pct!==null?pct+'%':'—';
  document.getElementById(`prog${ci}`).style.width=Math.round((s.t/total)*100)+'%';
}

function resetChapter(ci){
  state.scores[ci]={c:0,t:0};
  state.answered[ci]=[];
  buildChapter(ci);
}

function showChapter(idx){
  document.querySelectorAll('.chapter').forEach((s,i)=>s.classList.toggle('active',i===idx));
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',i===idx);b.setAttribute('aria-selected',i===idx?'true':'false');});
  window.scrollTo({top:0,behavior:'smooth'});
}

CHAPTERS.forEach((_,i)=>buildChapter(i));
</script>
