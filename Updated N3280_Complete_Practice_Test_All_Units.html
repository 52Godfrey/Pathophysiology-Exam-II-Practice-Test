vironmental"], "ans": 0, "exp": "Correct — A: Congenital abnormalities of the kidney and urinary tract are related to gene alterations in about 50% of cases, ranging from minor to life-incompatible severity. B, C, and D do not match this described proportion."}, {"q": "What is the difference between a hypoplastic and a dysplastic kidney?", "opts": ["They are identical conditions with no distinguishing structural features", "A hypoplastic kidney is small with a decreased number of nephrons; a dysplastic kidney results from abnormal differentiation of renal tissues", "A hypoplastic kidney has abnormal tissue differentiation; a dysplastic kidney is simply small", "Neither condition affects nephron number or overall tissue structure"], "ans": 1, "exp": "Correct — B: B hypoplastic kidney is small with fewer nephrons, while a dysplastic kidney results from abnormal differentiation of renal tissue — two distinct structural abnormalities. A, C, and D mischaracterize or reverse these definitions."}, {"q": "Polycystic kidney disease can follow which inheritance patterns, and what are its consequences?", "opts": ["It is never inherited and always results from toxin exposure", "Only X-linked inheritance; causes no renal dysfunction whatsoever", "Only mitochondrial inheritance; causes only cardiac muscle disease and skeletal myopathy, sparing the kidneys entirely in every affected individual studied", "Autosomal dominant or autosomal recessive; causes multiple kidney cysts that interfere with renal function and cause hypertension"], "ans": 3, "exp": "Correct — D: Polycystic kidney disease can be autosomal dominant or autosomal recessive, causing multiple renal cysts that impair kidney function and cause hypertension. B, C, and A misstate the inheritance pattern(s) and consequences."}, {"q": "Renal agenesis is defined as:", "opts": ["An enlarged kidney containing an excess number of nephrons", "The absence of one or both kidneys", "A kidney of normal structure but located in an abnormal position", "A benign renal tumor composed of fat, muscle, and vascular tissue"], "ans": 1, "exp": "Correct — B: Renal agenesis is the absence of one or both kidneys, occurring in isolation or with other disorders. A, C, and D describe different, unrelated renal conditions."}, {"q": "Ureteropelvic junction (UPJ) obstruction is caused by which mechanisms, and what complications can result?", "opts": ["Smooth muscle or urothelial malformation, or secondary scarring from corrective surgery; complications include hydronephrosis and infection", "Only bacterial infection, with no structural or anatomic cause", "Only excess urine dilution, with no structural involvement at all", "It has no known complications when left surgically uncorrected"], "ans": 0, "exp": "Correct — A: UPJ obstruction results from smooth muscle/urothelial malformation or secondary surgical scarring, with hydronephrosis and infection as recognized complications. B, C, and D misstate the cause and/or dismiss the real complications."}, {"q": "Hypospadias is defined as:", "opts": ["An acquired condition seen only in adult men following prostate or urethral surgery, never present congenitally at birth in any male infant regardless of gestational age", "A condition affecting only the female urethra and labia", "A malignant tumor arising from the urethral epithelium", "A congenital anomaly in which the urethral meatus can be located anywhere on the ventral surface of the glans, penile shaft, scrotal midline, or perineum"], "ans": 3, "exp": "Correct — D: Hypospadias is a congenital anomaly with the urethral meatus located somewhere along the ventral surface — from the glans to the perineum. B, C, and A misstate this male congenital condition."}, {"q": "How do epispadias and bladder exstrophy relate to each other?", "opts": ["Both conditions occur only in females, sparing the male urethra", "They are entirely unrelated conditions with separate embryologic origins", "Epispadias is more severe than bladder exstrophy in every case", "They are congenital malformations expressed to different degrees, with epispadias involving failure of the dorsal urethra to form a tube, and exstrophy involving separated pubic bones with bladder eversion"], "ans": 3, "exp": "Correct — D: Epispadias and bladder exstrophy represent a spectrum of the same congenital malformation, with epispadias being a failure of the dorsal urethra to tubularize, and exstrophy being the more severe form with separated pubic bones and bladder eversion. B, C, and A mischaracterize this relationship."}, {"q": "What are urethral valves and polyps, and what effect do they have?", "opts": ["Structures found only within the kidney, never in the urethra", "Acquired tumors seen only in elderly men with prostatic disease", "Structures that improve urine flow by widening the urethral lumen", "Congenital formations of tissue that block the urethra"], "ans": 3, "exp": "Correct — D: Urethral valves and polyps are congenital tissue formations that block the urethra. B, C, and A misstate their nature, location, or effect."}, {"q": "Acute poststreptococcal glomerulonephritis in children usually follows infection by which organism, and what is the resulting glomerular effect?", "opts": ["Staphylococcus aureus; an organism causing no glomerular changes", "Nephritic strains of group A β-hemolytic streptococcus; immune deposits increase glomerular capillary permeability, causing hematuria, proteinuria, edema, hypertension, and renal insufficiency", "Escherichia coli; an organism causing only lower urinary tract infection such as cystitis, not glomerular disease of any kind whatsoever in children or adults regardless of strain virulence factors", "Candida albicans; causing fungal invasion of the glomerular capillaries"], "ans": 1, "exp": "Correct — B: Acute poststreptococcal glomerulonephritis follows infection by nephritic strains of group A β-hemolytic strep, with immune-mediated injury increasing glomerular permeability and causing the classic hematuria/proteinuria/edema/hypertension/renal insufficiency picture. A, C, and D name organisms not responsible for this specific postinfectious glomerular condition."}, {"q": "IgA nephropathy involves autoimmune deposition of which immunoglobulin, and what is the related systemic vasculitis form called?", "opts": ["IgE; the related autoimmune form is minimal change disease", "IgG; the related autoimmune form is Goodpasture syndrome", "IgM; the related autoimmune form is lupus nephritis", "IgA; the related systemic vasculitis form is IgA vasculitis (Henoch-Schönlein purpura nephritis)"], "ans": 3, "exp": "Correct — D: IgA nephropathy involves autoimmune IgA deposition causing glomerular injury/gross hematuria, and its systemic vasculitis form is IgA vasculitis (Henoch-Schönlein purpura nephritis). B, C, and A name different immunoglobulins/conditions not matching IgA nephropathy's description."}, {"q": "Which two conditions are the most common causes of nephrotic syndrome in children?", "opts": ["Acute pyelonephritis and cystitis, both infectious rather than glomerular conditions", "Diabetic nephropathy and lupus nephritis, both secondary causes seen mainly in adults", "Renal cell carcinoma and Wilms tumor, both solid renal neoplasms rather than glomerular disease", "Minimal change nephropathy and focal segmental glomerulosclerosis"], "ans": 3, "exp": "Correct — D: Minimal change nephropathy and focal segmental glomerulosclerosis are the most common causes of nephrotic syndrome in children. B describes adult-predominant secondary/systemic causes, and C and A describe unrelated tumor/infectious conditions."}, {"q": "Hemolytic uremic syndrome (HUS) is characterized by which triad, and what is the most common associated cause?", "opts": ["Fever, rash, and joint pain; associated only with viral infection", "Hypertension, hyperlipidemia, and edema; associated with dietary sodium excess", "Hemolytic anemia, thrombocytopenia, and possible acute renal failure; most commonly associated with Shiga toxin from E. coli infection and diarrhea", "Proteinuria, hematuria, and hypertension; associated with a preceding poststreptococcal throat infection rather than Shiga toxin exposure or diarrheal illness"], "ans": 2, "exp": "Correct — C: HUS is an acute thrombotic microangiopathy with hemolytic anemia, thrombocytopenia, and possible acute renal failure, typically following Shiga toxin-producing E. coli infection and diarrhea. B, A, and D describe different symptom clusters/causes not matching HUS."}, {"q": "Nephroblastoma (Wilms tumor) typically presents as what kind of finding, and in what age range?", "opts": ["A bladder mass typically found in adults over the age of 60", "A painful bone lesion typically seen in adolescents", "A solid, smooth abdominal mass, presenting between birth and 5 years of age", "A solitary pulmonary nodule discovered incidentally in newborns"], "ans": 2, "exp": "Correct — C: Wilms tumor is an embryonal kidney tumor usually presenting as a solid, smooth abdominal mass between birth and 5 years of age. B, A, and D misstate the typical presentation, location, and age range."}, {"q": "What is the prognosis for nephroblastoma with appropriate treatment?", "opts": ["Survival is uniformly poor regardless of the treatment approach used or how early it is started in the disease course, unlike most pediatric solid tumors", "Survival is high after treatment with surgery and combination drug therapy (with chemotherapy/radiation/stem cell therapy for advanced disease)", "No effective treatment currently exists for this embryonal tumor", "Treatment is never indicated in children under 5 years of age"], "ans": 1, "exp": "Correct — B: Survival after treatment (surgery, combination drug therapy, and for advanced disease, chemotherapy/radiation/stem cell therapy) is high for nephroblastoma. A, C, and D understate the generally favorable prognosis with treatment."}, {"q": "What distinguishes cystitis from pyelonephritis in terms of infection location?", "opts": ["Cystitis involves the bladder alone; pyelonephritis involves infection ascending to one or both kidneys", "Cystitis always involves the kidneys; pyelonephritis is limited to the urethra", "Both terms describe the exact same anatomic infection location", "Neither condition is caused by bacteria ascending the urinary tract"], "ans": 0, "exp": "Correct — A: Cystitis is bladder-only infection, while pyelonephritis involves infection that has ascended to the kidney(s). B, C, and D mischaracterize this important anatomic distinction."}, {"q": "Vesicoureteral reflux (VUR) increases the risk for which condition, and how is it classified?", "opts": ["Renal cell carcinoma; a tumor process always classified as primary", "Wilms tumor; an embryonal tumor that is typically unilateral", "Hypospadias; a congenital urethral anomaly that is always strictly unilateral in every presentation", "Pyelonephritis; can be unilateral or bilateral, and primary or secondary"], "ans": 3, "exp": "Correct — D: VUR (retrograde flow of bladder urine into the kidney/ureter) increases pyelonephritis risk and can be classified as unilateral or bilateral, and primary or secondary. B, C, and A misstate the associated risk and/or classification."}, {"q": "At what age is urinary incontinence in a child considered abnormal, and what factors can contribute to it?", "opts": ["Beyond age 1, since all children should achieve continence by then", "Beyond age 5, when bladder control should have been acquired; contributing factors include maturational delay, UTIs, constipation, and emotional factors", "Beyond age 15, since continence is not expected before adolescence", "Incontinence is always considered abnormal regardless of the child's age"], "ans": 1, "exp": "Correct — B: Urinary incontinence is considered abnormal beyond age 5, the age by which bladder control should be acquired; contributing factors include maturational delay, UTIs, constipation, and physiologic/emotional factors. A, C, and D do not match this established age threshold."}], "clinical": [{"q": "A prenatal ultrasound reveals a small kidney with a decreased number of nephrons in the fetus. Which condition is this, as distinguished from a kidney with abnormal tissue differentiation?", "opts": ["Polycystic kidney disease; multiple cysts are present bilaterally", "Dysplastic kidney; a hypoplastic kidney would instead show only reduced nephron number without any differentiation change", "Renal agenesis; complete absence of both kidneys bilaterally", "Hypoplastic kidney; a dysplastic kidney would instead show abnormal tissue differentiation"], "ans": 3, "exp": "Correct — D: D small kidney with reduced nephron number is a hypoplastic kidney, distinct from a dysplastic kidney (abnormal tissue differentiation). B reverses these definitions, and C and A describe different structural abnormalities (absence; cystic disease) not matching this description."}, {"q": "A newborn is found to have multiple bilateral renal cysts on ultrasound, with a family history of a similar autosomal dominant condition in the father. Which diagnosis is most likely, and what complication should be monitored for?", "opts": ["Polycystic kidney disease; monitor for hypertension and progressive renal function decline", "Renal agenesis; monitor for the complete absence of kidney function only", "Ureteropelvic junction obstruction; monitor for hydronephrosis only", "Wilms tumor; monitor for metastatic spread to the lung and liver"], "ans": 0, "exp": "Correct — A: Bilateral renal cysts with an autosomal dominant family history describe polycystic kidney disease, which causes hypertension and can interfere with renal function over time. B, C, and D describe different, non-cystic congenital or neoplastic conditions."}, {"q": "A male infant is noted at birth to have the urethral meatus located on the underside of the penile shaft rather than at the tip. Which condition is this?", "opts": ["Hypospadias", "Epispadias", "Bladder exstrophy", "Ureteropelvic junction obstruction"], "ans": 0, "exp": "Correct — A: A urethral meatus located on the ventral surface (underside) of the penis, rather than at the glans tip, is hypospadias. B involves the dorsal (not ventral) urethra failing to tubularize, and C and D describe different congenital anomalies."}, {"q": "A newborn is found to have separated pubic bones and the posterior bladder wall exposed and everted through an abdominal wall defect. Which condition is this, and how does it relate to epispadias?", "opts": ["Polycystic kidney disease; a cystic condition of the kidney entirely unrelated to epispadias or bladder wall development", "Hypospadias; a ventral urethral anomaly unrelated to epispadias", "Renal agenesis; absence of a kidney, unrelated to epispadias", "Bladder exstrophy; it is a more severe expression of the same spectrum of congenital malformation as epispadias"], "ans": 3, "exp": "Correct — D: Separated pubic bones with everted posterior bladder wall describes bladder exstrophy, representing a more severe degree of the same congenital malformation spectrum as epispadias (dorsal urethral tube failure). B, C, and A describe unrelated conditions."}, {"q": "A 6-year-old develops dark, cola-colored urine, facial edema, and hypertension about 10 days after a sore throat. Which condition is most likely, and what is the underlying immune mechanism?", "opts": ["Acute poststreptococcal glomerulonephritis; immune complex deposition increases glomerular capillary permeability", "Wilms tumor; caused by proliferation of embryonal renal tissue", "Hemolytic uremic syndrome; caused by Shiga toxin-producing bacteria", "Vesicoureteral reflux; caused by an anatomic valve defect"], "ans": 0, "exp": "Correct — A: Dark urine, edema, and hypertension following a streptococcal throat infection describe acute poststreptococcal glomerulonephritis, caused by immune-complex-mediated injury increasing glomerular permeability. B, C, and D describe different conditions with different triggers/mechanisms not matching this postinfectious presentation."}, {"q": "A 9-year-old presents with recurrent episodes of gross hematuria, often during or shortly after upper respiratory infections, with normal blood pressure and mild proteinuria. Which condition is most likely?", "opts": ["Hemolytic uremic syndrome", "Wilms tumor", "IgA nephropathy", "Bladder exstrophy"], "ans": 2, "exp": "Correct — C: Recurrent gross hematuria associated with URIs is a classic presentation of IgA nephropathy, from autoimmune IgA deposition in the glomerulus. B, A, and D describe different conditions with different characteristic presentations."}, {"q": "A 6-year-old develops palpable purpura on the legs, joint pain, and hematuria following a URI. Which specific form of IgA-related disease does this represent?", "opts": ["IgA vasculitis (Henoch-Schönlein purpura nephritis)", "Minimal change nephropathy, the most common cause of pediatric nephrotic syndrome", "Focal segmental glomerulosclerosis, a scarring lesion of the glomerular tuft", "Diabetic nephropathy, a complication of long-standing hyperglycemia"], "ans": 0, "exp": "Correct — A: Palpable purpura with joint pain and hematuria following a URI describes IgA vasculitis (Henoch-Schönlein purpura nephritis), a systemic vasculitis form of IgA nephropathy. B, C, and D describe different glomerular conditions without this systemic vasculitic presentation."}, {"q": "A 4-year-old presents with periorbital edema, frothy urine, and severe proteinuria, with normal blood pressure and no hematuria. Which two conditions are most likely, given they are the most common causes of this presentation in children?", "opts": ["Renal cell carcinoma or Wilms tumor, both solid renal neoplasms", "Diabetic nephropathy or lupus nephritis, both secondary adult-onset causes", "Minimal change nephropathy or focal segmental glomerulosclerosis", "Acute pyelonephritis or cystitis, both infectious rather than glomerular processes"], "ans": 2, "exp": "Correct — C: Periorbital edema, frothy urine, and severe proteinuria describe nephrotic syndrome, whose most common pediatric causes are minimal change nephropathy and focal segmental glomerulosclerosis. B describes adult-predominant secondary causes, and A and D describe unrelated tumor/infectious conditions."}, {"q": "A 3-year-old develops bloody diarrhea after eating undercooked ground beef, followed several days later by pallor, petechiae, and decreased urine output. Labs show hemolytic anemia, thrombocytopenia, and rising creatinine. Which condition is this, and what toxin is classically implicated?", "opts": ["Hemolytic uremic syndrome; classically associated with Shiga toxin from E. coli", "Acute poststreptococcal glomerulonephritis; associated with a preceding strep infection", "Wilms tumor; associated with proliferation of embryonal renal tissue", "IgA nephropathy; associated with URI"], "ans": 0, "exp": "Correct — A: Bloody diarrhea followed by hemolytic anemia, thrombocytopenia, and acute renal impairment describes HUS, classically associated with Shiga toxin-producing E. coli (as from undercooked beef). B, C, and D describe different conditions with different triggers not matching this presentation."}, {"q": "A 2-year-old is found by a parent to have a firm, non-tender abdominal mass. Imaging reveals a solid renal mass. Which diagnosis is most likely, and what is the expected prognosis with appropriate treatment?", "opts": ["Polycystic kidney disease; a cystic condition with no available treatment", "Renal cell carcinoma; a malignancy with generally poor survival regardless of the treatment approach used", "Nephroblastoma (Wilms tumor); survival is high with surgery and combination drug therapy", "Bladder exstrophy; requires no treatment"], "ans": 2, "exp": "Correct — C: C solid abdominal mass discovered by a parent in a young child is classic for Wilms tumor, which has a high survival rate with treatment (surgery, combination drug therapy, and additional therapies for advanced disease). B, A, and D describe different conditions or misstate the generally favorable prognosis."}, {"q": "A 7-year-old girl has had three episodes of febrile UTI in the past year. Voiding cystourethrogram reveals retrograde flow of urine from the bladder into both ureters. Which condition is this, and what is its significance?", "opts": ["Vesicoureteral reflux (VUR), which increases the risk for pyelonephritis", "Cystitis, which is limited to the bladder with no ureteral reflux", "Wilms tumor, an embryonal mass unrelated to urine flow direction", "Hypospadias, a urethral anomaly unrelated to urine flow direction"], "ans": 0, "exp": "Correct — A: Retrograde urine flow into the ureters, identified on VCUG in a child with recurrent febrile UTIs, describes vesicoureteral reflux, which increases pyelonephritis risk by allowing infected urine to reach the kidneys. B, C, and D do not match this reflux-based finding and its significance."}, {"q": "A 7-year-old boy who has never achieved nighttime bladder control continues to wet the bed several times per week. His parents also note he has chronic constipation. Which factors are relevant to this presentation?", "opts": ["This is not incontinence, since he has never achieved dryness", "Urinary incontinence (nocturnal enuresis) is diagnosed beyond age 5, and constipation is a recognized contributing factor", "Incontinence can only be formally diagnosed after age 12", "Constipation has no established relationship whatsoever to urinary incontinence or bladder dysfunction of any kind in children"], "ans": 1, "exp": "Correct — B: Involuntary urine passage beyond age 5 (here, nocturnal enuresis) is urinary incontinence, and constipation is a recognized contributing factor, along with maturational delay, UTIs, and emotional factors. A, C, and D misstate the age threshold and dismiss the established constipation link."}]}, {"title": "Structure and Function of the Digestive System", "code": "Chapter 40", "color": "c8", "subtitle": "GI Tract Anatomy/Physiology • Digestion & Absorption • Accessory Organs (Liver, Gallbladder, Pancreas) • Tests • Aging", "general": [{"q": "What are the four layers of the GI tract wall, from inside to outside?", "opts": ["Serosa, muscularis, submucosa, mucosa", "Mucosa, submucosa, muscularis, serosa", "Mucosa, muscularis, submucosa, serosa", "Submucosa, mucosa, serosa, muscularis"], "ans": 1, "exp": "Correct — B: From inside to outside, the GI wall layers are mucosa, submucosa, muscularis, and serosa. A reverses the order, and C and D misorder the middle layers."}, {"q": "Which enzyme in saliva initiates carbohydrate digestion?", "opts": ["Trypsin", "Pepsin", "α-amylase", "Lipase"], "ans": 2, "exp": "Correct — C: The digestive component of saliva is α-amylase, which initiates carbohydrate digestion. B, A, and D are enzymes secreted elsewhere (stomach, pancreas) for protein/fat digestion, not salivary carbohydrate digestion."}, {"q": "What are the two phases of swallowing, and which is voluntary?", "opts": ["Buccal phase (involuntary) and pharyngeal phase (voluntary), coordinated by the medullary swallowing center", "Cephalic phase (voluntary) and gastric phase (involuntary), triggered by the sight and smell of food", "Oropharyngeal phase (voluntary) and esophageal phase (involuntary)", "Gastric phase (voluntary) and intestinal phase (involuntary), controlled by secretin and CCK release"], "ans": 2, "exp": "Correct — C: Swallowing has an oropharyngeal phase (voluntary) and an esophageal phase (involuntary), controlled by the swallowing center in the medulla. B and A misstate the mixed voluntary/involuntary nature, and D names phases of gastric secretion, not swallowing."}, {"q": "What is the function of the lower esophageal sphincter?", "opts": ["It prevents air from entering the esophagus during breathing, independent of the swallowing reflex during normal quiet respiration", "It opens to admit food into the stomach and closes to prevent regurgitation back into the esophagus", "It secretes hydrochloric acid to begin protein digestion before food reaches the stomach", "It regulates blood flow to the gastric mucosa to support enzyme secretion"], "ans": 1, "exp": "Correct — B: The LES opens to allow food into the stomach and closes to prevent regurgitation of gastric contents back into the esophagus. A, C, and D misstate its structural/functional role."}, {"q": "Which hormones stimulate gastric emptying, and which delay it?", "opts": ["Gastrin and motilin stimulate emptying; secretin and cholecystokinin delay it", "Secretin and cholecystokinin stimulate emptying; gastrin and motilin delay it", "All four hormones stimulate emptying equally", "None of these hormones affect gastric emptying"], "ans": 0, "exp": "Correct — A: Gastrin and motilin stimulate gastric emptying, while secretin and cholecystokinin delay it (allowing time for intestinal digestion). B reverses these roles, and C and D misstate their effects."}, {"q": "What are the three phases of gastric secretion?", "opts": ["Cephalic, gastric, and intestinal phases", "Oropharyngeal, esophageal, and gastric phases", "Absorptive, digestive, and eliminative phases", "Only one continuous phase exists"], "ans": 0, "exp": "Correct — A: Gastric secretion occurs in the cephalic (anticipation/swallowing), gastric (food in stomach), and intestinal (chyme in intestine) phases. B describes swallowing phases, and C and D do not match the described gastric secretion phases."}, {"q": "What do parietal cells secrete, and what are its functions?", "opts": ["Bicarbonate-rich alkaline fluid, which neutralizes acid entering the duodenum from the stomach", "Pepsinogen, an inactive proenzyme later converted to pepsin to begin protein breakdown", "Hydrochloric acid, which dissolves food fibers, kills microorganisms, and activates pepsin", "Mucus and bicarbonate, which form a protective gel layer over the gastric epithelium"], "ans": 2, "exp": "Correct — C: Parietal cells secrete hydrochloric acid, which dissolves food fibers, kills microorganisms, and activates pepsin (from pepsinogen). B describes chief cell secretion, A describes pancreatic/duodenal secretion, and D describes mucous cell secretion."}, {"q": "What do chief cells secrete, and what is its function?", "opts": ["Gastrin, a hormone secreted by G cells that stimulates parietal cell acid production", "Hydrochloric acid, secreted by parietal cells to dissolve food fibers and kill microorganisms", "Intrinsic factor, secreted by parietal cells to enable vitamin B12 absorption in the ileum", "Pepsinogen, converted to pepsin in the acidic environment to break down proteins"], "ans": 3, "exp": "Correct — D: Chief cells secrete pepsinogen, which is converted to pepsin (which breaks down proteins into polypeptides) by the acidic environment created by HCl. B, C, and A describe secretions from other gastric cell types."}, {"q": "Which substance produced by the stomach is required for vitamin B12 absorption?", "opts": ["Gastroferrin", "Intrinsic factor", "Pepsin", "Mucus"], "ans": 1, "exp": "Correct — B: Intrinsic factor, secreted by the stomach, is needed for vitamin B12 absorption. A facilitates iron absorption instead, and C and D serve different digestive/protective functions."}, {"q": "What are the three segments of the small intestine?", "opts": ["Cecum, colon, and rectum", "Duodenum, jejunum, and ileum", "Esophagus, stomach, and duodenum", "Ascending, transverse, and descending colon"], "ans": 1, "exp": "Correct — B: The small intestine's three segments are the duodenum, jejunum, and ileum. A and D describe large intestine segments, and C mixes upper GI structures that are not small intestine segments."}, {"q": "What is the function of the ileocecal valve?", "opts": ["It emulsifies dietary fat into micelles to prepare it for absorption in the jejunum before chyme ever reaches the ileocecal junction", "It connects the small and large intestines and prevents reflux into the small intestine", "It absorbs vitamin B12 bound to intrinsic factor in the terminal ileum", "It stores and concentrates bile between meals until stimulated by cholecystokinin"], "ans": 1, "exp": "Correct — B: The ileocecal valve connects the small and large intestines and prevents backward flow (reflux) of colonic contents into the small intestine. A, C, and D describe unrelated digestive functions."}, {"q": "What is the function of intestinal villi?", "opts": ["They increase the small intestine's absorptive surface area", "They secrete bile salts synthesized by hepatocytes to emulsify dietary fats", "They store and compact fecal material prior to defecation in the rectum", "They produce insulin and glucagon to regulate blood glucose concentration"], "ans": 0, "exp": "Correct — A: Villi are finger-like projections that increase the absorptive surface area of the small intestinal mucosa. B, C, and D describe functions of other organs/structures."}, {"q": "How do fats reach systemic circulation after absorption, compared with carbohydrates and proteins?", "opts": ["Carbohydrates and proteins diffuse into lacteals and reach circulation via the lymphatic system", "Fats travel via the hepatic portal vein directly to the liver before entering systemic circulation", "Fats diffuse into lacteals (lymphatic vessels) and enter systemic circulation via the lymphatics; carbohydrates/proteins enter villus capillaries and travel via the hepatic portal vein", "Fats are absorbed unchanged as triglycerides without prior emulsification by bile salts"], "ans": 2, "exp": "Correct — C: After micelle formation, fat diffuses into lacteals and reaches systemic circulation via lymphatics, while carbohydrates and proteins enter villus capillaries and travel to the liver via the hepatic portal vein. B, A, and D misstate this distinct fat absorption pathway."}, {"q": "What is the role of bile salts in fat digestion?", "opts": ["They neutralize gastric acid entering the duodenum through bicarbonate secretion", "They break down carbohydrates into monosaccharides via hydrolysis in the duodenum", "They emulsify and hydrolyze fats, incorporating them into water-soluble micelles", "They activate pepsinogen into pepsin within the acidic environment of the stomach"], "ans": 2, "exp": "Correct — C: Bile salts emulsify/hydrolyze fats and incorporate them into water-soluble micelles for absorption. B, A, and D misstate bile salts' primary digestive function."}, {"q": "What is the difference between segmentation and peristalsis in intestinal motility?", "opts": ["Segmentation (circular muscle contractions) mixes chyme; peristalsis (longitudinal muscle movements) propels chyme along the tract", "Segmentation (longitudinal muscle contraction) propels chyme; peristalsis (circular muscle) mixes it which is essentially the reverse of their true physiologic roles", "Both terms describe the identical circular muscle contractions that mix intestinal contents", "Neither segmentation nor peristalsis occurs after the stomach empties into the duodenum"], "ans": 0, "exp": "Correct — A: Segmentation (circular muscle contraction) mixes chyme, while peristalsis (longitudinal muscle movement) propels chyme along the intestinal tract. B reverses these roles, and C and D misstate or dismiss these distinct motility patterns."}, {"q": "What effect does the gastroileal reflex have on intestinal motility?", "opts": ["It only affects the stomach, not the intestine", "It decreases intestinal motility when gastric motility increases", "It has no relationship to gastric motility", "It increases intestinal motility when gastric motility increases"], "ans": 3, "exp": "Correct — D: The gastroileal reflex increases intestinal motility in response to increased gastric motility. B, C, and A misstate this coordinated reflex relationship."}, {"q": "What structures make up the large intestine?", "opts": ["Esophagus, stomach, and duodenum, connected by the lower esophageal and pyloric sphincters, structures that are not part of the large intestine", "Duodenum, jejunum, and ileum, which together form the small intestine proper", "Cecum, appendix, colon (ascending, transverse, descending, sigmoid), rectum, and anal canal", "Liver, gallbladder, and pancreas, the accessory organs that secrete digestive fluids"], "ans": 2, "exp": "Correct — C: The large intestine consists of the cecum, appendix, colon (four segments), rectum, and anal canal. B describes the small intestine, and A and D describe unrelated upper GI or accessory organ structures."}, {"q": "What distinguishes the mucosa of the large intestine from that of the small intestine?", "opts": ["The large intestine mucosa has mucus-secreting cells and folds but no villi, unlike the villi-rich small intestine", "The large intestine has taller, more numerous villi to maximize nutrient absorption", "Both the large and small intestine mucosa contain identical villous, absorptive surfaces each with equivalent absorptive capacity for nutrients", "Neither the large nor small intestine mucosa contains any mucus-secreting goblet cells"], "ans": 0, "exp": "Correct — A: Unlike the small intestine (rich in absorptive villi), the large intestine mucosa has mucus-secreting cells and folds but lacks villi, reflecting its role in water/electrolyte absorption and mucus production rather than nutrient absorption. B, C, and D misstate this distinction."}, {"q": "What triggers the gastrocolic reflex, and what does it cause?", "opts": ["Distention of the rectum with stool; causes relaxation of the internal anal sphincter", "Distention of the duodenum with chyme; triggers secretin release to buffer gastric acid", "Distention of the ileum with chyme; causes mass propulsion of feces to the rectum", "Distention of the gallbladder wall; triggers cholecystokinin-mediated bile release into the duodenum"], "ans": 2, "exp": "Correct — C: Distention of the ileum with chyme triggers the gastrocolic reflex, causing mass propulsion of feces toward the rectum. B, A, and D misstate the trigger and/or the resulting effect."}, {"q": "What happens physiologically when the rectum is distended with feces during defecation?", "opts": ["The external anal sphincter relaxes involuntarily while the internal sphincter stays contracted completely independent of any rectal distention", "Both the internal and external sphincters contract further to actively delay defecation", "Only the internal sphincter responds, contracting further while the external stays relaxed", "The internal anal sphincter relaxes, and if the voluntary external sphincter also relaxes, defecation occurs"], "ans": 3, "exp": "Correct — D: Rectal distention causes the tonically contracted internal anal sphincter to relax; if the voluntarily controlled external sphincter also relaxes, defecation occurs. B, C, and A misstate this two-sphincter reflex/voluntary mechanism."}, {"q": "Which cells of the GI immune system produce defensins and other antimicrobial peptides?", "opts": ["Kupffer cells", "Goblet cells", "Paneth cells", "Chief cells"], "ans": 2, "exp": "Correct — C: Paneth cells produce defensins and other antimicrobial peptides/lysozymes as part of GI immune defense. B, A, and D describe cells with different functions (mucus secretion, hepatic phagocytosis, pepsinogen secretion)."}, {"q": "Where is the largest number of intestinal bacteria found, and which are the most numerous anaerobes?", "opts": ["The duodenum; Candida albicans is the dominant organism due to alkaline pancreatic secretions", "The stomach; Lactobacillus dominates because of the highly acidic gastric environment", "The esophagus; E. coli is most numerous because of frequent oropharyngeal contamination", "The colon; Bacteroides and Firmicutes are the most numerous anaerobes"], "ans": 3, "exp": "Correct — D: The colon harbors the largest intestinal bacterial population, with Bacteroides and Firmicutes as the most numerous anaerobes. B, C, and A misstate the location and/or dominant organisms."}, {"q": "What functions do intestinal bacteria (the microbiome) serve?", "opts": ["Metabolism of bile salts/drugs/hormones, destruction of pathogens, and prevention of pathogen colonization", "They exclusively synthesize vitamin K, with no role in bile salt or drug metabolism", "They primarily compete with host cells for oxygen, with no effect on pathogen colonization rather than metabolizing circulating hormones or drugs", "They exclusively ferment undigested fiber into short-chain fatty acids for colonocyte fuel"], "ans": 0, "exp": "Correct — A: Intestinal bacteria are important for bile salt/drug/hormone metabolism, pathogen destruction, and preventing pathogen colonization. B, C, and D dismiss or misstate these beneficial functions."}, {"q": "What is the sphincter of Oddi, and what does it regulate?", "opts": ["The lower esophageal sphincter, which prevents reflux of gastric contents upward", "The opening/sphincter through which liver, gallbladder, and pancreatic secretions flow into the duodenum", "The ileocecal valve, which regulates flow between the small and large intestine", "The pyloric sphincter, which regulates chyme release from the stomach into the duodenum occurring independently of biliary or pancreatic secretions"], "ans": 1, "exp": "Correct — B: The sphincter of Oddi guards the opening (major duodenal papilla) through which bile and pancreatic secretions flow into the duodenum. A, C, and D misstate its location/function."}, {"q": "What are the functional cells of the liver, and what anatomic units do they form?", "opts": ["Sinusoids; they form the falciform ligament", "Kupffer cells; they form the portal triad", "Hepatocytes; they form liver lobules", "Bile canaliculi; they form the gallbladder"], "ans": 2, "exp": "Correct — C: Hepatocytes are the functional liver cells, and plates of hepatocytes together form liver lobules. B, A, and D misidentify the functional cell type and/or the anatomic unit it forms."}, {"q": "What is the function of Kupffer cells in the liver?", "opts": ["They line the sinusoids, destroy microorganisms in sinusoidal blood, and participate in bilirubin production/lipid metabolism", "They synthesize bile salts exclusively, a function actually performed by hepatocytes", "They produce insulin and glucagon as part of the pancreas's endocrine function", "They form the bile canaliculi network, a structural role of adjacent hepatocyte membranes"], "ans": 0, "exp": "Correct — A: Kupffer cells (part of the mononuclear phagocyte system) line the sinusoids, destroy blood-borne microorganisms, and are important in bilirubin production and lipid metabolism. B, C, and D describe functions of hepatocytes or other organs."}, {"q": "How much bile does the liver typically produce per day, and what are its components?", "opts": ["5 to 10 mL/day; composed primarily of digestive enzymes and mucus", "700 to 1200 mL/day; composed of bile salts, cholesterol, bilirubin, electrolytes, and water", "10 to 20 L/day; composed mainly of pancreatic bicarbonate and enzymes secreted directly into the duodenal lumen at mealtime", "50 to 100 mL/day; composed only of cholesterol and bile pigments"], "ans": 1, "exp": "Correct — B: The liver produces 700 to 1200 mL of bile per day, composed of bile salts, cholesterol, bilirubin, electrolytes, and water. A, C, and D do not match the described volume/composition."}, {"q": "What is the enterohepatic circulation of bile?", "opts": ["The filtration of bile salts by the kidney and their excretion into urine", "The one-time synthesis and complete excretion of all bile salts in a single pass", "The production of bile salts exclusively by intestinal bacteria rather than hepatocytes occurring independently of hepatic bile salt reabsorption", "The absorption of bile salts/acids from the terminal ileum and their return to the liver for recycling"], "ans": 3, "exp": "Correct — D: Enterohepatic circulation is the recycling process in which bile salts/acids are absorbed from the terminal ileum and returned to the liver. B, C, and A misstate this recycling pathway."}, {"q": "How is unconjugated bilirubin converted to conjugated bilirubin, and why does this matter?", "opts": ["Hepatocytes convert fat-soluble unconjugated bilirubin to water-soluble conjugated bilirubin, allowing secretion with bile", "The spleen converts water-soluble conjugated bilirubin back into fat-soluble unconjugated bilirubin for long-term storage and later reuse by the liver", "Conjugation occurs exclusively in renal tubular cells before bilirubin reaches the liver", "Conjugation converts water-soluble bilirubin into a fat-soluble form for storage in adipose tissue"], "ans": 0, "exp": "Correct — A: Hepatocytes convert fat-soluble unconjugated bilirubin into water-soluble conjugated bilirubin, enabling its secretion into bile. B, C, and D misstate the site/direction/significance of this conversion."}, {"q": "What is metabolic detoxification, and where does it primarily occur?", "opts": ["A colonic bacterial process that ferments undigested carbohydrates into short-chain fatty acids", "A pancreatic process using lipase and bile salts to emulsify and digest dietary fats", "A renal process that filters nitrogenous waste products from the blood into urine", "The liver's transformation of hormones, toxins, and drugs into less active substances"], "ans": 3, "exp": "Correct — D: Metabolic detoxification is the liver's process of transforming/detoxifying hormones, toxic substances, and drugs into less active forms. B, C, and A misattribute this hepatic function to other organs."}, {"q": "What stimulates gallbladder contraction, and what happens next?", "opts": ["Cholecystokinin; the gallbladder contracts, forcing bile through the cystic and common bile ducts, and the sphincter of Oddi relaxes to allow bile into the duodenum", "Secretin; the gallbladder relaxes while the pancreas is stimulated to secrete alkaline fluid", "Insulin; the gallbladder responds by lowering blood glucose rather than releasing bile", "Gastrin; the gallbladder contracts weakly while the stomach increases acid secretion instead"], "ans": 0, "exp": "Correct — A: Cholecystokinin stimulates gallbladder contraction, forcing bile through the ducts while the sphincter of Oddi relaxes to permit bile flow into the duodenum. B, C, and D misstate the stimulating hormone and/or resulting action."}, {"q": "What are the functions of the endocrine versus exocrine pancreas?", "opts": ["Endocrine pancreas secretes digestive enzymes; exocrine pancreas produces insulin", "Endocrine pancreas produces glucagon/insulin for glucose regulation; exocrine pancreas secretes digestive enzymes and alkaline fluid", "Both portions arise from the same duct system and secrete only alkaline fluid", "The pancreas has no endocrine function, functioning only as a digestive exocrine gland"], "ans": 1, "exp": "Correct — B: The endocrine pancreas produces glucagon and insulin for glucose regulation, while the exocrine pancreas secretes an alkaline solution and digestive enzymes (trypsin, chymotrypsin, carboxypeptidase, amylase, lipase). A, C, and D reverse or misstate these distinct functions."}, {"q": "Which hormone stimulates pancreatic secretion of alkaline fluid, and which stimulate enzyme secretion?", "opts": ["Gastrin stimulates alkaline fluid secretion; motilin stimulates enzyme release from acinar cells", "Secretin stimulates alkaline fluid secretion; cholecystokinin and ACh stimulate enzyme secretion", "Insulin stimulates both alkaline fluid and enzyme secretion via glucose-sensing acinar cells", "Bile acids stimulate both alkaline fluid and enzyme secretion by feedback on the pancreas"], "ans": 1, "exp": "Correct — B: Secretin stimulates pancreatic alkaline fluid secretion, while cholecystokinin and acetylcholine (ACh) stimulate enzyme secretion. A, C, and D misattribute these regulatory roles."}, {"q": "Which liver enzymes are of particular importance in diagnosing liver function alterations?", "opts": ["LDH, AST, and ALT", "Amylase and lipase", "Creatinine and BUN", "Troponin and CK-MB"], "ans": 0, "exp": "Correct — A: LDH, AST, and ALT are the enzymes of particular importance in evaluating liver function. B are pancreatic markers, and C and D are renal and cardiac markers respectively, not liver-specific."}, {"q": "Which laboratory findings suggest an obstructive disease of the gallbladder?", "opts": ["Decreased white blood cell count with normal serum bilirubin and no change in stool fat", "Decreased serum bilirubin with decreased urine urobilinogen and normal stool fat content", "Elevated serum amylase only, with normal bilirubin and normal urine urobilinogen levels", "Elevated serum bilirubin, elevated urine urobilinogen, and increased stool fat"], "ans": 3, "exp": "Correct — D: Obstructive gallbladder disease presents with elevated serum bilirubin, elevated urine urobilinogen, and increased stool fat, with leukocytosis if inflammation is present. B, C, and A do not match the described findings."}, {"q": "Which laboratory values are the most significant indicators of pancreatic dysfunction?", "opts": ["Serum amylase and stool fat", "Serum bilirubin and AST", "Serum creatinine and BUN", "Serum troponin and CK-MB"], "ans": 0, "exp": "Correct — A: Serum amylase and stool fat are the most significant indicators of pancreatic dysfunction, both increasing with pancreatic pathology. B, C, and D are markers for liver, kidney, or cardiac function instead."}, {"q": "How does aging affect gastric motility, secretions, and digestion?", "opts": ["Aging has no effect on gastric motility but modestly increases HCl secretion", "Aging increases gastric motility and HCl secretion, speeding gastric emptying", "Aging reduces gastric motility and HCl secretion, slowing gastric digestion and emptying", "Aging only affects esophageal peristalsis, leaving gastric motility and secretions unchanged"], "ans": 2, "exp": "Correct — C: Aging reduces gastric motility and secretions (particularly HCl), slowing digestion and gastric emptying. B, A, and D contradict these described age-related changes."}, {"q": "How does aging affect drug and alcohol metabolism, and why?", "opts": ["Efficiency decreases, related to decreased liver perfusion and decreased liver enzymes", "Efficiency increases with age, related to increased liver perfusion and enzyme activity", "Aging has no effect on drug or alcohol metabolism, since liver mass remains constant", "Metabolism becomes faster with age due to increased hepatic enzyme production"], "ans": 0, "exp": "Correct — A: Aging decreases the efficiency of drug/alcohol metabolism, related to decreased liver perfusion and decreased liver enzyme activity. B, C, and D contradict this described age-related hepatic decline."}], "clinical": [{"q": "A patient with chronic pancreatitis has insufficient pancreatic enzyme production. Which macronutrient digestion processes would be most directly impaired, given the enzymes normally supplied by the pancreas?", "opts": ["Only fat digestion is impaired, since salivary and gastric enzymes fully compensate for protein and carbohydrate breakdown through unaffected extra-pancreatic digestive pathways", "Protein, carbohydrate, and fat digestion, since pancreatic enzymes (trypsin, chymotrypsin, carboxypeptidase, amylase, lipase) digest all three", "Only carbohydrate digestion is impaired, since biliary lipase can substitute for pancreatic lipase", "No macronutrient digestion is affected, since brush-border enzymes alone complete all digestion"], "ans": 1, "exp": "Correct — B: Because pancreatic enzymes include trypsin/chymotrypsin/carboxypeptidase (protein), amylase (carbohydrate), and lipase (fat), pancreatic insufficiency impairs digestion of all three macronutrients. A, C, and D understate the broad digestive role of pancreatic enzymes."}, {"q": "A patient has a condition causing loss of parietal cells. Which two digestive functions would be most directly impaired?", "opts": ["Hydrochloric acid secretion and intrinsic factor production (affecting vitamin B12 absorption)", "Bile production and fat emulsification, functions carried out by hepatocytes, not parietal cells", "Pancreatic enzyme secretion, which is performed by acinar cells rather than gastric parietal cells", "Carbohydrate digestion by salivary amylase, unaffected since it occurs before food reaches the stomach"], "ans": 0, "exp": "Correct — A: Since parietal cells produce both HCl and intrinsic factor, their loss would impair acid secretion (affecting protein digestion/pepsin activation) and intrinsic factor-dependent B12 absorption. B, C, and D describe functions of other organs/cells, not parietal cells."}, {"q": "A patient has terminal ileal disease from Crohn's disease, disrupting the enterohepatic circulation of bile. What malabsorption consequence would be expected?", "opts": ["Improved fat absorption, since inflamed ileal tissue increases bile salt reabsorption efficiency because the colon fully compensates for any ileal loss", "Fat malabsorption and deficiency of fat-soluble vitamins, since bile salt recycling from the terminal ileum is disrupted", "No effect, since bile salts bypass the ileum entirely and are reabsorbed in the jejunum instead", "Only protein malabsorption would occur, since bile salts are not involved in fat digestion"], "ans": 1, "exp": "Correct — B: Since bile salts/acids are normally reabsorbed from the terminal ileum (enterohepatic circulation), ileal disease disrupts this recycling, leading to bile salt deficiency, fat malabsorption, and fat-soluble vitamin deficiency. A, C, and D misstate the expected consequence."}, {"q": "A patient undergoes a cholecystectomy (gallbladder removal). Since bile is still produced by the liver, what physiologic change would be expected regarding bile delivery to the intestine?", "opts": ["Bile production would completely cease, since the gallbladder is the primary site of bile synthesis", "Bile would flow more continuously (rather than being stored and released in response to CCK), since the storage/concentration function of the gallbladder is now absent", "Fat digestion would improve dramatically, since continuous bile flow is more concentrated than stored bile", "The pancreas would take over bile storage and concentration functions previously performed by the gallbladder"], "ans": 1, "exp": "Correct — B: Since the gallbladder normally stores bile and releases it in response to cholecystokinin when chyme enters the duodenum, its removal means bile flows more continuously and in a less concentrated form, sometimes causing mild fat digestion changes. A, C, and D misstate the physiologic adaptation after cholecystectomy."}, {"q": "A newborn's intestinal tract, previously sterile, becomes colonized with bacteria. Over what approximate timeframe does full colonization typically occur?", "opts": ["3 to 4 years", "3 to 4 hours", "3 to 4 weeks", "The intestine never becomes colonized"], "ans": 2, "exp": "Correct — C: The intestinal tract is sterile at birth and becomes totally colonized within 3 to 4 weeks. B, A, and D do not match this described timeframe."}, {"q": "An elderly patient reports that food takes noticeably longer to move through the stomach than it used to, along with a reduced appetite. Which age-related GI changes best explain this?", "opts": ["No physiologic changes occur in the aging stomach, since gastric motility is preserved lifelong even well into the ninth decade of life", "Increased gastric motility with age, which would speed rather than delay gastric emptying", "Improved digestive efficiency with age, from increased HCl secretion and faster emptying", "Reduced gastric motility and decreased HCl/other secretions, slowing gastric digestion and emptying"], "ans": 3, "exp": "Correct — D: Aging reduces gastric motility and secretions (including HCl), slowing gastric digestion and emptying, consistent with this patient's delayed gastric transit and appetite changes. B, C, and A contradict the described aging pattern."}, {"q": "A patient taking multiple hepatically-metabolized medications is noted to have higher-than-expected drug levels despite standard dosing, and the patient is elderly. What physiologic explanation is most consistent with the aging literature?", "opts": ["Aging has no known effect on drug metabolism, since hepatic mass remains stable throughout life despite otherwise normal renal drug clearance", "Aging always increases liver enzyme activity, which would lower rather than raise drug levels", "The patient's kidneys are solely responsible, since the liver plays no role in drug clearance", "Decreased liver perfusion and decreased liver enzyme activity with age, reducing drug metabolism efficiency"], "ans": 3, "exp": "Correct — D: Aging decreases the efficiency of drug metabolism due to decreased liver perfusion and decreased liver enzyme levels, explaining elevated drug levels in an elderly patient at standard dosing. B, C, and A contradict this well-described mechanism."}]}, {"title": "Alterations of Digestive Function", "code": "Chapter 41", "color": "c9", "subtitle": "Clinical Manifestations • Esophageal/Gastric/Intestinal Disorders • IBD/IBS • Liver, Gallbladder & Pancreatic Disease • Cancer", "general": [{"q": "What distinguishes projectile vomiting from typical vomiting?", "opts": ["Projectile vomiting only occurs in infants with pyloric stenosis, never in other age groups", "Projectile vomiting always follows prolonged nausea and repeated retching episodes", "There is no difference between the two, since both always follow identical prodromal symptoms", "Projectile vomiting is associated with direct or indirect stimulation of the vomiting center, without the usual preceding nausea/retching"], "ans": 3, "exp": "Correct — D: Unlike typical vomiting (usually preceded by nausea/retching), projectile vomiting results from direct or indirect stimulation of the vomiting center and is not preceded by these warning symptoms. B, C, and A misstate this distinction."}, {"q": "What are the three categories of primary constipation?", "opts": ["Functional, slow-transit, and IBS-C", "Osmotic, secretory, and motility", "Acute, persistent, and chronic", "Mechanical, neurogenic, and metabolic"], "ans": 0, "exp": "Correct — A: Primary constipation is categorized as functional (low-residue/fluid diet), slow-transit (impaired colonic motor function), and IBS-C. B describes diarrhea categories, and C and D describe other GI classification schemes."}, {"q": "Diarrhea can result from which three general mechanisms?", "opts": ["Only from dietary fiber excess drawing water osmotically into the colon", "Only from bacterial infection directly damaging the intestinal mucosal lining", "Osmotic (fluid drawn into the lumen), secretory (excessive mucosal fluid secretion), or motility-related (excessive GI motility)", "Only from constipation rebound after prolonged impaction of the rectum"], "ans": 2, "exp": "Correct — C: Diarrhea results from osmotic, secretory, or motility mechanisms (excessive fluid influx, excessive secretion, or excessive motility, respectively). B, A, and D do not capture this three-mechanism framework."}, {"q": "What is the difference between parietal and visceral abdominal pain?", "opts": ["Parietal pain originates in the organs; visceral pain originates in the peritoneum", "Parietal pain originates in the peritoneum; visceral pain originates in the abdominal organs and is often referred to the back", "Both types of pain originate in the peritoneum and share an identical referred pattern", "Neither type of pain is associated with referred pain to distant body sites"], "ans": 1, "exp": "Correct — B: Parietal pain arises from the peritoneum, while visceral pain arises from abdominal organs and is often referred elsewhere, such as to the back. A reverses these origins, and C and D misstate their distinct nature."}, {"q": "What are the three classic manifestations of GI bleeding, and what does each indicate?", "opts": ["Melena indicates upper GI bleeding only, while hematochezia always indicates cancer", "Only hematemesis indicates any GI bleeding, since melena and hematochezia reflect skin conditions, not true gastrointestinal hemorrhage", "Hematemesis (vomiting blood), melena (dark tarry stools), and hematochezia (frank rectal bleeding)", "These terms are interchangeable, each describing occult blood detected only by laboratory testing"], "ans": 2, "exp": "Correct — C: Hematemesis, melena, and hematochezia are the three classic overt manifestations of GI bleeding, each indicating a different presentation. B, A, and D understate or misstate these distinct terms."}, {"q": "Achalasia is caused by what underlying mechanism?", "opts": ["Loss of esophageal innervation or LES relaxation, possibly from an immune response to an unknown antigen", "Excess acid reflux causing chronic inflammation and secondary LES scarring", "A structural tumor compressing the esophagus and mechanically obstructing the lumen arising from chronic gastroesophageal reflux disease", "A dietary deficiency of vitamin B12 impairing esophageal smooth muscle contraction"], "ans": 0, "exp": "Correct — A: Achalasia is a rare functional dysphagia from loss of esophageal innervation or LES relaxation, possibly triggered by an immune response to an unknown antigen. B, C, and D do not describe achalasia's actual mechanism."}, {"q": "GERD results from which underlying abnormalities?", "opts": ["Only increased intestinal motility, which would speed rather than reflux gastric contents directed away from the duodenum entirely", "Only excess salivation, which protects rather than damages the esophageal mucosa", "Abnormalities in lower esophageal sphincter function, esophageal motility, and gastric motility/emptying", "Only a structural malformation of the stomach present since birth"], "ans": 2, "exp": "Correct — C: GERD relates to abnormalities in LES function, esophageal motility, and gastric motility/emptying, allowing gastric content reflux that causes esophagitis. B, A, and D do not describe GERD's underlying mechanism."}, {"q": "Eosinophilic esophagitis (EoE) is characterized by which pathologic process?", "opts": ["Excess acid production by the stomach causing erosive esophagitis without eosinophil infiltration triggered solely by chronic gastric acid reflux", "Bacterial infection of the esophagus causing acute suppurative inflammation", "A congenital structural defect narrowing the esophageal lumen from birth", "Infiltration of eosinophils in the esophagus with inflammation, as an idiopathic chronic allergic/immune disease"], "ans": 3, "exp": "Correct — D: EoE is an idiopathic chronic allergic/immune disease characterized by eosinophilic infiltration and inflammation of the esophagus. B, C, and A do not describe EoE's actual pathophysiology."}, {"q": "What is a hiatal hernia, and what are its types?", "opts": ["A hernia of the umbilicus present at birth from incomplete closure of the abdominal wall often associated with pregnancy, obesity, and advancing age", "Protrusion of the upper stomach through the diaphragmatic hiatus; types include sliding, paraesophageal, and mixed", "A hernia of the groin, classified as inguinal or femoral based on anatomic location", "A congenital absence of the diaphragm allowing abdominal organs into the thoracic cavity"], "ans": 1, "exp": "Correct — B: Hiatal hernia is protrusion of the upper stomach through the esophageal hiatus of the diaphragm, occurring as sliding, paraesophageal, or mixed types. A and C describe unrelated hernia types (umbilical, groin), and D misstates the anatomy involved."}, {"q": "Gastroparesis is defined as:", "opts": ["A mechanical obstruction of the pylorus from scarring or tumor growth", "Rapid gastric emptying from excess vagal stimulation and increased motility", "Delayed gastric emptying without mechanical obstruction, involving ANS/smooth muscle/enteric neuron/hormone abnormalities", "Complete absence of gastric secretions from autoimmune destruction of parietal cells"], "ans": 2, "exp": "Correct — C: Gastroparesis is delayed gastric emptying in the absence of mechanical obstruction, from abnormalities of the autonomic nervous system, smooth muscle, enteric neurons, or GI hormones. B, A, and D misstate this definition."}, {"q": "What can cause pyloric obstruction?", "opts": ["Only vitamin B12 deficiency causing impaired pyloric smooth muscle contraction", "Only viral infection causing transient inflammatory swelling of the pylorus", "Only excess bile production refluxing backward through the pyloric sphincter", "Congenital defect, gastric ulcer scarring, or tumor growth"], "ans": 3, "exp": "Correct — D: Pyloric obstruction (narrowing/blockage between stomach and duodenum) can result from a congenital defect, ulcer-related inflammation/scarring, or tumor growth. B, C, and A are not described causes."}, {"q": "What distinguishes mechanical intestinal obstruction from functional obstruction (paralytic ileus)?", "opts": ["Both types produce an identical physical blockage detectable on abdominal imaging", "Mechanical obstruction is caused by torsion, herniation, or tumor; functional obstruction (ileus) is caused by conditions like abdominal surgery, infection, cardiac dysfunction, or hypokalemia without a physical blockage", "Functional obstruction always requires emergency surgery, unlike mechanical obstruction", "Mechanical obstruction never causes fluid or electrolyte loss, unlike paralytic ileus"], "ans": 1, "exp": "Correct — B: Mechanical obstruction involves a physical blockage (torsion, hernia, tumor), while functional obstruction/paralytic ileus lacks a physical blockage and can follow surgery, infection, cardiac dysfunction, or hypokalemia. A, C, and D misstate this distinction."}, {"q": "What are the most severe consequences of intestinal obstruction or ileus?", "opts": ["Improved nutrient absorption from prolonged intestinal transit time", "Mild, self-limited abdominal discomfort that resolves without fluid resuscitation", "Fluid/electrolyte losses, hypovolemia, shock, intestinal necrosis, and perforation", "No significant consequences if untreated, since the bowel adapts to chronic distention"], "ans": 2, "exp": "Correct — C: Severe intestinal obstruction/ileus can cause fluid/electrolyte losses, hypovolemia, shock, intestinal necrosis, and perforation. B, A, and D understate these potentially life-threatening consequences."}, {"q": "Which type of chronic gastritis is associated with autoantibodies to parietal cells and intrinsic factor, causing pernicious anemia?", "opts": ["Chronic fundal (autoimmune) gastritis", "Chronic antral gastritis", "Alkaline reflux gastritis", "Acute stress gastritis"], "ans": 0, "exp": "Correct — A: Chronic fundal gastritis (autoimmune gastritis) involves autoantibodies to parietal cells and intrinsic factor, causing gastric atrophy and pernicious anemia. B, C, and D describe different gastritis types with different mechanisms/associations."}, {"q": "Which type of chronic gastritis is most common and associated with H. pylori?", "opts": ["Chronic fundal (autoimmune) gastritis", "Chronic antral gastritis", "Alkaline reflux gastritis", "Eosinophilic gastritis"], "ans": 1, "exp": "Correct — B: Chronic antral gastritis is the most common form and is associated with H. pylori (which stimulates gastrin secretion) and NSAID use. A, C, and D are less common or differently caused forms of gastritis."}, {"q": "What causes alkaline reflux gastritis?", "opts": ["A viral infection of the antrum causing acute erosive mucosal damage", "Excess gastric acid production alone, without any duodenal content involvement with normal duodenogastric anatomy and no bile involvement", "Reflux of bile and pancreatic secretions from the duodenum into the stomach, disrupting the mucosal barrier", "A congenital malformation of the pylorus present since birth"], "ans": 2, "exp": "Correct — C: Alkaline reflux gastritis results from duodenal contents (bile, pancreatic secretions) refluxing into the stomach and disrupting the protective mucosal barrier. B, A, and D do not describe this specific reflux mechanism."}, {"q": "What are the three types of peptic ulcers?", "opts": ["Duodenal, gastric, and stress ulcers", "Esophageal, colonic, and rectal ulcers", "Viral, bacterial, and fungal ulcers", "Acute, subacute, and chronic ulcers only"], "ans": 0, "exp": "Correct — A: The three types of peptic ulcers are duodenal, gastric, and stress ulcers. B, C, and D do not match the described classification."}, {"q": "Which type of peptic ulcer is most common, and what characterizes its pain pattern?", "opts": ["Gastric ulcer; pain occurs immediately after eating and is worsened rather than relieved by food", "Duodenal ulcer; pain occurs when the stomach is empty and is relieved with food or antacids", "Stress ulcer; pain occurs constantly regardless of meals and is unrelieved by antacids", "Esophageal ulcer; pain occurs only with swallowing and is unrelated to gastric emptying"], "ans": 1, "exp": "Correct — B: Duodenal ulcers, the most common peptic ulcer, cause pain when the stomach is empty, relieved by food or antacids, and tend to heal spontaneously but recur frequently. A, C, and D misstate the most common ulcer type and/or its pain pattern."}, {"q": "Zollinger-Ellison syndrome is caused by which underlying process?", "opts": ["A gastrin-secreting gastrinoma causing chronic gastric acid hypersecretion and ulcers", "A vitamin B12 deficiency causing impaired gastric acid secretion", "An autoimmune reaction against intrinsic factor causing pernicious anemia that develops entirely unrelated to serum gastrin levels", "A congenital pyloric defect present from birth causing outlet obstruction"], "ans": 0, "exp": "Correct — A: Zollinger-Ellison syndrome is caused by a gastrinoma (gastrin-secreting tumor) driving chronic acid hypersecretion and resultant gastric/duodenal ulcers. B, C, and D do not describe this tumor-driven hypersecretory syndrome."}, {"q": "What is the mechanism of a Curling ulcer versus a Cushing ulcer?", "opts": ["Cushing ulcer follows burns; Curling ulcer follows head trauma", "Both ulcers arise from identical vagal overstimulation regardless of the inciting event", "Curling ulcer follows burns/trauma-related ischemia; Cushing ulcer follows head trauma with vagal overstimulation causing acid hypersecretion", "Neither ulcer is related to acute illness, trauma, or critical care hospitalization"], "ans": 2, "exp": "Correct — C: Curling ulcer is a stress ulcer following burns (via mucosal ischemia), while Cushing ulcer follows head trauma (via vagal nuclei overstimulation causing HCl hypersecretion). B, A, and D reverse or misstate these distinct stress ulcer mechanisms."}, {"q": "What causes dumping syndrome after gastric resection?", "opts": ["Rapid emptying of hypertonic chyme into the small intestine, causing an osmotic fluid shift that decreases plasma volume and increases intestinal motility", "Slow, delayed gastric emptying that prevents any osmotic fluid shift from occurring", "Complete absence of gastric emptying due to pyloric sphincter spasm after surgery", "Excess bile production refluxing into the stomach, unrelated to the rate of gastric emptying"], "ans": 0, "exp": "Correct — A: Dumping syndrome results from rapid emptying of hypertonic chyme into the small intestine, causing fluid to shift osmotically from plasma into the intestinal lumen, decreasing plasma volume and increasing motility. B, C, and D misstate this mechanism."}, {"q": "What is the difference between malabsorption and maldigestion?", "opts": ["They are identical terms, both describing failure of enzymatic nutrient breakdown", "Malabsorption is disrupted nutrient absorption; maldigestion is failure of the chemical digestive process", "Malabsorption refers only to fat transport; maldigestion refers only to carbohydrate breakdown affecting only fat-soluble nutrient transport", "Neither term relates to nutrient processing, both describing motility disorders instead"], "ans": 1, "exp": "Correct — B: Malabsorption is disruption of nutrient absorption, while maldigestion is failure of the chemical breakdown (digestion) process itself — related but distinct concepts. A, C, and D mischaracterize this distinction."}, {"q": "What causes fat malabsorption and steatorrhea related to bile salts?", "opts": ["A gastric ulcer exclusively, unrelated to bile salt concentration in the duodenum", "Excess bile salt production overwhelming the micelle-forming capacity of the intestine that precipitates as gallstones rather than causing diarrhea", "A pancreatic tumor exclusively obstructing enzyme secretion into the duodenum", "Bile salt deficiency from inadequate secretion, excess bacterial deconjugation, or impaired ileal reabsorption"], "ans": 3, "exp": "Correct — D: Bile salt deficiency (from inadequate secretion, excess bacterial deconjugation, or impaired ileal reabsorption from ileal disease) causes fat malabsorption and steatorrhea. B, C, and A do not describe this specific bile-salt-related mechanism."}, {"q": "How does ulcerative colitis (UC) differ from Crohn disease (CD) in terms of GI tract involvement and ulceration depth?", "opts": ["Neither disease involves ulceration, both being purely functional motility disorders", "UC affects the entire GI tract with transmural ulceration; CD is limited to the rectum", "Both diseases produce identical transmural ulceration limited strictly to the colon", "UC affects the colon/rectum with mucosal ulceration; CD can affect the entire GI tract with transmural ulceration and skip lesions/granulomas"], "ans": 3, "exp": "Correct — D: UC involves colonic/rectal mucosal ulceration, while CD can affect the entire GI tract with transmural ulceration, skip lesions, and granulomas — key distinguishing features. B, C, and A reverse or misstate these distinctions."}, {"q": "What are the classic clinical features distinguishing UC from CD?", "opts": ["UC: cramping pain, bleeding, frequent diarrhea; CD: abdominal tenderness/pain, nonbloody diarrhea, weight loss", "UC causes nonbloody diarrhea with weight loss; CD causes cramping pain with frequent bleeding with rare progression to toxic megacolon in severe cases", "Both diseases present identically with transmural granulomas and skip lesions", "Neither disease causes diarrhea, presenting instead with chronic constipation"], "ans": 0, "exp": "Correct — A: UC classically causes cramping pain, bleeding, and frequent diarrhea, while CD causes abdominal tenderness/pain, nonbloody diarrhea, and weight loss. B, C, and D misstate these classic distinguishing clinical features."}, {"q": "What is irritable bowel syndrome (IBS) best described as?", "opts": ["A malignant tumor of the small intestine causing progressive obstruction", "A structural inflammatory bowel disease with visible mucosal ulceration on colonoscopy with a course similar to Crohn disease", "A bacterial infection of the colon requiring antibiotic treatment for resolution", "A disorder of brain-gut interaction characterized by abdominal pain with altered bowel habits"], "ans": 3, "exp": "Correct — D: IBS is a disorder of brain-gut interaction with abdominal pain and altered bowel habits (diarrhea, constipation, or both), without the structural ulceration/inflammation seen in IBD. B, C, and A mischaracterize IBS."}, {"q": "What is the difference between diverticulosis and diverticulitis?", "opts": ["They are identical conditions, both requiring identical antibiotic treatment courses", "Diverticulosis is the presence of colonic outpouchings; diverticulitis is inflammation of those outpouchings", "Diverticulitis is the presence of outpouchings; diverticulosis is inflammation", "Neither term relates to the colon, both describing small intestinal outpouchings instead and instead reflecting normal gastric mucosal folds"], "ans": 1, "exp": "Correct — B: Diverticulosis is simply the presence of diverticula (colonic outpouchings), while diverticulitis is inflammation of those diverticula. A, C, and D reverse or misstate this distinction."}, {"q": "What is the underlying pathophysiology of appendicitis, and what can occur if untreated?", "opts": ["A dietary fiber deficiency causes appendicitis, which poses no risk of rupture or peritonitis", "Obstruction of the appendiceal lumen leads to increased pressure, ischemia, and inflammation; untreated, it may progress to gangrene, perforation, and peritonitis", "Appendicitis always resolves spontaneously without treatment, regardless of luminal obstruction", "Appendicitis is caused by excess bile reflux into the cecum and appendiceal lumen"], "ans": 1, "exp": "Correct — B: Appendiceal obstruction causes increased pressure, ischemia, and inflammation, which can progress to gangrene, perforation, and peritonitis without surgical treatment. A, C, and D understate the seriousness and typical mechanism of appendicitis."}, {"q": "What is the mechanism and consequence of intestinal vascular insufficiency?", "opts": ["A condition limited to the esophagus from impaired blood flow through the azygos vein", "Excess mesenteric blood flow causing diarrhea only, without ischemia or tissue damage", "A benign condition with no systemic effects, resolving without fluid resuscitation", "Occlusion/obstruction or insufficient mesenteric arterial blood flow causes ischemia/necrosis, producing abdominal pain, fever, bloody diarrhea, hypovolemia, and shock"], "ans": 3, "exp": "Correct — D: Intestinal vascular insufficiency (from mesenteric vessel occlusion or insufficient flow) causes ischemia/necrosis, producing abdominal pain, fever, bloody diarrhea, hypovolemia, and shock. B, C, and A understate or misstate this potentially life-threatening condition."}, {"q": "What is portal hypertension, and what pressure threshold defines it?
