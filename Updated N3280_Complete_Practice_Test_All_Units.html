m abdominal contents pressing upward on the diaphragm when lying flat and supine", "Cyanosis, a bluish skin discoloration resulting from hemoglobin desaturation", "Clubbing, bulbous fingertip enlargement resulting from long-standing chronic hypoxemia", "Hemoptysis, usually from infection or inflammation damaging the bronchi or lung parenchyma"], "ans": 3, "exp": "Correct — D: Blood-streaked sputum is hemoptysis, typically resulting from infection or inflammation (such as TB) damaging the bronchi or lung parenchyma. B, C, and A describe unrelated clinical findings."}, {"q": "A patient with a opioid overdose has a respiratory rate of 6 breaths/min and rising PaCO2. Which process is occurring, and what is the resulting acid-base disturbance?", "opts": ["Primary metabolic acidosis from lactate accumulation, unrelated to ventilatory rate", "Hyperventilation, causing hypocapnia and a resulting respiratory alkalosis", "Normal alveolar ventilation with no resulting acid-base disturbance whatsoever", "Hypoventilation, causing hypercapnia and respiratory acidosis"], "ans": 3, "exp": "Correct — D: D markedly reduced respiratory rate reflects hypoventilation, causing hypercapnia (elevated PaCO2), which is associated with respiratory acidosis. B, C, and A do not match this presentation of opioid-induced respiratory depression."}, {"q": "A panicked patient breathes rapidly and deeply, and arterial blood gas shows a low PaCO2. Which process explains this finding?", "opts": ["A normal physiologic response occurring with no accompanying change in PaCO2", "Hypoventilation, caused by anxiety, producing hypercapnia rather than hypocapnia", "Hyperventilation, caused by anxiety, producing hypocapnia", "Cor pulmonale, right ventricular enlargement from chronic pulmonary hypertension"], "ans": 2, "exp": "Correct — C: Rapid, deep breathing from anxiety is hyperventilation, which decreases PaCO2 (hypocapnia). B reverses the correct direction of PaCO2 change, and A and D do not match this presentation."}, {"q": "A patient with long-standing bronchiectasis and chronic hypoxemia is noted to have bulbous enlargement of the fingertips. Which finding is this, and is it expected to reverse with treatment?", "opts": ["Cyanosis; a bluish discoloration that resolves immediately with supplemental oxygen", "Clubbing; it is rarely reversible", "Pallor; a pale skin finding that resolves with iron supplementation for anemia", "Peripheral edema; a fluid finding that resolves with diuretic therapy"], "ans": 1, "exp": "Correct — B: Bulbous fingertip enlargement associated with chronic hypoxemia is clubbing, which is rarely reversible even after treating the underlying condition. A, C, and D describe different findings with different (often more reversible) mechanisms."}, {"q": "A trauma patient develops sudden respiratory distress, tracheal deviation away from the injured side, and absent breath sounds on that side, with hypotension. Which condition is this, and why is it an emergency?", "opts": ["Simple pleural effusion; slowly accumulating fluid with no hemodynamic urgency", "Tension pneumothorax; trapped air under pressure displaces the trachea/great vessels/heart, compromising cardiac output", "Empyema; a chronic infectious pleural process developing gradually over weeks", "Chronic bronchitis; a long-term inflammatory airway process, not an acute emergency"], "ans": 1, "exp": "Correct — B: Tracheal deviation, absent breath sounds, respiratory distress, and hypotension after trauma describe tension pneumothorax, a life-threatening emergency from trapped pleural air displacing mediastinal structures. A, C, and D describe non-emergent or chronic conditions that do not match this acute, unstable presentation."}, {"q": "A patient recovering from bacterial pneumonia develops fever and a pleural fluid collection that grows bacteria on culture. Which condition is this?", "opts": ["Pneumothorax, air accumulation in the pleural space rather than an infected effusion", "A simple transudative pleural effusion from heart failure, typically sterile on culture", "Empyema (infected pleural effusion)", "Bronchiectasis, chronic bronchial dilation unrelated to pleural fluid infection"], "ans": 2, "exp": "Correct — C: C pleural fluid collection with positive bacterial culture following pneumonia is empyema (pus in the pleural space), which develops via lymphatic drainage from the site of infection. B, A, and D describe different, non-infected or non-fluid processes."}, {"q": "A patient with idiopathic pulmonary fibrosis has decreased lung compliance and must work harder to expand the lungs. Which of the following would also be expected on exam?", "opts": ["Wheezing as the dominant auscultation finding, consistent with an obstructive rather than a restrictive breathing pattern", "Dyspnea, increased respiratory rate, and decreased tidal volume, consistent with a restrictive pattern", "Normal tidal volume with a decreased respiratory rate, the opposite of a restrictive pattern", "Complete absence of any respiratory symptoms despite decreased lung compliance"], "ans": 1, "exp": "Correct — B: Restrictive lung disease (such as pulmonary fibrosis) is characterized by dyspnea, increased respiratory rate, and decreased tidal volume due to decreased compliance. A describes obstructive, not restrictive, disease, and C and D contradict the expected restrictive presentation."}, {"q": "A postoperative, bedridden patient develops a low-grade fever and decreased breath sounds at the lung bases, with imaging showing basilar opacities. Which condition is most consistent, and what is a common mechanism?", "opts": ["Atelectasis, from alveolar collapse related to decreased surfactant production, compression, or gas absorption from obstructed alveoli, common with immobility/shallow breathing postoperatively", "Bronchiectasis, from chronic bronchial dilation typically developing over years", "Pulmonary fibrosis, from chronic connective tissue deposition in the lung parenchyma", "Lung cancer, a mass lesion typically related to chronic tobacco exposure"], "ans": 0, "exp": "Correct — A: Basilar opacities and decreased breath sounds in a postoperative, immobile patient are classic for atelectasis, related to shallow breathing, compression, or reduced surfactant activity. B, C, and D describe different, generally more chronic conditions not typical of this acute postoperative scenario."}, {"q": "A patient with left heart failure develops bilateral crackles, dyspnea, and frothy pink sputum. Which pulmonary condition is most likely, and what hemodynamic mechanism explains it?", "opts": ["Cor pulmonale, from primary lung disease causing right ventricular strain", "Pneumothorax, from sudden pleural air accumulation unrelated to cardiac pressure", "Bronchiectasis, from chronic bronchial wall dilation that develops entirely unrelated to cardiac hemodynamics", "Pulmonary edema, from increased pulmonary capillary hydrostatic pressure due to left heart failure"], "ans": 3, "exp": "Correct — D: Bilateral crackles, dyspnea, and frothy sputum in a patient with left heart failure describe pulmonary edema, caused by increased pulmonary capillary hydrostatic pressure backing up from the failing left heart. B, C, and A describe different conditions with different mechanisms."}, {"q": "A patient with severe pancreatitis develops sudden, severe hypoxemia and bilateral infiltrates on chest x-ray, without evidence of cardiac dysfunction. Which condition is most likely, and what is the underlying pathophysiology?", "opts": ["Simple atelectasis, from shallow breathing and reduced surfactant activity", "Cardiogenic pulmonary edema, from left heart failure raising capillary pressure", "ARDS, from severe systemic inflammation causing endothelial damage, increased capillary permeability, and diffuse alveolocapillary injury", "Chronic bronchitis, from long-term smoking causing airway inflammation"], "ans": 2, "exp": "Correct — C: Sudden severe hypoxemia with bilateral infiltrates arising from a severe systemic inflammatory process (like pancreatitis), without cardiac cause, describes ARDS, caused by endothelial damage and increased capillary permeability. B is excluded by the absence of cardiac dysfunction, and A and D do not match this acute, severe presentation."}, {"q": "A patient with wheezing, dyspnea, and a known allergen trigger has variable airflow obstruction that improves significantly after bronchodilator therapy. Which condition is most consistent?", "opts": ["Asthma, given its hallmark reversible airflow obstruction and hyperresponsiveness", "Pulmonary fibrosis, which characteristically does not reverse with bronchodilator therapy", "Pneumothorax, sudden pleural air accumulation unrelated to allergen exposure", "Cor pulmonale, right heart strain resulting from chronic pulmonary hypertension"], "ans": 0, "exp": "Correct — A: Wheezing, allergen-triggered symptoms, and airflow obstruction that reverses significantly with bronchodilators are classic for asthma's variable, reversible obstruction. B, C, and D do not present with this reversible, allergen-triggered obstructive pattern."}, {"q": "A long-term smoker presents with chronic productive cough for over 3 months per year for the past 2 years, along with wheezing. Which COPD subtype does this best represent, and what is the underlying pathology?", "opts": ["Asthma, from a purely allergic, reversible bronchospastic mechanism", "Emphysema, from progressive destruction of alveolar septa with typically minimal cough or sputum production", "Chronic bronchitis, from airway inflammation, smooth muscle hypertrophy, and thick mucus production", "Pulmonary embolism, from a dislodged venous thromboembolism obstructing pulmonary vessels"], "ans": 2, "exp": "Correct — C: Chronic productive cough is the hallmark of chronic bronchitis, caused by airway inflammation, smooth muscle hypertrophy, and thick mucus production. B (emphysema) typically presents with dyspnea and minimal cough/sputum instead, and A and D describe different, non-COPD conditions."}, {"q": "A long-term smoker presents with progressive dyspnea, minimal cough, a barrel chest, and hyperinflated lungs on imaging with reduced diffusion capacity. Which COPD subtype does this best represent, and what pathologic change underlies it?", "opts": ["Emphysema, from destruction of alveolar septa and loss of elastic recoil causing alveolar enlargement and air trapping", "Chronic bronchitis, from mucus hypersecretion with otherwise normal alveolar structure", "Asthma, from reversible bronchospasm triggered by allergens or irritants", "Bronchiolitis, a predominantly pediatric lower airway infection"], "ans": 0, "exp": "Correct — A: Progressive dyspnea, barrel chest, hyperinflation, and reduced diffusion capacity with minimal cough describe emphysema, caused by alveolar septal destruction and elastic recoil loss. B typically presents with productive cough as the dominant feature instead, and C and D do not match this presentation."}, {"q": "A patient presents with fever, productive cough, and a lobar infiltrate on chest x-ray. Sputum culture grows Streptococcus pneumoniae. Which diagnosis and epidemiologic fact are most relevant?", "opts": ["Viral pneumonia; typically caused by influenza virus rather than a bacterial organism", "Tuberculosis; caused by Mycobacterium tuberculosis, not Streptococcus pneumoniae", "Community-acquired pneumonia; S. pneumoniae is the most common causative organism", "Aspiration pneumonitis; caused by inhaled gastric contents, not a cultured organism"], "ans": 2, "exp": "Correct — C: Fever, productive cough, lobar infiltrate, and S. pneumoniae on culture describe community-acquired pneumonia, for which S. pneumoniae is the most common causative organism. B, A, and D name different pathogens/mechanisms not supported by this culture result."}, {"q": "A patient with a history of immunosuppression develops a chronic cough, night sweats, and weight loss. Chest imaging reveals cavitary lesions with surrounding scar tissue. Sputum shows acid-fast bacilli. What is the underlying immune mechanism that allows this organism to persist despite the immune response?", "opts": ["This presentation is unrelated to any identifiable immune evasion mechanism", "The organism destroys all immune cells immediately, preventing any inflammatory response", "The immune system fully eradicates the organism within days of initial exposure", "The organism (M. tuberculosis) survives within macrophages while the immune response walls it off in tubercles surrounded by scar tissue"], "ans": 3, "exp": "Correct — D: Cavitary lesions with scarring and acid-fast bacilli describe tuberculosis; M. tuberculosis survives within macrophages while the immune response isolates bacterial colonies in tubercles surrounded by scar tissue, allowing persistence. B, C, and A misstate this well-described immune evasion mechanism."}, {"q": "A postoperative patient on bed rest develops sudden pleuritic chest pain, tachypnea, and hypoxemia. Doppler ultrasound reveals a deep venous thrombosis in the leg. Which pulmonary complication is most likely, and what physiologic disturbances does it cause?", "opts": ["Simple pneumothorax, a pleural air collection unrelated to the described DVT", "Pulmonary embolism, causing vascular obstruction, V̇/Q̇ mismatch, hypoxemia, and pulmonary hypertension", "Chronic bronchitis, a long-term inflammatory airway disease process entirely unrelated to the described DVT", "Laryngeal cancer, an upper airway malignancy unrelated to the described DVT"], "ans": 1, "exp": "Correct — B: Sudden pleuritic chest pain, tachypnea, and hypoxemia in a patient with a DVT are classic for pulmonary embolism (a dislodged clot from the DVT), causing vascular obstruction, V̇/Q̇ mismatch, hypoxemia, and pulmonary hypertension. A, C, and D are unrelated to the described DVT-associated complication."}, {"q": "A patient with chronic, severe COPD and long-standing pulmonary hypertension develops right ventricular enlargement and peripheral edema. Which condition is this?", "opts": ["Cor pulmonale, right ventricular enlargement/failure secondary to pulmonary hypertension", "Left heart failure from coronary artery disease, a primary cardiac process", "A congenital heart defect such as an atrial septal defect present since birth", "Rheumatic heart disease resulting from a prior streptococcal infection that permanently damaged the heart valves"], "ans": 0, "exp": "Correct — A: Right ventricular enlargement/failure developing secondary to pulmonary hypertension (itself caused by chronic lung disease) is cor pulmonale. B, C, and D describe different conditions with different primary causes."}, {"q": "A 68-year-old with a 50-pack-year smoking history presents with progressive hoarseness for several months. Which cancer should be considered, and what is a key epidemiologic feature?", "opts": ["Laryngeal cancer; occurs primarily in men and represents less than 1% of all cancers, with progressive hoarseness as a classic symptom", "Lung adenocarcinoma; presents primarily with hemoptysis rather than hoarseness", "Small cell lung carcinoma; presents primarily with bone pain from metastasis", "Bronchial carcinoid tumor; presents primarily with wheezing from airway obstruction"], "ans": 0, "exp": "Correct — A: Progressive hoarseness in a long-term smoker (typically male) is the classic presentation of laryngeal cancer, a relatively rare cancer (less than 1% of all cancers) occurring primarily in men. B, C, and D describe different lung cancer subtypes with different classic presentations, not this laryngeal-specific hoarseness pattern."}]}, {"title": "Alterations of Pulmonary Function in Children", "code": "Chapter 36", "color": "c10", "subtitle": "Upper & Lower Airway Disorders • Neonatal Respiratory Disease • Cystic Fibrosis • SIDS", "general": [{"q": "Viral croup (laryngotracheobronchitis) is usually caused by which pathogen, and what is its classic symptom?", "opts": ["Adenovirus; classically causes conjunctivitis and pharyngitis rather than a seal-like barking cough presentation", "Respiratory syncytial virus; classically causes wheezing without a barking cough", "Group A strep; classically causes a sandpaper rash and sore throat, not stridor", "Parainfluenza virus; a seal-like barking cough after rhinorrhea, sore throat, and low-grade fever"], "ans": 3, "exp": "Correct — D: Viral croup is usually caused by parainfluenza virus, producing a seal-like barking cough that develops after a few days of rhinorrhea, sore throat, and low-grade fever. B, C, and A name different pathogens/presentations, not classic viral croup."}, {"q": "How does recurrent (spasmodic) croup typically differ from viral croup in presentation?", "opts": ["It is always caused by a specific identifiable bacterial infection, unlike the viral etiology of typical croup", "It occurs only in newborns presenting with high fever and respiratory distress", "It occurs in older children with sudden nighttime onset and no fever, with unknown etiology", "It presents identically to viral croup in every clinical respect and timing"], "ans": 2, "exp": "Correct — C: Recurrent (spasmodic) croup produces a similar barking cough but occurs in older children with sudden nighttime onset, without fever, and unknown etiology — distinguishing it from typical viral croup. B, A, and D misstate these distinguishing features."}, {"q": "Since the introduction of the Hib vaccine, which pathogens are now more commonly implicated in acute epiglottitis?", "opts": ["Only fungal pathogens now cause epiglottitis, with bacteria no longer implicated", "Haemophilus influenzae type b remains the leading cause despite widespread vaccination", "GABHS, Candida species, S. aureus, MRSA, and viral pathogens", "Epiglottitis has been completely eliminated since introduction of the Hib vaccine"], "ans": 2, "exp": "Correct — C: Since Hib vaccination dramatically reduced Hib-related epiglottitis, other pathogens — GABHS, Candida, S. aureus, MRSA, and viruses — are now the usual causative agents. B, A, and D misstate the current epidemiology."}, {"q": "What factors determine the severity of a foreign body aspiration in a child's airway?", "opts": ["The time of day at which the aspiration event occurred during the child's routine", "The child's age alone, regardless of the object's location within the airway", "The color or visual appearance of the aspirated foreign body itself", "The location of the foreign body and the degree of obstruction"], "ans": 3, "exp": "Correct — D: Foreign body aspiration severity depends on the location within the airway and the degree of obstruction — laryngeal/tracheal blockage can be fatal, while bronchial obstruction may not be immediately diagnosed. B, C, and A are not the determining factors described."}, {"q": "Obstructive sleep apnea syndrome (OSAS) in children results from which mechanism?", "opts": ["A cardiac arrhythmia unrelated to any upper airway structure or sleep pattern", "Complete absence of any airway obstruction throughout the sleep cycle", "A lower airway disease process such as viral bronchiolitis, rather than any true upper airway obstruction", "Partial or complete upper airway obstruction during sleep, with snoring and disrupted sleep patterns"], "ans": 3, "exp": "Correct — D: OSAS results from partial or complete upper airway obstruction during sleep, associated with snoring, labored/obstructed breathing, and disrupted sleep. B, C, and A misstate this upper-airway-based mechanism."}, {"q": "Surfactant deficiency disorder (respiratory distress syndrome of the newborn) typically occurs in which population, and what therapies help prevent/treat it?", "opts": ["Full-term infants only, whose surfactant production is already complete at birth", "Premature infants born before surfactant production/alveolocapillary development is complete; prenatal steroids and postnatal surfactant are beneficial", "Adolescents, treated primarily with inhaled bronchodilator therapy", "Adults with chronic lung disease, treated primarily with long-term diuretic therapy"], "ans": 1, "exp": "Correct — B: SDD/RDS of the newborn occurs in premature infants born before surfactant production and alveolocapillary development are complete; prenatal steroids and postnatal surfactant therapy are beneficial preventive/treatment measures. A, C, and D misstate the affected population and appropriate therapy."}, {"q": "Bronchopulmonary dysplasia (BPD) results from which combination of factors?", "opts": ["A purely genetic disease unrelated to prematurity or mechanical ventilatory support", "Tissue injury/repair and disrupted alveolar development from ventilatory support in infants whose lungs were underdeveloped due to prematurity", "An acute viral infection occurring in otherwise healthy full-term infants", "A congenital heart defect present at birth, unrelated to ventilatory support"], "ans": 1, "exp": "Correct — B: BPD results from tissue injury/repair and disrupted alveolar development in premature infants who required ventilatory support while their lungs were still developing; surfactant therapy has improved outcomes. A, C, and D misstate BPD's cause."}, {"q": "Bronchiolitis in infants is usually caused by which virus, and what is a preventive therapy for high-risk infants?", "opts": ["Rhinovirus; prevented in high-risk infants with prophylactic surfactant therapy", "Influenza virus; treated only with antibiotic therapy targeting bacterial pathogens", "Adenovirus; prevented in high-risk infants with the routine MMR vaccine", "Respiratory syncytial virus (RSV); RSV-specific monoclonal antibody for high-risk infants (e.g., prematurity, underlying lung/heart disease)"], "ans": 3, "exp": "Correct — D: Bronchiolitis (runny nose, wheezing, cough, tachypnea in infants) is usually caused by RSV, and high-risk infants may receive RSV-specific monoclonal antibody for prevention. B, C, and A misstate the causative virus and/or prevention strategy."}, {"q": "What is the significance of bacterial community-acquired pneumonia (CAP) in children, and how is it prevented?", "opts": ["It is prevented only with antiviral medication targeting respiratory viruses", "It is a rare, inconsequential childhood illness that requires no specific preventive measures at all", "It is a leading cause of pediatric hospitalization, prevented with a pneumococcal conjugate vaccine", "It cannot be prevented by any currently available vaccine formulation"], "ans": 2, "exp": "Correct — C: Bacterial CAP is one of the leading causes of pediatric hospitalization and is prevented with a polyvalent pneumococcal conjugate vaccine. B, A, and D understate its significance or misstate the prevention strategy."}, {"q": "Pediatric asthma is characterized by which features, and what factors contribute to its origin?", "opts": ["Bronchial hyperreactivity and reversible airflow obstruction, usually allergen-triggered, with multifactorial genetic, allergic, and viral origins", "Irreversible airflow obstruction with no allergic or environmental trigger component", "A purely genetic disease with no environmental or viral triggering factors", "A disease that only affects adults, never presenting in the pediatric population"], "ans": 0, "exp": "Correct — A: Pediatric asthma involves bronchial hyperreactivity and reversible airflow obstruction, usually triggered by allergens, with multifactorial genetic, allergic, and viral-triggered origins. B, C, and D misstate asthma's reversibility and multifactorial origin."}, {"q": "How does ARDS in children differ from cardiogenic pulmonary edema?", "opts": ["ARDS produces pulmonary edema that is NOT the result of cardiac disease, typically from direct lung injury", "ARDS is always caused directly by underlying pediatric heart failure", "ARDS and cardiogenic pulmonary edema are essentially identical conditions that share the exact same underlying cause", "ARDS only occurs in the adult population, never developing in children"], "ans": 0, "exp": "Correct — A: Pediatric ARDS is a clinical syndrome of pulmonary edema that is not the result of cardiac disease, typically from direct lung injury, and can be life-threatening. B, C, and D misstate this key distinguishing feature from cardiogenic edema."}, {"q": "Cystic fibrosis is caused by what type of genetic defect, and which organ systems are most affected?", "opts": ["An X-linked disease affecting only the cardiovascular system, not other organs", "An autosomal recessive genetic disease primarily affecting the respiratory and gastrointestinal systems", "An acquired, non-genetic disease affecting only the integumentary (skin) system", "A mitochondrial disease affecting only the central and peripheral nervous system rather than other organs"], "ans": 1, "exp": "Correct — B: Cystic fibrosis is an autosomal recessive genetic disease affecting the epithelial lining of many organs, especially the respiratory and gastrointestinal systems, causing thick secretions and chronic bacterial infection. A, C, and D misstate the inheritance pattern and affected systems."}, {"q": "What has improved outcomes in cystic fibrosis in recent years?", "opts": ["New CFTR modulator medications", "Elimination of all airway clearance and respiratory therapy for CF patients", "Complete avoidance of antibiotics despite chronic bacterial airway infection", "Discontinuation of universal newborn screening programs for cystic fibrosis"], "ans": 0, "exp": "Correct — A: New CFTR modulator medications are described as improving outcomes in cystic fibrosis. B, C, and D describe changes that would not improve (and could worsen) CF management."}, {"q": "Which factors are associated with sudden infant death syndrome (SIDS)?", "opts": ["High birth weight and a supine sleeping position, both considered protective factors", "Low birth weight, prone sleeping position, and other environmental factors", "Only genetic factors, with no identified environmental or positional component", "Advanced maternal age exclusively, independent of infant sleep position or birth weight"], "ans": 1, "exp": "Correct — B: SIDS is associated with low birth weight, a prone sleeping position, and other environmental factors. A, C, and D misstate the described risk factors (notably, prone — not supine — positioning is the risk factor, since supine \"back to sleep\" positioning is protective)."}, {"q": "What has contributed to a significant reduction in SIDS cases over time?", "opts": ["Widespread adoption of safe sleep recommendations for infants", "Elimination of all routine childhood vaccinations from the immunization schedule", "Increased use of prone sleeping positions during infant naps and nighttime sleep", "Discontinuation of routine prenatal care visits throughout pregnancy"], "ans": 0, "exp": "Correct — A: Widespread adoption of safe sleep technique recommendations (e.g., back-sleeping, safe sleep environments) has significantly reduced SIDS cases. B, C, and D describe changes that would not explain (and would likely worsen) SIDS rates."}], "clinical": [{"q": "A 2-year-old develops a seal-like barking cough that began after a few days of runny nose, sore throat, and low-grade fever. Which condition is this, and what is the usual causative organism?", "opts": ["Bronchiolitis; usually caused by RSV and presenting with wheezing, not stridor", "Acute epiglottitis; usually caused by Hib and presenting with drooling and stridor", "Viral croup; usually caused by parainfluenza virus", "Cystic fibrosis; an inherited disease causing thick respiratory secretions"], "ans": 2, "exp": "Correct — C: C barking cough following several days of URI symptoms describes viral croup, usually caused by parainfluenza virus. B, A, and D describe different conditions with different classic presentations and causes."}, {"q": "A 6-year-old suddenly develops a barking cough at night with no preceding illness and no fever. Which condition is most likely, and how does it typically differ from classic viral croup?", "opts": ["Viral croup; presents identically to spasmodic croup with the same febrile prodrome", "Recurrent (spasmodic) croup; it has sudden nighttime onset without fever, occurring in older children, with unknown etiology", "Acute epiglottitis; requires emergency airway management and intubation", "A cystic fibrosis exacerbation with worsening chronic productive cough"], "ans": 1, "exp": "Correct — B: Sudden nighttime barking cough without fever in an older child, with no clear infectious prodrome, is classic for recurrent (spasmodic) croup, distinguishing it from viral croup's more gradual, febrile onset. A, C, and D do not match this specific presentation."}, {"q": "A 4-year-old, unvaccinated for Hib, presents with high fever, drooling, and stridor, appearing acutely ill and anxious. Which condition should be urgently considered, and what pathogens are now more commonly implicated since Hib vaccination became widespread?", "opts": ["Viral croup; always caused specifically by parainfluenza virus infection", "Acute epiglottitis; now often caused by GABHS, Candida, S. aureus, MRSA, or viral pathogens rather than Hib", "Bronchiolitis; always caused specifically by respiratory syncytial virus", "OSAS; caused by chronic adenotonsillar hypertrophy that obstructs the upper airway specifically during sleep"], "ans": 1, "exp": "Correct — B: High fever, drooling, and stridor in an ill-appearing child raise concern for acute epiglottitis, a potentially life-threatening emergency; since Hib vaccination, other pathogens (GABHS, Candida, S. aureus, MRSA, viruses) are now more commonly implicated. A, C, and D describe different, generally less acutely life-threatening upper airway conditions."}, {"q": "A toddler suddenly develops coughing, stridor, and dyspnea while eating peanuts. Which condition is most likely, and what determines the severity of this event?", "opts": ["Viral croup; severity in this condition depends primarily on the height of fever", "Foreign body aspiration; severity depends on the location of the object and degree of airway obstruction", "A cystic fibrosis exacerbation; severity in this condition depends primarily on the patient's specific CFTR genotype", "Bronchopulmonary dysplasia; severity depends primarily on birth weight history"], "ans": 1, "exp": "Correct — B: Sudden coughing/stridor/dyspnea during eating strongly suggests foreign body aspiration, with severity depending on the object's location (laryngeal/tracheal obstruction can be fatal) and degree of obstruction. A, C, and D do not fit this acute, activity-related presentation."}, {"q": "A 7-year-old with obesity and large tonsils is reported by parents to snore loudly and have pauses in breathing during sleep, with daytime fatigue. Which condition is most likely?", "opts": ["Cystic fibrosis, a genetic disease causing thick mucus and chronic infection", "Viral croup, an acute upper airway infection with a seal-like barking cough", "Acute epiglottitis, a sudden and potentially fatal supraglottic bacterial infection requiring urgent airway management", "Obstructive sleep apnea syndrome (OSAS), from partial/complete upper airway obstruction during sleep"], "ans": 3, "exp": "Correct — D: Snoring, breathing pauses, and disrupted sleep with daytime fatigue in a child with risk factors like obesity/large tonsils describe OSAS, from upper airway obstruction during sleep. B, C, and A describe unrelated acute or chronic conditions with different presentations."}, {"q": "A premature infant born at 28 weeks develops grunting, retractions, and hypoxemia shortly after birth. Which condition is most likely, and what preventive therapies could have reduced this risk?", "opts": ["Cystic fibrosis, a genetic disease unrelated to gestational age at birth", "Bronchopulmonary dysplasia, a later complication that develops following prolonged mechanical ventilation, not an immediate newborn presentation", "Viral croup, an upper airway infection unrelated to prematurity or surfactant status", "Surfactant deficiency disorder (RDS of the newborn); prenatal steroids and postnatal surfactant are beneficial preventive therapies"], "ans": 3, "exp": "Correct — D: Respiratory distress shortly after premature birth describes surfactant deficiency disorder/RDS, related to incomplete surfactant production and alveolocapillary development; prenatal steroids and postnatal surfactant reduce this risk. B is a later complication (often following RDS treatment with prolonged ventilation), and C and A do not fit this scenario."}, {"q": "An infant who required prolonged mechanical ventilation after premature birth continues to need supplemental oxygen at several months of age, with imaging showing disrupted alveolar development. Which condition is this?", "opts": ["Acute epiglottitis, a sudden supraglottic infection unrelated to prematurity or ventilation", "Viral croup, an acute barking-cough illness typically resolving within days", "Bronchopulmonary dysplasia (BPD)", "Obstructive sleep apnea syndrome, from upper airway obstruction during sleep"], "ans": 2, "exp": "Correct — C: Chronic oxygen need and disrupted alveolar development following prolonged ventilation in a premature infant describe bronchopulmonary dysplasia, which may require oxygen and additional therapies for many months. B, A, and D describe unrelated, non-chronic-lung-disease conditions."}, {"q": "A 4-month-old presents with runny nose, wheezing, cough, and tachypnea during winter. Which virus is the most likely cause, and which infants are at highest risk for severe disease?", "opts": ["RSV; infants with prematurity or underlying lung/heart disease are at highest risk", "Influenza; infants with no underlying risk factors at all are generally considered to be at the highest risk", "Rhinovirus; only full-term, otherwise healthy infants are considered at risk", "Adenovirus; risk of severe disease is unrelated to gestational prematurity"], "ans": 0, "exp": "Correct — A: Runny nose, wheezing, cough, and tachypnea in an infant describe bronchiolitis, usually caused by RSV, with prematurity or underlying lung/heart disease conferring the highest risk for severe disease (these infants may receive RSV-specific monoclonal antibody prophylaxis). B, C, and D misstate the typical causative virus and/or risk population."}, {"q": "A newborn is diagnosed with cystic fibrosis after newborn screening. Which two organ systems are the parents told will be most significantly affected, and what is the underlying genetic pattern?", "opts": ["Cardiovascular and renal systems; following an X-linked inheritance pattern", "Respiratory and gastrointestinal systems; autosomal recessive inheritance", "Nervous and musculoskeletal systems; following a mitochondrial inheritance pattern", "Only the integumentary (skin) system; following an autosomal dominant pattern"], "ans": 1, "exp": "Correct — B: Cystic fibrosis is an autosomal recessive disease primarily affecting the respiratory and gastrointestinal systems (among others), with thick secretions and chronic bacterial infection in the airways. A, C, and D misstate the affected systems and/or inheritance pattern."}, {"q": "A pediatrician counsels new parents on safe sleep practices to reduce SIDS risk. Which recommendations align with the described risk factors?", "opts": ["No preventive measures exist for SIDS regardless of sleep position or environment", "Encourage prone sleeping specifically to strengthen infant neck and shoulder muscles", "SIDS risk is entirely unrelated to sleep position or environmental factors", "Avoid prone sleeping position, and reduce other environmental risk factors, since low birth weight and prone positioning are associated with SIDS"], "ans": 3, "exp": "Correct — D: Since prone sleeping position and low birth weight are associated with SIDS, counseling should emphasize avoiding prone positioning and addressing modifiable environmental risk factors — consistent with safe sleep recommendations that have significantly reduced SIDS rates. B, C, and A contradict the established risk factors and preventive guidance."}, {"q": "An infant with a large ventricular septal defect and known underlying lung disease is hospitalized with bronchiolitis. Why might this infant be considered for RSV-specific monoclonal antibody prophylaxis in future RSV seasons?", "opts": ["Because prematurity or underlying lung/heart disease places infants at high risk for severe RSV disease, for whom monoclonal antibody prophylaxis is recommended", "Because monoclonal antibodies instantly cure an infant's existing bronchiolitis", "Because all infants, regardless of risk factors, receive this prophylaxis routinely", "Because this therapy is used only for bacterial, not viral, respiratory infections"], "ans": 0, "exp": "Correct — A: Infants with risk factors such as underlying heart or lung disease are at high risk for severe RSV disease and may receive RSV-specific monoclonal antibody prophylaxis to help prevent (not treat) future RSV illness. B, C, and D misstate the purpose, universality, or applicability of this prophylactic therapy."}]}, {"title": "Structure and Function of the Renal and Urologic Systems", "code": "Chapter 37", "color": "c8", "subtitle": "Renal/Urinary Anatomy • Renal Blood Flow & Filtration • Kidney Function • Tests of Renal Function • Pediatrics & Aging", "general": [{"q": "Where are the kidneys located anatomically?", "opts": ["Anterior to the peritoneum in the pelvis", "Bilaterally between T12 and L3, behind the peritoneum", "Within the thoracic cavity, cradled directly above the diaphragm on both sides", "In the midline, anterior to the aorta only"], "ans": 1, "exp": "Correct — B: The kidneys are paired structures lying bilaterally between the twelfth thoracic and third lumbar vertebrae, behind (retroperitoneal to) the peritoneum. A, C, and D misstate their location."}, {"q": "Which renal region contains the glomerulus, proximal tubule, and parts of the distal tubule?", "opts": ["The medulla", "The calyces", "The renal pelvis", "The cortex"], "ans": 3, "exp": "Correct — D: The cortex (outer region) contains the glomerulus, proximal tubule, and parts of the distal tubule, while the medulla contains the loops of Henle and collecting ducts. A reverses this, and C and B are downstream collecting structures, not filtering/reabsorptive regions."}, {"q": "What is the composition of the nephron, the urine-forming unit of the kidney?", "opts": ["Only the glomerulus and Bowman capsule, without any tubular segments at all", "Renal corpuscle, proximal tubule, loops of Henle, distal tubule, and collecting duct", "Only the renal pelvis and ureter, which merely convey formed urine downstream", "Only the bladder and urethra, structures that store and expel urine"], "ans": 1, "exp": "Correct — B: The nephron consists of the renal corpuscle (glomerulus, Bowman capsule, mesangial cells), proximal tubule, loops of Henle, distal tubule, and collecting duct. A understates the nephron's components, and C and D describe downstream urinary structures, not the nephron itself."}, {"q": "What are the components of the juxtaglomerular apparatus, and what does each sense/secrete?", "opts": ["Only podocytes, specialized epithelial cells that form filtration slits around capillaries", "Juxtaglomerular cells (renin-secreting, around the afferent arteriole), macula densa cells (sodium-sensing, distal tubule), and mesangial cells (between glomerular capillaries)", "Only the loop of Henle, which instead establishes the medullary concentration gradient", "Only the collecting duct, which instead responds to aldosterone and antidiuretic hormone to fine-tune final water and sodium reabsorption before urine is excreted, with no renin-secreting or sodium-sensing role"], "ans": 1, "exp": "Correct — B: The juxtaglomerular apparatus comprises renin-secreting juxtaglomerular cells around the afferent arteriole, sodium-sensing macula densa cells in the distal tubule, and mesangial cells between glomerular capillaries. A, C, and D misattribute these functions to the wrong structures."}, {"q": "What structural feature of the proximal tubule enhances reabsorption?", "opts": ["A thick muscular wall lining the proximal tubule", "Microvilli, which increase surface area", "The presence of one-way valves preventing tubular backflow", "Direct innervation by the vagus nerve controlling reabsorption"], "ans": 1, "exp": "Correct — B: The proximal tubule is lined with microvilli that increase surface area and enhance reabsorption of water, solutes, and electrolytes. A, C, and D do not describe the proximal tubule's key structural adaptation for reabsorption."}, {"q": "What is the function of the distal tubule regarding acid-base balance?", "opts": ["It only concentrates urine via ADH-stimulated water reabsorption", "It has no role in acid-base regulation, which occurs only in the lungs", "It only reabsorbs glucose via sodium-glucose cotransport", "It excretes acid into the urine and forms new bicarbonate ions"], "ans": 3, "exp": "Correct — D: The distal tubule adjusts acid-base balance by excreting acid into the urine and generating new bicarbonate ions. B, C, and A do not describe this specific acid-base regulatory function."}, {"q": "At what bladder volume do mechanoreceptors typically stimulate the micturition reflex?", "opts": ["250 to 300 mL", "10 to 20 mL", "1000 to 1500 mL", "Bladder volume does not trigger micturition"], "ans": 0, "exp": "Correct — A: When bladder urine volume reaches approximately 250 to 300 mL, stretch-sensitive mechanoreceptors stimulate the micturition reflex. B, C, and D do not match this described volume threshold."}, {"q": "Which hormones does the kidney secrete or activate that have systemic effects?", "opts": ["Thyroid hormone and growth hormone", "Insulin, glucagon, and cortisol", "Vitamin D, erythropoietin, and urodilatin", "Estrogen and testosterone"], "ans": 2, "exp": "Correct — C: The kidney secretes or activates vitamin D, erythropoietin, and the natriuretic hormone urodilatin, all with systemic effects. B, A, and D name hormones produced by other endocrine organs, not primarily the kidney."}, {"q": "What percentage of cardiac output does renal blood flow typically represent?", "opts": ["80% to 90%", "1% to 2%", "50% to 60%", "20% to 25%"], "ans": 3, "exp": "Correct — D: Renal blood flow is about 1000 to 1200 mL/min, representing 20% to 25% of cardiac output. B, C, and A do not match this described proportion."}, {"q": "How is glomerular capillary blood flow maintained at a constant rate despite varying arterial pressures?", "opts": ["Autoregulation of the glomerular capillaries", "Only through conscious neural control", "Only through hormonal control by the thyroid", "Blood flow is not actually regulated and varies freely"], "ans": 0, "exp": "Correct — A: Autoregulation of the glomerular capillaries maintains constant blood flow across a wide range of arterial pressures. B, C, and D misstate or dismiss this autoregulatory mechanism."}, {"q": "What effect does renin have once secreted by the juxtaglomerular apparatus?", "opts": ["It causes the generation of angiotensin II, a potent vasoconstrictor, regulating renal blood flow via RAAS", "It directly reabsorbs sodium in the proximal tubule via active transport, without any hormonal or vascular intermediary step involved", "It has no effect on blood vessels and acts solely within the adrenal cortex", "It directly increases GFR by dilating the efferent arteriole without any hormone"], "ans": 0, "exp": "Correct — A: Renin, secreted in response to decreased blood pressure, generates angiotensin II (a potent vasoconstrictor) as part of the RAAS, regulating renal blood flow. B, C, and D misstate renin's mechanism of action."}, {"q": "Which three processes make up nephron urine formation?", "opts": ["Only filtration and excretion, omitting tubular reabsorption entirely", "Glomerular filtration, tubular reabsorption, and tubular secretion/excretion", "Only secretion and reabsorption, omitting glomerular filtration entirely", "Digestion, absorption, and elimination, the sequential processes of the GI tract"], "ans": 1, "exp": "Correct — B: Urine formation involves glomerular filtration, tubular reabsorption, and tubular secretion and excretion. A and C omit one of the three processes, and D describes gastrointestinal, not renal, function."}, {"q": "Net filtration pressure (NFP) represents the balance of which forces?", "opts": ["Capillary hydrostatic pressure (favoring filtration) versus capillary oncotic pressure and Bowman capsule hydrostatic pressure (opposing filtration)", "Only capillary hydrostatic pressure acting alone, with no oncotic opposing force", "Only capillary oncotic pressure acting alone, with no hydrostatic favoring force", "Blood pH versus urine pH, values unrelated to hydrostatic or oncotic forces"], "ans": 0, "exp": "Correct — A: NFP is the balance of glomerular capillary hydrostatic pressure (favoring filtration) against capillary oncotic pressure and Bowman capsule hydrostatic pressure (both opposing filtration). B, C, and D omit or misstate these balancing forces."}, {"q": "What is the normal approximate GFR range, and what percentage of filtrate is normally reabsorbed?", "opts": ["120-140 mL/min; 99% of filtrate is reabsorbed", "10-20 mL/min; 50% of filtrate is reabsorbed", "500-600 mL/min; 10% of filtrate is reabsorbed", "1-2 mL/min; 100% of filtrate is reabsorbed"], "ans": 0, "exp": "Correct — A: Normal GFR is approximately 120 to 140 mL/min, with about 99% of the filtrate being reabsorbed (only about 1% becomes final urine). B, C, and D do not match these established values."}, {"q": "What percentage of filtered sodium and water does the proximal tubule reabsorb?", "opts": ["95% to 100%", "5% to 10%", "60% to 70%", "0%"], "ans": 2, "exp": "Correct — C: The proximal tubule reabsorbs about 60% to 70% of filtered sodium and water, and about 90% of other electrolytes. B, A, and D do not match this described proportion."}, {"q": "What is the transport maximum in renal physiology?", "opts": ["The point at which a carrier-mediated reabsorption mechanism becomes saturated, so unreabsorbed molecules are excreted in urine", "The maximum volume of urine the bladder can hold before the urge to void arises", "The upper limit of arterial blood pressure that the renal vasculature can tolerate before autoregulatory mechanisms fail completely", "The maximal rate of glomerular filtration achievable when afferent resistance is lowest"], "ans": 0, "exp": "Correct — A: Because most reabsorption is active-transport-mediated, the carrier mechanism can become saturated at the transport maximum, beyond which molecules are excreted rather than reabsorbed. B, C, and D describe different, unrelated concepts."}, {"q": "What determines the concentration or specific gravity of final urine?", "opts": ["The level of parathyroid hormone, which instead regulates calcium and phosphate balance", "The level of insulin, which instead regulates cellular glucose uptake and potassium shift", "The level of ADH, which stimulates the distal tubules/collecting ducts to reabsorb water", "Random variation in tubular flow that occurs independently of any hormonal signal"], "ans": 2, "exp": "Correct — C: Final urine concentration/specific gravity is a function of ADH level, which stimulates water reabsorption in the distal tubules and collecting ducts, aided by the medullary concentration gradient from the countercurrent exchange system. B, A, and D are not the primary regulator described."}, {"q": "Which substance, produced by muscle, is measured to estimate GFR clinically?", "opts": ["Amylase", "Glucose", "Bilirubin", "Creatinine"], "ans": 3, "exp": "Correct — D: Creatinine, a muscle-derived substance, is measured in plasma and urine to calculate a commonly used clinical estimate of GFR. B, C, and A are not used for this specific purpose."}, {"q": "Besides plasma creatinine, which other markers are used to estimate glomerular function, and what does BUN also indicate?", "opts": ["Hemoglobin A1c and troponin; troponin indicates cardiac injury", "Cystatin C and BUN; BUN also indicates hydration status", "Bilirubin and ALT; ALT indicates liver function only", "Amylase and lipase; indicating pancreatic function only"], "ans": 1, "exp": "Correct — B: Cystatin C and BUN are also used to estimate glomerular function, with BUN additionally serving as an indicator of hydration status. A, C, and D name markers unrelated to renal function assessment."}, {"q": "Which elements are evaluated as part of a standard urinalysis?", "opts": ["Only fasting blood glucose, a marker used mainly for diabetes screening", "Only blood type and Rh factor, used for transfusion compatibility testing", "Only serum sodium, potassium, chloride, and bicarbonate concentrations measured on a basic metabolic panel", "Color, turbidity, protein, pH, specific gravity, sediment, and supernatant"], "ans": 3, "exp": "Correct — D: Urinalysis evaluates color, turbidity, protein, pH, specific gravity, sediment, and supernatant, with sediment findings (bacteria, cells, casts, crystals) suggesting renal or bladder disorders. B, C, and A describe unrelated tests."}, {"q": "By what age does GFR typically reach adult levels in infants?", "opts": ["5 to 6 years of age", "At birth", "2 to 3 months of age", "18 years of age"], "ans": 2, "exp": "Correct — C: GFR reaches adult levels by 2 to 3 months of age. B, A, and D do not match this described developmental timeline."}, {"q": "Why do infants and children produce more dilute urine than adults?", "opts": ["Complete tubular maturation present from birth, matching adult concentrating ability", "Lower relative blood flow and longer loops of Henle than in adults", "Higher blood flow and shorter loops of Henle compared with adults", "Excess ADH secretion in infancy overwhelming the collecting duct response"], "ans": 2, "exp": "Correct — C: Infants/children have more dilute urine because of higher relative blood flow and shorter loops of Henle; tubular maturation is not complete until adolescence. B, A, and D misstate these pediatric renal physiologic differences."}, {"q": "Why are children more vulnerable than adults to fluid imbalances from diarrhea or infection?", "opts": ["Children have no functioning renal regulatory mechanisms at all, from birth through late adolescence", "Their kidneys are larger relative to body size, providing excess reserve", "Their limited ability to quickly regulate changes in pH or osmotic pressure", "Children have a lower total body water percentage than adults"], "ans": 2, "exp": "Correct — C: Children are more affected by fluid imbalances because of their limited ability to quickly regulate pH or osmotic pressure changes. B, A, and D misstate the described vulnerability and its basis (children actually have a higher, not lower, body water percentage)."}, {"q": "What happens to the number and size of nephrons with normal aging?", "opts": ["Neither changes with age", "Both increase", "Number decreases but size increases", "Both decrease"], "ans": 3, "exp": "Correct — D: With aging, both the number and size of nephrons decrease, along with declining renal blood flow and GFR. B, C, and A do not match the described aging pattern."}, {"q": "How does aging affect the kidney's response to acid-base changes and drug elimination?", "opts": ["Aging has no measurable effect on acid-base regulation or drug clearance", "Response to acid-base changes becomes faster and more efficient with age", "Drug elimination improves with age as renal blood flow increases", "Response to acid-base changes is delayed, and renally eliminated drugs can accumulate, causing toxicity"], "ans": 3, "exp": "Correct — D: Aging delays the renal response to acid-base changes and glucose reabsorption, and drugs eliminated by the kidney can accumulate in the plasma, causing toxic reactions. B, C, and A contradict these described age-related declines."}], "clinical": [{"q": "A patient with severe hypotension shows compensatory activation of the renin-angiotensin-aldosterone system. Which cells initiate this response, and what triggers them?", "opts": ["Juxtaglomerular cells, triggered by decreased blood pressure, releasing renin", "Macula densa cells, triggered by increased distal tubular sodium delivery, releasing aldosterone directly", "Podocytes, triggered by proteinuria, releasing angiotensin II", "Mesangial cells, triggered by hyperglycemia, releasing insulin"], "ans": 0, "exp": "Correct — A: Juxtaglomerular cells sense decreased blood pressure and release renin, initiating the RAAS cascade that generates angiotensin II. B, C, and D misattribute this triggering role to the wrong cell types/stimuli."}, {"q": "A patient's lab results show a glomerular capillary hydrostatic pressure that favors filtration, opposed by capillary oncotic pressure and Bowman capsule hydrostatic pressure. If the patient develops severe hypoalbuminemia, how would net filtration pressure be affected?", "opts": ["NFP would tend to increase, since decreased plasma protein lowers the opposing oncotic pressure", "NFP would decrease, since hypoalbuminemia paradoxically raises capillary oncotic pressure", "NFP would be completely unaffected, since albumin has no role in oncotic pressure", "NFP is determined solely by tubular flow rate, unrelated to any of these pressures"], "ans": 0, "exp": "Correct — A: Since capillary oncotic pressure (largely from plasma proteins like albumin) opposes filtration, a drop in albumin reduces this opposing force, tending to increase net filtration pressure. B, C, and D misapply or dismiss the relationship between oncotic pressure and NFP."}, {"q": "A patient taking a medication that saturates its renal tubular reabsorption carrier system develops the drug's excretion in urine despite normally being fully reabsorbed. What renal concept explains this?", "opts": ["ADH secretion has ceased completely, eliminating all water reabsorption in the collecting duct system entirely", "The glomerulus has stopped filtering entirely, producing complete anuria", "The transport maximum has been reached, so additional drug is excreted rather than reabsorbed", "This indicates the patient has developed acute kidney injury from tubular toxicity"], "ans": 2, "exp": "Correct — C: When a carrier-mediated reabsorption system becomes saturated (its transport maximum), additional filtered substance is excreted in the urine rather than reabsorbed. B, A, and D do not explain this specific transport-limited phenomenon."}, {"q": "A dehydrated patient has high ADH levels. What effect would this have on urine concentration, and which structures mediate this effect?", "opts": ["Concentrated urine, mediated by ADH-stimulated water reabsorption in the distal tubules and collecting ducts", "Dilute urine, mediated by ADH-stimulated water excretion from the proximal tubule", "No effect on urine concentration, since ADH acts only on the heart and vessels", "ADH only affects the proximal tubule, having no receptors in the distal nephron"], "ans": 0, "exp": "Correct — A: High ADH levels (as in dehydration) stimulate water reabsorption in the distal tubules and collecting ducts, producing concentrated urine with a higher specific gravity. B, C, and D misstate ADH's site and direction of effect."}, {"q": "A clinician orders plasma creatinine, cystatin C, and BUN for a patient with suspected kidney dysfunction. Which of these values would also give information about the patient's hydration status?", "opts": ["None of these values relate to hydration", "Cystatin C only", "Creatinine only", "BUN"], "ans": 3, "exp": "Correct — D: In addition to estimating glomerular function, BUN is also an indicator of hydration status (BUN rises disproportionately to creatinine in volume-depleted states). B, C, and A do not reflect this additional utility of BUN specifically."}, {"q": "A urinalysis reveals red blood cell casts and elevated protein in the sediment. What does this finding most likely suggest?", "opts": ["Only a dietary issue reflecting recent high-protein food intake", "A completely normal urinalysis requiring no further workup", "A renal or bladder disorder, based on abnormal urine sediment findings", "A liver function abnormality reflected only by elevated urine bilirubin and urobilinogen levels"], "ans": 2, "exp": "Correct — C: The presence of red blood cells, casts, or other abnormal sediment findings on urinalysis may indicate an underlying renal or bladder disorder. B, A, and D dismiss or misattribute this significant finding."}, {"q": "A newborn's kidney function is being assessed. At what age would the nurse expect GFR to have reached adult levels, and what does this imply about renal drug dosing in very young infants before this point?", "opts": ["Adult GFR levels are reached by age 10; renal drug dosing is unnecessary before that point", "Adult GFR levels are reached at birth; no dosing adjustment is ever needed", "Adult GFR levels are reached by 2-3 months; before this, drug dosing must account for immature, lower renal clearance", "GFR never reaches adult levels in children, mandating lifelong dose reduction"], "ans": 2, "exp": "Correct — C: Since GFR does not reach adult levels until 2-3 months of age, renally cleared medications require careful dosing consideration in younger infants due to immature renal clearance. B, A, and D misstate this developmental timeline and its clinical implication."}, {"q": "An 80-year-old patient is prescribed a renally cleared medication at a standard adult dose. Which age-related renal change most increases this patient's risk of drug toxicity?", "opts": ["Improved tubular reabsorption with aging, which paradoxically enhances renal drug reabsorption efficiency overall", "Increased nephron number with aging, expanding overall filtering capacity", "Decreased nephron number/size and declining GFR/renal blood flow with aging, reducing drug clearance", "Aging kidneys clear renally-eliminated drugs faster than immature pediatric kidneys"], "ans": 2, "exp": "Correct — C: Aging decreases nephron number/size and renal blood flow/GFR, reducing the clearance of renally eliminated drugs and increasing toxicity risk. B, A, and D contradict the described age-related renal decline."}, {"q": "A toddler develops severe diarrhea and is brought to the emergency department with signs of dehydration and altered acid-base status. Why are children particularly vulnerable to this type of rapid deterioration compared with adults?", "opts": ["Children have a limited ability to quickly regulate changes in pH or osmotic pressure", "Children have more renal reserve than adults, buffering against fluid loss", "Children's kidneys are more efficient at compensating for fluid loss than adult kidneys", "This vulnerability only applies to adolescents, not toddlers"], "ans": 0, "exp": "Correct — A: Children's limited ability to rapidly regulate pH and osmotic pressure changes makes them more vulnerable to fluid/electrolyte imbalances from conditions like diarrhea. B, C, and D contradict this described pediatric vulnerability."}]}, {"title": "Alterations of Renal and Urinary Tract Function", "code": "Chapter 38", "color": "c9", "subtitle": "Urinary Tract Obstruction • UTI • Glomerular Disorders • Acute Kidney Injury • Chronic Kidney Disease", "general": [{"q": "Urinary tract obstruction can be classified as which two types?", "opts": ["Only anatomic in nature, never functional in origin", "Anatomic (structural) or functional", "Only infectious, arising exclusively from bacterial colonization", "Only congenital, present from birth in every affected patient"], "ans": 1, "exp": "Correct — B: Urinary tract obstruction may be anatomic (structural) or functional, occurring anywhere in the tract and dilating structures proximal to the blockage. A, C, and D do not capture both described obstruction types."}, {"q": "What are common causes of upper urinary tract obstruction?", "opts": ["Only urethral strictures, a cause of lower rather than upper tract obstruction", "Kidney stones or tumors within the kidney, or compression from a tumor/stone/fibrosis along the ureter or ureterovesical junction", "Only prostate enlargement, a lower urinary tract obstruction cause", "Only bladder tumors obstructing outflow from the bladder itself"], "ans": 1, "exp": "Correct — B: Upper urinary tract obstruction is caused by kidney stones/tumors within the kidney, or compression along the ureter or at the ureter-bladder junction. A, C, and D describe lower urinary tract obstruction causes instead."}, {"q": "What are recognized complications of upper urinary tract obstruction?", "opts": ["Increased urine dilution with no structural, functional, or clinically significant consequence at all", "Improved renal function from decompression of the collecting system", "Hydronephrosis, hydroureter, ureterohydronephrosis, and tubulointerstitial fibrosis", "Decreased infection risk from continuous, unobstructed urine flow"], "ans": 2, "exp": "Correct — C: Upper urinary tract obstruction complications include hydronephrosis, hydroureter, ureterohydronephrosis, and tubulointerstitial fibrosis, along with increased infection risk. B, A, and D misstate the consequences of obstruction."}, {"q": "What compensates for the loss of function in a kidney affected by obstructive disease?", "opts": ["Immediate regeneration of the obstructed kidney's own damaged nephrons", "Hypertrophy and hyperfunction of the unobstructed (contralateral) kidney", "No compensation is possible once obstruction develops", "The bladder takes over the kidney's filtration role entirely"], "ans": 1, "exp": "Correct — B: The unobstructed kidney undergoes compensatory hypertrophy and hyperfunction to offset the affected kidney's loss of function. A, C, and D misstate or deny this compensatory mechanism."}, {"q": "What complication commonly follows relief of urinary tract obstruction?", "opts": ["Permanent loss of kidney function in all cases", "Immediate and complete cessation of all urine output entirely once the obstruction is surgically removed", "Postobstructive diuresis, which may cause fluid and electrolyte imbalance", "No physiologic change occurs after the obstruction is relieved"], "ans": 2, "exp": "Correct — C: Relief of obstruction is usually followed by postobstructive diuresis, which can cause fluid and electrolyte imbalances. B, A, and D misstate this well-recognized post-relief phenomenon."}, {"q": "What is the most common composition of kidney stones?", "opts": ["Calcium oxalate", "Uric acid", "Struvite", "Cystine"], "ans": 0, "exp": "Correct — A: The most common kidney stone is formed from calcium oxalate. B, C, and D are less common stone compositions, not the most common."}, {"q": "Kidney stones form due to which underlying process?", "opts": ["Only bacterial infection, with absolutely no urinary chemical or crystallization component involved", "Excess urine dilution that prevents any solute from precipitating out", "A completely random process unrelated to urine composition", "Supersaturation of urine with precipitation of stone-forming substances and changes in urine pH"], "ans": 3, "exp": "Correct — D: Kidney stones are caused by supersaturation of urine with precipitation of stone-forming substances, influenced by changes in urine pH. B, C, and A misstate this chemical/physiologic mechanism."}, {"q": "What are recognized anatomic causes of lower urinary tract (LUT) obstruction?", "opts": ["Only renal artery stenosis, a vascular not obstructive urinary condition", "Only kidney stones lodged in the renal pelvis or proximal ureter", "Only glomerulonephritis, an inflammatory disease unrelated to obstruction", "Urethral stricture, prostatic enlargement in men, pelvic prolapse in women, and tumor compression"], "ans": 3, "exp": "Correct — D: Anatomic LUT obstruction causes include urethral stricture, prostatic enlargement, pelvic prolapse, and tumor compression, related to urine storage/emptying dysfunction. B, C, and A describe upper urinary tract or unrelated renal conditions."}, {"q": "What structural bladder change occurs with persistent partial obstruction over time?", "opts": ["Deposition of collagen in the bladder wall, decreasing compliance and impairing detrusor contraction", "Complete regeneration of entirely normal bladder tissue immediately after the obstruction fully resolves", "Immediate bladder rupture occurring in every obstructed case", "Increased bladder wall elasticity with improved emptying"], "ans": 0, "exp": "Correct — A: Persistent partial obstruction leads to collagen deposition in the bladder wall over time, decreasing bladder wall compliance and causing ineffective detrusor contraction. B, C, and D misstate this chronic structural change."}, {"q": "Overactive bladder (OAB) syndrome is characterized by which pattern of dysfunction?", "opts": ["Uncontrollable or premature bladder contraction causing urgency, frequency, and nocturia (with or without incontinence)", "Complete inability to store any urine, causing continuous leakage", "Prolonged, difficult bladder emptying with no effect on the storage phase", "Absence of any urinary symptoms despite underlying detrusor overactivity"], "ans": 0, "exp": "Correct — A: OAB is a urine storage dysfunction with uncontrollable/premature bladder contraction, producing urgency, frequency, and nocturia, with or without incontinence. B, C, and D do not match the description of OAB."}, {"q": "Underactive bladder (UAB) syndrome is characterized by which voiding pattern?", "opts": ["No effect on bladder emptying time regardless of detrusor tone", "Rapid, complete bladder emptying occurring faster than the normal time span", "Uncontrollable urgency and frequency, the classic pattern instead seen in overactive bladder syndrome", "Prolonged bladder emptying or failure to achieve complete emptying within a normal time span"], "ans": 3, "exp": "Correct — D: UAB syndrome involves prolonged bladder emptying or incomplete emptying, or both, within a normal voiding time span — essentially the functional opposite of OAB. B, C, and A misstate this voiding dysfunction pattern."}, {"q": "What is the underlying cause of a neurogenic bladder?", "opts": ["A dietary deficiency in vitamin B12 affecting peripheral nerve conduction", "A structural stone within the bladder", "A neural lesion that interrupts innervation of the bladder", "An autoimmune reaction limited to the kidney"], "ans": 2, "exp": "Correct — C: Neurogenic bladder is caused by a neural lesion interrupting normal bladder innervation. B, A, and D do not describe this neurologically based bladder dysfunction."}, {"q": "Upper motor neuron lesions above the pontine micturition center typically result in which bladder pattern?", "opts": ["Underactive, atonic bladder function typical of sacral nerve damage", "Overactive (hyperreflexive) bladder function and bladder dyssynergia", "No change in bladder function despite the spinal cord lesion", "Complete bladder paralysis with no reflex activity"], "ans": 1, "exp": "Correct — B: Lesions above the pontine micturition center cause overactive (hyperreflexive) bladder function with dyssynergia (loss of coordinated neuromuscular contraction). A, C, and D describe patterns associated with lower (sacral/peripheral), not upper, motor neuron lesions."}, {"q": "Lesions in the sacral spinal cord or peripheral nerves typically result in which bladder pattern?", "opts": ["No effect on bladder function despite the peripheral nerve injury", "Overactive, hyperreflexive bladder function", "Underactive, hypotonic, or atonic bladder function", "Only affects bowel function, not bladder"], "ans": 2, "exp": "Correct — C: Sacral or peripheral nerve lesions typically cause underactive, hypotonic, or atonic bladder function, in contrast to the overactive pattern seen with lesions above the pontine micturition center. B, A, and D misstate this relationship."}, {"q": "Detrusor sphincter dyssynergia results in which functional problem?", "opts": ["A structural stone lodged at the ureteropelvic junction, blocking flow", "Complete absence of any detrusor contraction during the voiding phase", "Excessive, completely unimpeded urine flow with no urethral or sphincter resistance whatsoever present at any point throughout the entire voiding cycle", "Failure of the urethrovesical junction smooth muscle to release urine during bladder contraction, causing functional obstruction"], "ans": 3, "exp": "Correct — D: Detrusor sphincter dyssynergia is failure of the urethrovesical sphincter to relax/release urine during detrusor contraction, causing a functional (not anatomic) obstruction. B, C, and A misstate this specific neuromuscular coordination problem."}, {"q": "Which is the most common type of kidney (renal) tumor, and where can it metastasize?", "opts": ["Wilms tumor, a pediatric embryonal tumor rarely seen in adults", "Renal adenoma, a small benign lesion that essentially never metastasizes", "Renal cell carcinoma (RCC); can metastasize to lung, lymph nodes, liver, bone, thyroid, and CNS", "Bladder transitional cell carcinoma; confined to the kidney"], "ans": 2, "exp": "Correct — C: Renal cell carcinoma is the most common kidney tumor and can metastasize widely, including to the lung, lymph nodes, liver, bone, thyroid gland, and central nervous system. B, A, and D misstate the tumor type, metastatic potential, or affected population."}, {"q": "What is a characteristic feature of bladder tumors?", "opts": ["They are always entirely benign in nature, with absolutely no possibility of ever recurring after resection", "They are commonly composed of transitional cells with a papillary appearance and a high recurrence rate", "They only occur in children, unlike most adult urothelial cancers", "They only occur in children"], "ans": 1, "exp": "Correct — B: Bladder tumors are commonly transitional cell tumors with a papillary appearance and a high rate of recurrence. A, C, and D misstate these characteristic features."}, {"q": "What distinguishes an uncomplicated UTI from a complicated UTI?", "opts": ["An uncomplicated UTI occurs in a normal urinary system; a complicated UTI occurs when there is an underlying abnormality", "Uncomplicated UTIs are always far more severe than complicated UTIs", "There is no meaningful distinction, since both involve identical pathogens", "Complicated UTIs occur only in men with prostatic obstruction"], "ans": 0, "exp": "Correct — A: UTIs are uncomplicated when the urinary system is structurally/functionally normal, and complicated when an abnormality is present. B, C, and D misstate this standard distinction."}, {"q": "Which host defenses help protect against UTI?", "opts": ["Only the intact skin barrier, which blocks pathogen entry through the epidermis and mucous membranes throughout the entire body, unrelated to urine composition or flow", "High osmolality/acidic urine pH, mucus, uromodulin and other antimicrobial proteins, sphincters preventing reflux, and urine flow washing out bacteria", "Only circulating white blood cells combating systemic bloodstream infection", "Only gastric stomach acid, which neutralizes ingested pathogens"], "ans": 1, "exp": "Correct — B: Host defenses against UTI include urine's high osmolality/acidic pH, mucus, uromodulin/antimicrobial proteins, anti-reflux sphincters, and the flushing action of urine flow. A, C, and D do not describe these urinary-tract-specific defenses."}, {"q": "What virulence factors help uropathogens colonize the urinary tract?", "opts": ["Only flagella, providing motility but no adhesive binding capacity", "A thick polysaccharide capsule that resists phagocytosis but does not adhere", "The complete absence of any surface structures capable of host cell binding", "Pili/fimbriae (promoting binding and retrograde movement) and biofilm formation (enhancing colonization and resisting host defenses/antimicrobials)"], "ans": 3, "exp": "Correct — D: Virulent uropathogens use pili/fimbriae to bind uroepithelium and move retrograde in the tract, and form biofilms that enhance colonization and resist host defenses/antimicrobial therapy. B, C, and A do not describe these virulence mechanisms."}, {"q": "Interstitial cystitis/painful bladder syndrome is defined by which criteria?", "opts": ["A congenital bladder malformation present and diagnosed at birth", "A bacterial infection lasting less than 1 week, confirmed by a positive urine culture and cystoscopic findings, and fully resolving after a short course of targeted antibiotics", "LUT symptoms for more than 6 weeks in the absence of infection or other identifiable cause, likely related to an autoimmune/inflammatory glycosaminoglycan layer derangement", "A papillary tumor of the bladder mucosa composed of transitional cells"], "ans": 2, "exp": "Correct — C: Interstitial cystitis/painful bladder syndrome involves LUT symptoms for over 6 weeks without infection or other identifiable cause, likely from an inflammatory/autoimmune process disrupting the protective glycosaminoglycan bladder lining. B, A, and D misstate this condition's definition."}, {"q": "What are the most common underlying risk factors for acute pyelonephritis?", "opts": ["Excess fluid intake that dilutes and flushes bacteria from urine", "Urinary obstruction and reflux of urine from the bladder", "Low dietary protein intake affecting overall nutritional status", "Regular exercise, with no established link to ascending infection"], "ans": 1, "exp": "Correct — B: Urinary obstruction and vesicoureteral reflux are the most common underlying risk factors for acute pyelonephritis (upper urinary tract infection). A, C, and D are not identified as risk factors for this condition."}, {"q": "What is the long-term consequence of untreated chronic pyelonephritis?", "opts": ["It has no measurable effect on long-term renal function", "It always resolves spontaneously with no lasting effect", "It only affects the bladder, never the kidneys", "It can lead to kidney failure through scarring and altered renal function"], "ans": 3, "exp": "Correct — D: Chronic pyelonephritis, often from ascending infection and obstructive uropathy, causes renal scarring and altered function, and untreated can progress to kidney failure. B, C, and A understate or misstate this serious long-term risk."}, {"q": "Glomerular disorders can be classified as primary or secondary based on which distinction?", "opts": ["Primary disorders always arise from systemic disease processes; secondary disorders are isolated causes confined only to the kidney itself", "Primary disorders are caused by immune injury, infection, ischemia, toxins/drugs, or vascular disorders isolated to the kidney; secondary disorders are caused by systemic disease", "There is no meaningful distinction whatsoever, since both categories share identical causes, identical mechanisms, and pathology confined only to the kidney itself in every documented case", "Primary disorders occur exclusively in children; secondary disorders occur exclusively in older adults"], "ans": 1, "exp": "Correct — B: Primary glomerular disorders arise from causes isolated to the kidney (immune injury, infection, ischemia, toxins, vascular disease), while secondary disorders result from systemic disease. A, C, and D misstate or dismiss this distinction."}, {"q": "Which immune mechanisms contribute to acute glomerulonephritis?", "opts": ["Only direct bacterial invasion and destruction of glomerular capillary loops, with no immune component at all", "Deposition of circulating immune complexes, in situ antibody reactions to planted antigens, antibodies against the glomerular basement membrane, and complement activation", "Only a dietary trigger such as excess dietary sodium, with no immune involvement", "Only an inherited genetic mutation in type IV collagen, with no immune mechanism"], "ans": 1, "exp": "Correct — B: Acute glomerulonephritis results from immune reactions including circulating immune complex deposition, in situ antibody-antigen reactions, anti-GBM antibodies, and complement activation. A, C, and D misstate the immune basis of this condition."}, {"q": "What is the most common cause of glomerular injury progressing to chronic kidney disease?", "opts": ["Diabetic nephropathy", "Lupus nephritis", "Acute poststreptococcal glomerulonephritis", "Renal cell carcinoma"], "ans": 0, "exp": "Correct — A: Diabetic nephropathy is the most common cause of glomerular injury progressing to CKD, related to chronic hyperglycemia and micro/macrovascular complications. B, C, and D are recognized causes of glomerular disease but not the most common overall cause of progression to CKD."}, {"q": "Lupus nephritis develops through which autoimmune mechanism?", "opts": ["A purely inherited genetic mutation in podocyte structural proteins, with absolutely no autoantibody involvement whatsoever", "A direct bacterial infection of the glomerulus by nephritogenic organisms", "Autoantibodies against double-stranded DNA and nucleosomes, with glomerular immune complex deposition", "Excess vitamin D activation increasing intestinal calcium absorption"], "ans": 2, "exp": "Correct — C: Lupus nephritis results from autoantibodies against double-stranded DNA and nucleosomes, forming immune complexes that deposit in (or form against planted antigens in) the glomerulus. B, A, and D misstate this autoimmune mechanism."}, {"q": "Nephrotic syndrome is defined by which minimum daily protein excretion, and what is the underlying cause?", "opts": ["At least 0.5 g/day, resulting from isolated proximal tubular dysfunction", "At least 3.5 g/day, primarily from glomerular injury with increased capillary permeability and loss of membrane negative charge", "At least 10 g/day, resulting from chronic bladder mucosal inflammation", "No specific threshold applies; even trace proteinuria meets the definition"], "ans": 1, "exp": "Correct — B: Nephrotic syndrome is defined by excretion of at least 3.5 g of protein (primarily albumin) per day, from glomerular injury increasing capillary permeability and reducing the membrane's protective negative charge. A, C, and D do not match this definition."}, {"q": "How does nephritic syndrome differ from nephrotic syndrome in typical presentation?", "opts": ["The two syndromes are clinically identical, with no distinguishing features", "Nephritic syndrome always produces far more severe, heavier proteinuria than nephrotic syndrome does in virtually every clinical case encountered", "Nephritic syndrome features hematuria and RBC casts with less severe proteinuria, compared with nephrotic syndrome's heavier proteinuria", "Nephritic syndrome never involves the glomerulus, arising solely from tubular injury"], "ans": 2, "exp": "Correct — C: Nephritic syndrome is characterized by hematuria and RBC casts with less severe proteinuria, distinguishing it from the heavier (≥3.5 g/day), protein-dominant picture of nephrotic syndrome. B, A, and D misstate this distinction."}, {"q": "What are shared manifestations of both nephrotic and nephritic syndrome?", "opts": ["Only hypertension, with no other laboratory or clinical findings in common", "None; the two syndromes share absolutely no overlapping clinical manifestations", "Edema, hypoproteinemia, proteinuria, hyperlipidemia, lipiduria, vitamin D deficiency, and hypothyroidism", "Only fever, with no other shared laboratory or clinical findings"], "ans": 2, "exp": "Correct — C: Both nephrotic and nephritic syndrome can present with edema, hypoproteinemia, proteinuria, hyperlipidemia, lipiduria, vitamin D deficiency, and hypothyroidism, though the degree of proteinuria/hematuria differs. B, A, and D misstate the shared manifestations."}, {"q": "Acute kidney in
